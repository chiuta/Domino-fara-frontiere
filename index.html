<style>

html[data-size="large"]{ font-size:18.5px; }
html[data-size="small"]{ font-size:15px; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ font-size:16.5px; -webkit-text-size-adjust:100%; }
body{

.wrap{ max-width:1180px; margin:0 auto; padding:14px 16px 84px; }

:focus-visible{ outline:3px solid var(--gold2); outline-offset:2px; }
[hidden]{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- antet ---------- */
header.top{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:16px; }
.brand{ margin-right:auto; min-width:0; }

.brand h1 .dd{ color:var(--gold2); font-family:var(--mono); letter-spacing:0; }
.brand .sub{ color:var(--ink3); font-family:var(--sans); font-size:.82rem; margin-top:3px; }
.toolbar{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.btn{ font-family:var(--sans); background:var(--panel2); color:var(--ink); border:1px solid var(--line2); border-radius:10px; min-height:44px; min-width:44px; padding:8px 14px; cursor:pointer; font-size:.95rem; display:inline-flex; align-items:center; justify-content:center; gap:6px; line-height:1.15; }
.btn:hover{ border-color:var(--gold2); background:var(--raise); }

.btn.sm{ min-height:44px; padding:6px 12px; font-size:.9rem; }
.btn[aria-pressed="true"]{ background:var(--gold); color:var(--goldtxt); border-color:var(--gold); font-weight:700; }
select.btn{ appearance:auto; padding-right:8px; }

nav.tabs{ display:flex; gap:6px; margin:0 0 14px; }
nav.tabs .btn{ flex:0 1 auto; }

/* ---------- atlas ---------- */
.intro{ background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; margin-bottom:14px; box-shadow:var(--sh); }
.intro p{ margin:.4em 0; color:var(--ink2); max-width:72ch; }
.intro .lead{ color:var(--ink); font-size:1.06rem; }
.stats{ display:flex; gap:20px; flex-wrap:wrap; margin-top:10px; }
.stat b{ font-family:var(--mono); color:var(--gold2); font-size:1.3rem; display:block; }
.stat span{ color:var(--ink3); font-family:var(--sans); font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; }
.controls-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
.chips{ display:flex; gap:7px; flex-wrap:wrap; }
.chip{ font-family:var(--sans); background:var(--panel); border:1px solid var(--line2); color:var(--ink2); padding:9px 14px; min-height:44px; border-radius:999px; cursor:pointer; font-size:.88rem; }
.chip[aria-pressed="true"]{ background:var(--gold); color:var(--goldtxt); border-color:var(--gold); font-weight:700; }
.chip:hover{ border-color:var(--gold2); }
.search{ margin-left:auto; }
.search input{ font-family:var(--sans); background:var(--panel); border:1px solid var(--line2); color:var(--ink); border-radius:10px; padding:10px 12px; min-height:44px; min-width:180px; width:100%; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:14px; }
.card{ background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:9px; position:relative; }
.card:hover{ border-color:var(--gold); }
.card h2, .card h3{ font-size:1.2rem; margin:0; letter-spacing:.02em; font-weight:600; }
.card .tilepair{ display:flex; gap:6px; align-items:center; }
.card .tilepair svg{ height:44px; width:22px; }
.meta{ display:flex; flex-wrap:wrap; gap:6px; font-family:var(--sans); font-size:.76rem; }
.tag{ padding:3px 10px; border-radius:999px; border:1px solid var(--line2); color:var(--ink2); background:rgba(255,255,255,.03); }
.tag.play{ border-color:rgba(143,207,138,.5); color:var(--ok); }
.tag.only{ border-color:rgba(164,150,123,.6); color:var(--ink3); }
.tag.warn{ border-color:rgba(240,192,90,.6); color:var(--warn); }
.card p.desc{ color:var(--ink2); font-size:.95rem; margin:0; flex:1; }
.card .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.rules{ border-top:1px dashed var(--line2); padding-top:8px; margin-top:2px; color:var(--ink2); font-size:.92rem; }
.rules h4{ margin:.7em 0 .2em; font-family:var(--sans); font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gold2); }
.rules ul{ margin:.2em 0 .4em; padding-left:1.15em; }
.rules li{ margin:.25em 0; }
.rules .warnbox{ border:1px solid rgba(240,192,90,.55); border-radius:10px; padding:8px 12px; background:rgba(240,192,90,.07); color:var(--ink); }
.rules .noteen{ color:var(--ink3); font-family:var(--sans); font-size:.8rem; }

/* ---------- joc ---------- */
.gamebar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
.gamebar h2{ margin:0 auto 0 0; font-size:1.25rem; font-weight:600; }
.status{ background:var(--panel); border:1px solid var(--line2); border-left:5px solid var(--gold); border-radius:10px; padding:10px 14px; min-height:3.1em; font-family:var(--sans); font-size:1rem; margin-bottom:10px; }
.status.me{ border-left-color:var(--ok); }
.panels{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.pp{ flex:1 1 150px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px; font-family:var(--sans); font-size:.9rem; min-width:0; }
.pp.turn{ border-color:var(--gold2); box-shadow:0 0 0 2px rgba(232,200,122,.35); }
.pp .nm{ font-weight:700; display:flex; justify-content:space-between; gap:8px; }
.pp .sc{ font-family:var(--mono); color:var(--gold2); }
.pp .sub{ color:var(--ink3); font-size:.8rem; }
.pp .backs{ display:flex; flex-wrap:wrap; gap:3px; margin-top:5px; }
.pp .backs i{ display:block; width:11px; height:22px; border-radius:2px; background:linear-gradient(180deg,#6d5a34,#43361d); border:1px solid #1d1710; }

.pp .faces svg{ width:18px; height:36px; }
.table{ background:radial-gradient(900px 400px at 50% 40%, var(--felt1), var(--felt2)); border:1px solid var(--feltline); border-radius:var(--r); position:relative; box-shadow:inset 0 0 40px rgba(0,0,0,.45); }
.boardtools{ position:absolute; right:8px; top:8px; display:flex; gap:6px; z-index:5; }

.boardwrap{ overflow:auto; max-height:min(62vh,640px); min-height:200px; padding:10px; touch-action:pan-x pan-y pinch-zoom; -webkit-overflow-scrolling:touch; border-radius:var(--r); }
.boardwrap svg{ display:block; margin:0 auto; max-width:none; }
.boardempty{ color:#e9e1c9; text-align:center; padding:60px 16px; font-family:var(--sans); }
.t-rect{ fill:var(--tile); stroke:var(--tilestroke); stroke-width:.06; }
.t-div{ stroke:var(--tilestroke); stroke-width:.05; }
.t-last .t-rect{ stroke:var(--gold2); stroke-width:.14; }
.pip{ fill:var(--pip); }
.pipnum{ fill:var(--pip); font-family:var(--sans); font-weight:700; text-anchor:middle; dominant-baseline:central; }
.ghosttile{ opacity:.4; }
.bandlabel{ fill:#e9e1c9; font-family:var(--sans); font-size:1.05px; }

.endhint text{ fill:#f1e8d3; font-family:var(--sans); font-size:1.15px; font-weight:700; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
.endhint.ok rect{ fill:rgba(232,200,122,.28); opacity:1; stroke-width:.14; }

.markerdot{ fill:#e8c87a; stroke:#1a1206; stroke-width:.06; }

.handarea{ margin-top:10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:10px 10px 12px; }
.handarea h3{ margin:0 0 6px; font-family:var(--sans); font-size:.8rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); font-weight:600; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.hand{ display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end; min-height:calc(var(--tw)*2); }

.tilebtn.sel{ transform:translateY(-14px); }
.tilebtn.sel .t-rect, .tilebtn.can .t-rect{ stroke:var(--gold2); stroke-width:.14; }
.tilebtn.sel .t-rect{ stroke:#fff; }
.tilebtn:focus-visible{ outline:3px solid var(--gold2); outline-offset:3px; }
.dests{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.dests .dest-prompt{ flex:0 0 100%; margin:0; font-family:var(--sans); font-size:.9rem; font-weight:600; color:var(--gold2); }
.actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
.logbox{ margin-top:10px; font-family:var(--sans); font-size:.86rem; color:var(--ink2); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px; max-height:11em; overflow:auto; }
.logbox ul{ margin:4px 0 0; padding-left:1.2em; }
.logbox li.newest{ color:var(--ink); font-weight:600; }
.rulesbox{ margin-top:10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 14px; }
.rulesbox summary{ cursor:pointer; font-family:var(--sans); min-height:44px; display:flex; align-items:center; font-weight:600; }

/* ---------- dialoguri ---------- */
dialog{ background:var(--panel); color:var(--ink); border:1px solid var(--gold); border-radius:var(--r); padding:0; width:min(560px,calc(100vw - 24px)); max-height:calc(100vh - 24px); box-shadow:0 20px 60px rgba(0,0,0,.65); }
dialog::backdrop{ background:rgba(5,3,2,.7); }
dialog .dh{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
dialog .dh h2{ margin:0; font-size:1.2rem; font-weight:600; }
dialog .db{ padding:14px 16px 16px; overflow:auto; max-height:calc(100vh - 140px); font-family:var(--sans); font-size:.95rem; }
dialog .db p{ margin:.5em 0; color:var(--ink2); }
dialog .df{ display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px; border-top:1px solid var(--line); justify-content:flex-end; }
.field{ margin:12px 0; }
.field > label, .field > .lbl{ display:block; font-weight:700; margin-bottom:4px; color:var(--ink); }
.field .hint{ color:var(--ink3); font-size:.84rem; margin-top:3px; }
.opts{ display:flex; flex-wrap:wrap; gap:8px; }
.opt{ position:relative; }
.opt input{ position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer; }
.opt span{ display:inline-flex; align-items:center; min-height:44px; padding:8px 14px; border:1px solid var(--line2); border-radius:10px; background:var(--panel2); }
.opt input:checked + span{ background:var(--gold); color:var(--goldtxt); border-color:var(--gold); font-weight:700; }
.opt input:focus-visible + span{ outline:3px solid var(--gold2); outline-offset:2px; }
.opt input:disabled + span{ opacity:.4; }
.chk{ display:flex; gap:10px; align-items:flex-start; min-height:44px; padding:6px 0; }
.chk input{ width:22px; height:22px; margin-top:2px; accent-color:var(--gold); flex:0 0 auto; }
.field input[type=text]{ background:var(--panel2); border:1px solid var(--line2); border-radius:10px; padding:10px 12px; min-height:44px; width:100%; color:var(--ink); }
.sumtable{ width:100%; border-collapse:collapse; font-family:var(--sans); }
.sumtable th,.sumtable td{ border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:middle; }
.sumtable td.num,.sumtable th.num{ text-align:right; font-family:var(--mono); }
.remtiles{ display:flex; flex-wrap:wrap; gap:3px; }
.remtiles svg{ width:20px; height:40px; }
.big{ font-size:1.15rem; color:var(--gold2); font-weight:700; }

footer{ margin-top:26px; padding-top:14px; border-top:1px solid var(--line); color:var(--ink3); font-family:var(--sans); font-size:.82rem; text-align:center; }
footer .ph{ color:var(--gold2); font-family:var(--serif); font-size:1rem; }
footer p{ margin:.4em 0; }
.noscript{ background:#4a1d12; color:#fff; padding:14px 18px; font-family:var(--sans); text-align:center; }

'ab.title': ['Despre aplicație','About this app','À propos de l’application','Informazioni sull’app','Acerca de la aplicación','Sobre a aplicação','Über diese Anwendung','Az alkalmazásról'],
'ab.p1': ['Fișier HTML unic, offline, fără dependențe externe, fără telemetrie și fără cereri de rețea. Amestecul folosește crypto.getRandomValues cu eșantionare prin respingere; cu o sămânță opțională folosește mulberry32, pentru partide reproductibile.','Single offline HTML file with no external dependencies, no telemetry and no network requests. Shuffling uses crypto.getRandomValues with rejection sampling; with an optional seed it uses mulberry32 for reproducible games.','Fichier HTML unique, hors ligne, sans dépendance externe, sans télémétrie ni requête réseau. Le mélange utilise crypto.getRandomValues avec échantillonnage par rejet ; avec une graine facultative, mulberry32 pour des parties reproductibles.','File HTML unico, offline, senza dipendenze esterne, telemetria o richieste di rete. Il mescolamento usa crypto.getRandomValues con campionamento per rifiuto; con un seme facoltativo usa mulberry32 per partite riproducibili.','Archivo HTML único, sin conexión, sin dependencias externas, sin telemetría ni peticiones de red. El barajado usa crypto.getRandomValues con muestreo por rechazo; con una semilla opcional usa mulberry32 para partidas reproducibles.','Ficheiro HTML único, offline, sem dependências externas, telemetria ou pedidos de rede. O baralhamento usa crypto.getRandomValues com amostragem por rejeição; com uma semente opcional usa mulberry32 para partidas reproduzíveis.','Einzelne HTML-Datei, offline, ohne externe Abhängigkeiten, Telemetrie oder Netzanfragen. Das Mischen nutzt crypto.getRandomValues mit Rückweisungsverfahren; mit optionalem Startwert mulberry32 für reproduzierbare Partien.','Egyetlen offline HTML-fájl külső függőségek, telemetria és hálózati kérések nélkül. A keverés a crypto.getRandomValues függvényt használja visszautasításos mintavétellel; opcionális maggal a mulberry32-t, így a játékok reprodukálhatók.'],
'ab.p2': ['AI-ul joacă numai pe baza informațiilor publice și a mâinii sale: nu vede mâinile tale și nici boneyard-ul. Nivelul 3 numără piesele jucate și deduce din pase ce nu are un adversar. Singura excepție este opțiunea explicită „arată mâinile AI”.','The AI plays only from public information and its own hand: it sees neither your hand nor the boneyard. Level 3 counts played tiles and infers from passes what an opponent lacks. The only exception is the explicit “show AI hands” option.','L’IA joue seulement avec l’information publique et sa propre main : elle ne voit ni votre main ni le talon. Le niveau 3 compte les pièces jouées et déduit des passes ce qui manque à un adversaire. Seule exception : l’option explicite « montrer les mains de l’IA ».','L’IA gioca solo con le informazioni pubbliche e la propria mano: non vede né la tua mano né il tallone. Il livello 3 conta le tessere giocate e deduce dai passi ciò che manca a un avversario. Unica eccezione: l’opzione esplicita «mostra le mani dell’IA».','La IA juega solo con la información pública y su propia mano: no ve ni tu mano ni el pozo. El nivel 3 cuenta las fichas jugadas y deduce de los pases lo que le falta a un rival. La única excepción es la opción explícita «mostrar las manos de la IA».','A IA joga apenas com a informação pública e a sua própria mão: não vê nem a tua mão nem o monte. O nível 3 conta as peças jogadas e deduz das passagens o que falta a um adversário. A única exceção é a opção explícita «mostrar as mãos da IA».','Die KI spielt nur mit öffentlicher Information und der eigenen Hand: Sie sieht weder deine Hand noch den Vorrat. Stufe 3 zählt gelegte Steine und folgert aus Pässen, was einem Gegner fehlt. Einzige Ausnahme: die ausdrückliche Option „KI-Hände zeigen“.','Az MI csak nyilvános információból és a saját kezéből játszik: sem a te kezedet, sem a kupacot nem látja. A 3. szint számolja a lerakott köveket, és a passzokból kikövetkezteti, mi hiányzik az ellenfélnek. Az egyetlen kivétel az „MI kezeinek mutatása” kifejezett beállítás.'],
'ab.p3': ['Fișele atlasului sunt traduse în toate cele opt limbi; sursele citate la sfârșit rămân în forma lor originală.','The atlas entries are translated into all eight languages; the sources cited at the end stay in their original form.','Les fiches de l’atlas sont traduites dans les huit langues ; les sources citées à la fin restent sous leur forme originale.','Le schede dell’atlante sono tradotte in tutte e otto le lingue; le fonti citate in fondo restano nella loro forma originale.','Las fichas del atlas están traducidas a los ocho idiomas; las fuentes citadas al final se mantienen en su forma original.','As fichas do atlas estão traduzidas nas oito línguas; as fontes citadas no fim mantêm-se na sua forma original.','Die Atlas-Einträge sind in alle acht Sprachen übersetzt; die am Ende genannten Quellen bleiben in ihrer Originalform.','Az atlasz lapjai mind a nyolc nyelvre le vannak fordítva; a végén idézett források eredeti formájukban maradnak.'],

/* ===== 00-common: RNG, seturi de piese ===== */
var DOM = (function(){
'use strict';

/* ---------- RNG: crypto.getRandomValues + rejection sampling; seed reproductibil mulberry32 ---------- */
var _buf = null, _bi = 0;
function secureU32(){
  var c = (typeof crypto !== 'undefined') ? crypto : null;
  if(!c || typeof c.getRandomValues !== 'function') throw new Error('crypto.getRandomValues indisponibil');
  if(!_buf || _bi >= _buf.length){ _buf = new Uint32Array(256); c.getRandomValues(_buf); _bi = 0; }
  return _buf[_bi++];
}
function mulberry32(seed){
  var a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0);
  };
}
function makeRng(seed){
  var u32 = (seed === null || seed === undefined) ? secureU32 : mulberry32(seed);
  var rng = {
    seed: (seed === undefined ? null : seed),
    u32: u32,
    /* uniform in [0,m) fara bias de modulo (rejection sampling) */
    int: function(m){
      if(m <= 1) return 0;
      var lim = Math.floor(4294967296 / m) * m, x;
      do { x = u32(); } while(x >= lim);
      return x % m;
    },
    float: function(){ return u32() / 4294967296; },
    pick: function(arr){ return arr[rng.int(arr.length)]; },
    shuffle: function(arr){
      for(var i = arr.length - 1; i > 0; i--){
        var j = rng.int(i + 1), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }
  };

}

/* ---------- seturi double-n ---------- */
var _sets = {};
function getSet(n){
  if(_sets[n]) return _sets[n];
  var A = [], B = [];
  for(var a = 0; a <= n; a++) for(var b = a; b <= n; b++){ A.push(a); B.push(b); }
  var S = { n: n, size: A.length, A: A, B: B };
  S.id = function(a, b){
    if(a > b){ var t = a; a = b; b = t; }
    return a * (n + 1) - (a * (a - 1)) / 2 + (b - a);
  };
  S.pips = function(t){ return A[t] + B[t]; };
  S.isDouble = function(t){ return A[t] === B[t]; };
  _sets[n] = S;
  return S;
}
function setSize(n){ return (n + 1) * (n + 2) / 2; }
function handPips(S, hand){ var s = 0; for(var i = 0; i < hand.length; i++) s += S.A[hand[i]] + S.B[hand[i]]; return s; }
function round5(x){ return Math.round(x / 5) * 5; } /* x intreg >=0: resturile 1,2 -> jos, 3,4 -> sus (5 e impar: fara jumatati) */
function range(n){ var r = []; for(var i = 0; i < n; i++) r.push(i); return r; }

/* ===== 10-line: motor pentru jocurile cu linie unica (Block, Draw, Matador, Latin, All Fives, Muggins, Sniff, Fives&Threes) ===== */

var LINE = {
  block:   { id:'block',   n:6, nps:[2,3,4], hand:{2:7,3:5,4:5}, draw:null, match:'equal', spinner:false, endScore:null,
             handEnd:'blockSum', target:{2:100,3:61,4:61}, teams:false, lead1:'force', nextLead:'rotate' },
  draw:    { id:'draw',    n:6, nps:[2,3,4], hand:{2:7,3:7,4:6}, draw:{reserve:2}, match:'equal', spinner:false, endScore:null,
             handEnd:'blockSum', target:{2:100,3:61,4:61}, teams:false, lead1:'force', nextLead:'rotate' },
  matador: { id:'matador', n:6, nps:[2,3,4], hand:{2:7,3:7,4:7}, draw:{reserve:2}, match:'sum', spinner:false, endScore:null,
             handEnd:'blockSum', target:{2:100,3:100,4:100}, teams:false, lead1:'force', nextLead:'rotate' },
  allfives:{ id:'allfives',n:6, nps:[2,3,4], hand:{2:9,3:7,4:5}, draw:{reserve:0}, match:'equal', spinner:true, endScore:'m5',

  muggins: { id:'muggins', n:6, nps:[2,3,4], hand:{2:7,3:5,4:5}, draw:{reserve:0}, match:'equal', spinner:false, endScore:'m5',

  sniff:   { id:'sniff',   n:6, nps:[2,3,4], hand:{2:7,3:6,4:5}, draw:{reserve:0}, match:'equal', spinner:true, sniffEnds:true, endScore:'m5',
             handEnd:'subtract', target:{2:250,3:200,4:200}, teams:false, lead1:'free', nextLead:'dominoer' },
  f53:     { id:'f53',     n:6, nps:[2,3,4], hand:{2:7,3:5,4:5}, draw:null, match:'equal', spinner:false, endScore:'f53',
             handEnd:'f53', target:{2:61,3:61,4:61}, exact:true, teams:false, lead1:'free', nextLead:'rotate' },
  latin100:{ id:'latin100',n:6, nps:[4], hand:{4:7}, draw:null, match:'equal', spinner:false, endScore:null,

  latin200:{ id:'latin200',n:6, nps:[4], hand:{4:7}, draw:null, match:'equal', spinner:false, endScore:null,
             handEnd:'latin', latinScore:'all', target:{4:200}, teams:true, forceTeams:true, lead1:'force', nextLead:'winner' }
};

function isLine(vid){ return !!LINE[vid]; }

function isMatador(S, cfg, t){
  if(cfg.match !== 'sum') return false;
  return (S.A[t] === 0 && S.B[t] === 0) || (S.A[t] + S.B[t] === S.n + 1);
}

/* ---------- tabla ---------- */
function newBoard(){ return { first:null, arms:{A:[],B:[],U:[],D:[]}, spinner:null }; }
function cloneBoard(b){
  return { first: b.first ? {tile:b.first.tile, a:b.first.a, b:b.first.b} : null,
    arms:{ A:b.arms.A.slice(), B:b.arms.B.slice(), U:b.arms.U.slice(), D:b.arms.D.slice() },
    spinner: b.spinner ? {where:b.spinner.where, idx:b.spinner.idx} : null };
}
function spinnerValue(S, b){
  var sp = b.spinner; if(!sp) return -1;
  return sp.where === 'F' ? b.first.a : b.arms[sp.where][sp.idx].outV;
}
/* capete deschise: [{arm, v}] ; v = valoarea pe care trebuie sa o potriveasca piesa urmatoare */
function openEnds(S, b){
  var ends = [], F = b.first;
  if(!F) return ends;
  var arms = b.arms;
  function ev(arm, side){ var a = arms[arm]; return a.length ? a[a.length-1].outV : side; }
  ends.push({arm:'A', v:ev('A', F.a)});
  ends.push({arm:'B', v:ev('B', F.b)});
  if(b.spinner){
    var sp = b.spinner, open;
    if(sp.where === 'F') open = arms.A.length > 0 && arms.B.length > 0;
    else open = arms[sp.where].length > sp.idx + 1;
    if(open){
      var sv = spinnerValue(S, b);
      ends.push({arm:'U', v:ev('U', sv)});
      ends.push({arm:'D', v:ev('D', sv)});
    }
  }
  return ends;
}
/* suma capetelor pentru scorare (dublu la capat = ambele jumatati; spinner-ul numara 2s cat timp nu are tigle pe ambele parti) */
function endsTotal(S, b, cfg){
  var F = b.first; if(!F) return 0;
  var arms = b.arms;
  function armVal(arm){ var t = arm[arm.length-1]; return S.A[t.tile] === S.B[t.tile] ? 2*t.outV : t.outV; }
  var la = arms.A.length, lb = arms.B.length, total = 0;
  if(F.a === F.b){
    if(la === 0 && lb === 0) return 2*F.a;
    total += la ? armVal(arms.A) : 2*F.a;
    total += lb ? armVal(arms.B) : 2*F.a;
  } else {
    total += la ? armVal(arms.A) : F.a;
    total += lb ? armVal(arms.B) : F.b;
  }
  if(arms.U.length) total += armVal(arms.U);
  if(arms.D.length) total += armVal(arms.D);
  /* Sniff (versiunea americana, Pagat): capetele Sniff-ului numara cat timp sunt expuse, chiar dupa ce ambele laturi sunt acoperite */
  if(cfg && cfg.sniffEnds && b.spinner){
    var sp = b.spinner, opened = sp.where === 'F' ? (la > 0 && lb > 0) : arms[sp.where].length > sp.idx + 1;
    if(opened){ var sv = spinnerValue(S, b); if(!arms.U.length) total += sv; if(!arms.D.length) total += sv; }
  }
  return total;
}
function pointsFor(cfg, total){
  if(!cfg.endScore || total <= 0) return 0;
  if(cfg.endScore === 'm5') return total % 5 === 0 ? total : 0;
  if(cfg.endScore === 'f53') return (total % 3 === 0 ? total/3 : 0) + (total % 5 === 0 ? total/5 : 0);
  return 0;
}
/* valori "out" posibile cand atasam piesa t pe un capat cu valoarea ev */
function outsFor(S, cfg, t, ev){
  var a = S.A[t], b = S.B[t], r = [];
  if(cfg.match === 'equal'){
    if(a === ev) r.push(b);
    if(b === ev && b !== a) r.push(a);
    return r;
  }
  var m = S.n + 1;
  if(isMatador(S, cfg, t)){ r.push(a); if(b !== a) r.push(b); return r; }
  if(a + ev === m) r.push(b);
  if(b !== a && b + ev === m) r.push(a);
  return r;
}
function otherSide(S, t, out){ return S.A[t] === out ? S.B[t] : S.A[t]; }
/* aplica o mutare de tabla (mutatie). mv = {tile, arm, out, inV} ; arm 'F' = prima piesa */
function applyBoard(S, cfg, b, mv){
  var t = mv.tile;
  if(mv.arm === 'F'){
    b.first = {tile:t, a:S.A[t], b:S.B[t]};
    if(cfg.spinner && S.A[t] === S.B[t]) b.spinner = {where:'F', idx:-1};
  } else {
    var arm = b.arms[mv.arm];
    if(cfg.spinner && !b.spinner && S.A[t] === S.B[t]) b.spinner = {where:mv.arm, idx:arm.length};
    arm.push({tile:t, inV:mv.inV, outV:mv.out});
  }
}
function canPlayTileOn(S, cfg, b, t){
  if(!b.first) return true;
  var ends = openEnds(S, b);
  for(var i = 0; i < ends.length; i++) if(outsFor(S, cfg, t, ends[i].v).length) return true;
  return false;
}

/* ---------- stare ---------- */
function newLineGame(vid, opts, rng){
  var cfg0 = LINE[vid]; if(!cfg0) throw new Error('varianta necunoscuta ' + vid);
  var cfg = {}; for(var k in cfg0) cfg[k] = cfg0[k];
  opts = opts || {};
  var np = opts.np || cfg.nps[0];
  if(cfg.nps.indexOf(np) < 0) throw new Error('numar de jucatori invalid');
  if(opts.n && cfg.match === 'sum') cfg.n = opts.n;
  var S = getSet(cfg.n);
  var teams = !!opts.teams && cfg.teams && np === 4;
  if(cfg.forceTeams) teams = true;
  var st = {
    fam:'line', vid:vid, cfg:cfg, S:S, n:cfg.n, np:np, teams:teams,
    entOf: range(np).map(function(p){ return teams ? p % 2 : p; }),
    nEnt: teams ? 2 : np,
    scores: [], target: opts.target || cfg.target[np],
    handNo: -1, starter: -1, lastDominoer: -1, lastWinnerEnt: -1,
    phase:'init', winnerEnt: -1, tieAtTarget:false
  };
  st.scores = range(st.nEnt).map(function(){ return 0; });
  st.stats = { hands:0, passes:0, draws:0 };
  nextHandLine(st, rng);
  return st;
}
function highestDoubleHolder(st){
  var S = st.S, best = -1, who = -1;
  for(var p = 0; p < st.np; p++) for(var i = 0; i < st.hands[p].length; i++){
    var t = st.hands[p][i];
    if(S.A[t] === S.B[t] && S.A[t] > best){ best = S.A[t]; who = p; }
  }
  if(who >= 0) return { p:who, tile:S.id(best, best), dbl:true };
  /* niciun dublu: cea mai grea piesa (suma, apoi cea mai mare latura) */
  var bt = -1, bp = -1, bs = -1, bm = -1;
  for(var q = 0; q < st.np; q++) for(var j = 0; j < st.hands[q].length; j++){
    var u = st.hands[q][j], s = S.A[u] + S.B[u], m = S.B[u];
    if(s > bs || (s === bs && m > bm)){ bs = s; bm = m; bt = u; bp = q; }
  }
  return { p:bp, tile:bt, dbl:false };
}
function nextHandLine(st, rng){
  var S = st.S, cfg = st.cfg, np = st.np, k = cfg.hand[np];
  if(np * k > S.size) throw new Error('prea multe piese impartite');
  st.handNo++;
  var ids = rng.shuffle(range(S.size));
  st.hands = [];
  for(var p = 0; p < np; p++) st.hands.push(ids.slice(p*k, (p+1)*k).sort(function(x,y){return x-y;}));
  st.boneyard = ids.slice(np*k);
  st.initialBoneyard = st.boneyard.length;
  st.board = newBoard();
  st.playedMask = new Uint8Array(S.size);
  st.played = [];
  st.noTiles = range(np).map(function(){ return new Uint8Array(S.size); });
  st.drawing = range(np).map(function(){ return false; });
  st.history = [];
  st.lastPlayer = -1; st.handResult = null;
  st.mustLead = null;
  var hd = highestDoubleHolder(st);
  if(st.handNo === 0){
    st.starter = hd.p;
    if(cfg.lead1 === 'force') st.mustLead = hd.tile;
  } else {
    var nl = cfg.nextLead;
    if(nl === 'rotate') st.starter = (st.starter + 1) % np;
    else if(nl === 'dominoer') st.starter = st.lastDominoer >= 0 ? st.lastDominoer : rng.int(np);
    else if(nl === 'winner'){
      st.starter = st.lastWinnerStarter >= 0 ? st.lastWinnerStarter : (st.starter + 1) % np;
    }
    else st.starter = (st.starter + 1) % np;
  }
  st.turn = st.starter;
  st.phase = 'play';
  st.stats.hands++;
  return st;
}

function canDraw(st){ return !!st.cfg.draw && st.boneyard.length > st.cfg.draw.reserve; }
function openMove(st, t){ return { t:'play', tile:t, arm:'F', out:st.S.B[t], inV:st.S.A[t] }; }

function legalPlays(st, p){
  var S = st.S, cfg = st.cfg, hand = st.hands[p], out = [], i, j, k;
  if(!hand) return out;
  if(!st.board.first){
    if(st.mustLead !== null && st.mustLead !== undefined){
      if(hand.indexOf(st.mustLead) >= 0) out.push(openMove(st, st.mustLead));
    } else for(i = 0; i < hand.length; i++) out.push(openMove(st, hand[i]));
    return out;
  }
  var ends = openEnds(S, st.board);
  for(i = 0; i < hand.length; i++){
    var t = hand[i];
    for(j = 0; j < ends.length; j++){
      var os = outsFor(S, cfg, t, ends[j].v);
      for(k = 0; k < os.length; k++) out.push({ t:'play', tile:t, arm:ends[j].arm, out:os[k], inV:otherSide(S, t, os[k]) });
    }
  }
  return out;
}
function legalActionsLine(st){
  if(st.phase !== 'play') return [];
  var plays = legalPlays(st, st.turn);
  if(plays.length){
    /* Matador: nu esti obligat sa joci un matador — daca TOATE mutarile tale sunt cu matadori poti trage in schimb (Pagat) */
    if(st.cfg.match === 'sum' && canDraw(st) && st.board.first){
      var allMat = true;
      for(var i = 0; i < plays.length; i++) if(!isMatador(st.S, st.cfg, plays[i].tile)){ allMat = false; break; }
      if(allMat) return plays.concat([{t:'draw'}]);
    }
    return plays;
  }
  if(canDraw(st)) return [{t:'draw'}];
  return [{t:'pass'}];
}
function sameAction(a, b){
  return a.t === b.t && a.tile === b.tile && a.arm === b.arm && a.out === b.out;
}

function isBlockedLine(st){
  if(!st.board.first) return false;
  if(canDraw(st)) return false;
  for(var p = 0; p < st.np; p++) if(legalPlays(st, p).length) return false;
  return true;
}

/* ---------- inferenta publica: ce piese NU are un jucator ---------- */
function flagNoTiles(st, p, voluntary){
  var S = st.S, cfg = st.cfg, nt = st.noTiles[p];
  for(var t = 0; t < S.size; t++){
    if(voluntary && isMatador(S, cfg, t)) continue;   /* a tras de buna voie: poate avea matadori */
    if(!st.playedMask[t] && canPlayTileOn(S, cfg, st.board, t)) nt[t] = 1;
  }
}

function pipsOfPlayer(st, p){ return handPips(st.S, st.hands[p]); }
function entPips(st, e){
  var s = 0; for(var p = 0; p < st.np; p++) if(st.entOf[p] === e) s += pipsOfPlayer(st, p);
  return s;
}

/* ---------- executa o actiune ---------- */
function actLine(st, act, rng){
  if(st.phase !== 'play') throw new Error('joc nu e in desfasurare');
  var legal = legalActionsLine(st), ok = null, i;
  for(i = 0; i < legal.length; i++) if(sameAction(legal[i], act)){ ok = legal[i]; break; }
  if(!ok) throw new Error('actiune ilegala: ' + JSON.stringify(act));
  act = ok;
  var p = st.turn, ev = [], cfg = st.cfg, S = st.S;
  if(act.t === 'draw'){
    if(!st.drawing[p]){
      /* o noua secventa de extragere: cunostintele vechi devin "moi" (jucatorul poate trage piesa respectiva) */
      var nt = st.noTiles[p]; for(var q = 0; q < nt.length; q++) if(nt[q] === 1) nt[q] = 2;
      st.drawing[p] = true;
    }
    flagNoTiles(st, p, legalPlays(st, p).length > 0);
    var d = st.boneyard.pop();
    st.hands[p].push(d); st.hands[p].sort(function(x,y){return x-y;});
    st.stats.draws++;
    st.history.push({k:'draw', p:p});
    ev.push({k:'draw', p:p, tile:d});
    if(isBlockedLine(st)) endHandLine(st, 'blocked', -1, ev, rng);   /* bonul a ajuns la rezerva si nimeni nu poate juca */
    return ev;
  }
  if(act.t === 'pass'){
    flagNoTiles(st, p);
    st.drawing[p] = false;
    st.stats.passes++;
    st.history.push({k:'pass', p:p});
    ev.push({k:'pass', p:p});
    if(isBlockedLine(st)){ endHandLine(st, 'blocked', -1, ev, rng); return ev; }
    st.turn = (p + 1) % st.np;
    return ev;
  }
  /* play */
  var hi = st.hands[p].indexOf(act.tile);
  st.hands[p].splice(hi, 1);
  applyBoard(S, cfg, st.board, act);
  st.playedMask[act.tile] = 1;
  st.played.push(act.tile);
  st.lastPlayer = p;
  st.drawing[p] = false;
  st.history.push({k:'play', p:p, tile:act.tile, arm:act.arm, out:act.out, inV:act.inV});
  var out = st.hands[p].length === 0;
  var pts = 0;
  if(cfg.endScore) pts = pointsFor(cfg, endsTotal(S, st.board, cfg));
  var chip = (cfg.handEnd === 'f53' && out) ? 1 : 0;
  var gained = pts + chip, voided = false;
  if(gained > 0){
    var ent = st.entOf[p];
    if(cfg.exact && st.scores[ent] + gained > st.target){ voided = true; gained = 0; }
    else st.scores[ent] += gained;
  }
  ev.push({k:'play', p:p, tile:act.tile, arm:act.arm, out:act.out, inV:act.inV, pts:gained, voided:voided, chip:chip});
  /* tinta atinsa in timpul mainii (fives): joc terminat imediat */
  if(cfg.endScore){
    var ent2 = st.entOf[p];
    var reached = cfg.exact ? st.scores[ent2] === st.target : st.scores[ent2] >= st.target;
    if(reached){
      st.phase = 'gameOver'; st.winnerEnt = ent2;
      st.handResult = { reason:'target', outP: out ? p : -1, gains: st.scores.map(function(){return 0;}), pips: range(st.np).map(function(q){return pipsOfPlayer(st,q);}) };
      ev.push({k:'gameOver', winnerEnt:ent2});
      return ev;
    }
  }
  if(out){ endHandLine(st, 'domino', p, ev, rng); return ev; }
  if(isBlockedLine(st)){ endHandLine(st, 'blocked', -1, ev, rng); return ev; }
  st.turn = (p + 1) % st.np;
  return ev;
}

/* ---------- sfarsit de mana ---------- */
function endHandLine(st, reason, outP, ev, rng){
  var cfg = st.cfg, np = st.np, nEnt = st.nEnt, S = st.S, p, e;
  var pips = range(np).map(function(q){ return pipsOfPlayer(st, q); });
  var entP = range(nEnt).map(function(en){ var s = 0; for(var q = 0; q < np; q++) if(st.entOf[q] === en) s += pips[q]; return s; });
  var gains = range(nEnt).map(function(){ return 0; });
  var winEnt = -1, tie = false;
  st.lastDominoer = reason === 'domino' ? outP : -1;
  st.lastWinnerStarter = -1;
  var he = cfg.handEnd;
  function argminUnique(vals){
    var m = Infinity, c = 0, w = -1;
    for(var i = 0; i < vals.length; i++){ if(vals[i] < m){ m = vals[i]; c = 1; w = i; } else if(vals[i] === m) c++; }
    return { min:m, count:c, w:w };
  }
  if(he === 'blockSum'){
    var am = argminUnique(pips);
    if(am.count === 1){
      winEnt = am.w;
      var sumOthers = 0; for(p = 0; p < np; p++) if(p !== am.w) sumOthers += pips[p];
      gains[am.w] = sumOthers - pips[am.w];
    } else tie = true;
  } else if(he === 'latin'){
    var winTeam = -1;
    if(reason === 'domino') winTeam = st.entOf[outP];
    else { if(entP[0] < entP[1]) winTeam = 0; else if(entP[1] < entP[0]) winTeam = 1; else tie = true; }
    if(winTeam >= 0){
      winEnt = winTeam;
      var los = 1 - winTeam;
      gains[winTeam] = cfg.latinScore === 'all' ? (entP[0] + entP[1]) : entP[los];
      /* cine deschide mana urmatoare (varianta „castigatorul deschide") */
      var lp = st.lastPlayer;
      if(reason === 'domino') st.lastWinnerStarter = outP;
      else {
        /* blocaj (Doscientos, Pagat): incepe jucatorul din echipa castigatoare cu mai putine puncte ramase; la egalitate cel care a pus ultima piesa */
        var bestP = -1, bestV = Infinity;
        for(p = 0; p < np; p++) if(st.entOf[p] === winTeam){
          var pv = pips[p];
          if(pv < bestV || (pv === bestV && p === lp)){ bestV = pv; bestP = p; }
        }
        st.lastWinnerStarter = bestP;
      }
    }
  } else if(he === 'fives'){
    if(reason === 'domino'){
      winEnt = st.entOf[outP];
      var oth = 0; for(e = 0; e < nEnt; e++) if(e !== winEnt) oth += entP[e];
      gains[winEnt] = round5(oth);
    } else {
      var am2 = argminUnique(entP);
      if(am2.count === 1){
        winEnt = am2.w;
        var o2 = 0; for(e = 0; e < nEnt; e++) if(e !== winEnt) o2 += entP[e];
        gains[winEnt] = round5(o2);
      } else if(nEnt === 3 && am2.count === 2){
        /* trei jucatori, doi la egalitate pe minim: impart punctele celui de-al treilea (jumatate fiecare, rotunjit in jos) */
        var third = -1; for(e = 0; e < 3; e++) if(entP[e] !== am2.min) third = e;
        var half = Math.floor(round5(entP[third]) / 2);
        for(e = 0; e < 3; e++) if(e !== third) gains[e] = half;
        tie = true;
      } else tie = true;
    }
  } else if(he === 'subtract'){
    for(e = 0; e < nEnt; e++) gains[e] = -round5(entP[e]);
    if(reason === 'domino') winEnt = st.entOf[outP];
  } else if(he === 'f53'){
    if(reason === 'domino') winEnt = st.entOf[outP]; /* punctul „chip out" a fost deja acordat la jucarea ultimei piese */
  }
  for(e = 0; e < nEnt; e++) st.scores[e] += gains[e];
  st.handResult = { reason:reason, outP:outP, pips:pips, entPips:entP, gains:gains, winEnt:winEnt, tie:tie };
  ev.push({k:'handEnd', result:st.handResult});
  /* tinta? */
  var reached = [];
  for(e = 0; e < nEnt; e++){
    if(cfg.exact ? st.scores[e] === st.target : st.scores[e] >= st.target) reached.push(e);
  }
  if(reached.length){
    var best = reached[0];
    for(var r = 1; r < reached.length; r++) if(st.scores[reached[r]] > st.scores[best]) best = reached[r];
    var topCount = 0; for(var r2 = 0; r2 < reached.length; r2++) if(st.scores[reached[r2]] === st.scores[best]) topCount++;
    if(topCount === 1 || cfg.exact){
      st.phase = 'gameOver'; st.winnerEnt = best;
      if(st.teams && cfg.handEnd === 'latin') st.capot = (st.scores[1 - best] === 0); /* „capot": victorie cu adversarii la zero */
      ev.push({k:'gameOver', winnerEnt:best}); return;
    }
    st.tieAtTarget = true; /* egalitate la varf: se mai joaca o mana */
  }
  st.phase = 'handOver';
}

/* ---------- vedere publica pentru AI (fara mainile adversarilor) ---------- */
function viewLine(st, me){
  var hands = range(st.np).map(function(p){ return p === me ? st.hands[p].slice() : null; });
  return {
    fam:'line', vid:st.vid, cfg:st.cfg, S:st.S, n:st.n, np:st.np, teams:st.teams, entOf:st.entOf, nEnt:st.nEnt,
    me:me, turn:st.turn, phase:st.phase, handNo:st.handNo,
    hands:hands, handCounts: st.hands.map(function(h){ return h.length; }),
    boneyard: new Array(st.boneyard.length),
    board: cloneBoard(st.board), playedMask: st.playedMask.slice(), played: st.played.slice(),
    noTiles: st.noTiles.map(function(a){ return a.slice(); }),
    scores: st.scores.slice(), target: st.target, mustLead: st.mustLead,
    history: st.history.slice()
  };
}

/* ===== 20-train: Mexican Train (double-12, trenuri personale, tren mexican, dubluri de satisfacut) ===== */

var TRAIN_CFG = { id:'mexican', n:12, nps:[2,3,4], hand:{2:15,3:15,4:15} };

function newTrainGame(opts, rng){
  opts = opts || {};
  var np = opts.np || 4;
  if(TRAIN_CFG.nps.indexOf(np) < 0) throw new Error('numar de jucatori invalid');
  var st = {
    fam:'train', vid:'mexican', cfg:TRAIN_CFG, S:getSet(12), n:12, np:np,
    rounds: opts.rounds || 13, blank50: !!opts.blank50,
    totals: range(np).map(function(){ return 0; }),
    roundScores: [],
    round: -1, phase:'init', teams:false
  };
  nextRoundTrain(st, rng);
  return st;
}

function endOfTrain(st, tr){
  var arr = tr === st.np ? st.mex : st.trains[tr].tiles;
  return arr.length ? arr[arr.length-1].outV : st.hubV;
}
function trainTiles(st, tr){ return tr === st.np ? st.mex : st.trains[tr].tiles; }

function nextRoundTrain(st, rng){
  var S = st.S, np = st.np;
  st.round++;
  st.hubV = 12 - st.round;
  st.hubTile = S.id(st.hubV, st.hubV);
  /* dublul-motor se pune pe masa inainte de amestec (varianta din Pagat); ceilalti 90 de domino se impart */
  var ids = range(S.size).filter(function(t){ return t !== st.hubTile; });
  rng.shuffle(ids);
  var k = TRAIN_CFG.hand[np];
  st.hands = [];
  for(var p = 0; p < np; p++) st.hands.push(ids.slice(p*k, (p+1)*k).sort(function(x,y){return x-y;}));
  st.boneyard = ids.slice(np*k);
  var holder = (st.round === 0) ? rng.int(np) : (st.starter + 1) % np;
  st.drawnForHub = 0;
  st.trains = range(np).map(function(){ return { tiles:[], marker:false }; });
  st.mex = [];
  st.pend = [];            /* dubluri nesatisfacute, in ordinea jucarii: {tr, turnNo} */
  st.starter = holder;
  st.firstDone = range(np).map(function(){ return false; });
  st.firstCount = 0;
  st.outFlag = -1;
  st.turn = holder; st.turnNo = 0;
  st.cur = { played:0, needExtra:false, drew:false };
  st.history = [];
  st.playedMask = new Uint8Array(S.size); st.playedMask[st.hubTile] = 1;
  st.noTiles = null;
  st.phase = 'play';
  st.status = 'first'; /* 'first' = prima tura a fiecaruia; apoi 'main' */
  st.roundResult = null;
  startTurnTrain(st);
  return st;
}

function startTurnTrain(st){
  st.turnNo++;
  st.cur = { played:0, needExtra:false, drew:false };
}

/* dubla cea mai veche nesatisfacuta, cu efect obligatoriu (create in ture anterioare) */
function bindHead(st){
  if(st.status === 'first') return null;
  for(var i = 0; i < st.pend.length; i++) if(st.pend[i].turnNo < st.turnNo) return st.pend[i];
  return null;
}

function trainAccessible(st, p, tr){
  if(tr === p) return true;
  if(tr === st.np) return true;
  return st.trains[tr].marker;
}

function legalPlaysTrain(st, p){
  var S = st.S, hand = st.hands[p], out = [], np = st.np, i, tr;
  if(!hand) return out;
  var first = st.status === 'first';
  var head = first ? null : bindHead(st);
  for(i = 0; i < hand.length; i++){
    var t = hand[i], a = S.A[t], b = S.B[t];
    var trs;
    if(first) trs = [p];
    else if(head) trs = [head.tr];
    else { trs = []; for(tr = 0; tr <= np; tr++) if(trainAccessible(st, p, tr)) trs.push(tr); }
    for(var j = 0; j < trs.length; j++){
      tr = trs[j];
      var ev = endOfTrain(st, tr);
      if(a === ev) out.push({t:'play', tile:t, tr:tr, out:b, inV:a});
      else if(b === ev) out.push({t:'play', tile:t, tr:tr, out:a, inV:b});
    }
  }
  return out;
}

function legalActionsTrain(st){
  if(st.phase !== 'play') return [];
  var p = st.turn, plays = legalPlaysTrain(st, p);
  if(st.status === 'first'){
    if(plays.length){
      var r = plays.slice();
      if(st.cur.played > 0) r.push({t:'end'});
      return r;
    }
    /* nu poate (mai) juca */
    if(st.cur.played > 0) return [{t:'end'}];
    return [{t:'pass'}]; /* nu poate porni trenul: jeton, fara tragere */
  }
  if(plays.length) return plays;
  if(st.boneyard.length > 0 && !st.cur.drew) return [{t:'draw'}];
  return [{t:'pass'}];
}

function sameActionTrain(a, b){ return a.t === b.t && a.tile === b.tile && a.tr === b.tr; }

function pipValueTrain(st, t){
  var v = st.S.A[t] + st.S.B[t];
  if(st.blank50 && t === 0) v = 50; /* 0-0 e piesa cu id 0 */
  return v;
}
function handValueTrain(st, hand){ var s = 0; for(var i = 0; i < hand.length; i++) s += pipValueTrain(st, hand[i]); return s; }

/* blocat: bonul gol si niciun jucator nu are mutare (cu dublele pendinte considerate obligatorii) */
function isBlockedTrain(st){
  if(st.boneyard.length > 0) return false;
  if(st.status === 'first') return false;
  var saveNo = st.turnNo; st.turnNo = 1e9; /* toate dublele pendinte devin obligatorii */
  var any = false;
  for(var p = 0; p < st.np && !any; p++) if(legalPlaysTrain(st, p).length) any = true;
  st.turnNo = saveNo;
  return !any;
}

function advanceTurnTrain(st, ev, rng){
  var p = st.turn;
  if(st.status === 'first'){
    st.firstDone[p] = true; st.firstCount++;
    if(st.firstCount >= st.np){
      st.status = 'main';
      if(st.outFlag >= 0){ endRoundTrain(st, 'out', st.outFlag, ev, rng); return; }
    }
  }
  st.turn = (p + 1) % st.np;
  startTurnTrain(st);
  if(isBlockedTrain(st)) endRoundTrain(st, 'blocked', -1, ev, rng);
}

function actTrain(st, act, rng){
  if(st.phase !== 'play') throw new Error('runda nu e in desfasurare');
  var legal = legalActionsTrain(st), ok = null, i;
  for(i = 0; i < legal.length; i++) if(sameActionTrain(legal[i], act)){ ok = legal[i]; break; }
  if(!ok) throw new Error('actiune ilegala: ' + JSON.stringify(act));
  act = ok;
  var p = st.turn, ev = [], S = st.S;
  if(act.t === 'draw'){
    var d = st.boneyard.pop();
    st.hands[p].push(d); st.hands[p].sort(function(x,y){return x-y;});
    st.cur.drew = true;
    st.history.push({k:'draw', p:p});
    ev.push({k:'draw', p:p, tile:d});
    return ev;
  }
  if(act.t === 'pass'){
    st.trains[p].marker = true;
    st.history.push({k:'pass', p:p});
    ev.push({k:'pass', p:p, marker:true});
    advanceTurnTrain(st, ev, rng);
    return ev;
  }
  if(act.t === 'end'){
    st.history.push({k:'end', p:p});
    ev.push({k:'end', p:p});
    advanceTurnTrain(st, ev, rng);
    return ev;
  }
  /* play */
  var head = (st.status === 'first') ? null : bindHead(st);
  var tiles = trainTiles(st, act.tr);
  var dbl = S.A[act.tile] === S.B[act.tile];
  /* satisface o dubla pendinta pe acest tren? (ultima piesa a trenului e o dubla in lista) */
  for(i = 0; i < st.pend.length; i++) if(st.pend[i].tr === act.tr){ st.pend.splice(i, 1); break; }
  tiles.push({tile:act.tile, inV:act.inV, outV:act.out});
  st.hands[p].splice(st.hands[p].indexOf(act.tile), 1);
  st.playedMask[act.tile] = 1;
  if(act.tr === p && st.trains[p].marker) st.trains[p].marker = false;
  st.cur.played++; st.cur.drew = false;
  st.history.push({k:'play', p:p, tile:act.tile, tr:act.tr, out:act.out, inV:act.inV});
  ev.push({k:'play', p:p, tile:act.tile, tr:act.tr, out:act.out, dbl:dbl});
  if(dbl) st.pend.push({tr:act.tr, turnNo:st.turnNo});
  if(st.hands[p].length === 0){
    if(st.status === 'first'){
      st.outFlag = p;
      advanceTurnTrain(st, ev, rng);   /* runda continua pana toti au avut prima tura */
    } else endRoundTrain(st, 'out', p, ev, rng);
    return ev;
  }
  if(st.status === 'first'){
    /* in prima tura: continua lantul cat poate; fara piesa suplimentara pentru dublu */
    if(legalPlaysTrain(st, p).length === 0) advanceTurnTrain(st, ev, rng);
    return ev;
  }
  if(dbl){ st.cur.needExtra = true; return ev; }  /* dubla => o piesa suplimentara (sau tragere / pas) */
  advanceTurnTrain(st, ev, rng);
  return ev;
}

function endRoundTrain(st, reason, outP, ev, rng){
  var np = st.np, scores = [];
  for(var p = 0; p < np; p++) scores.push(handValueTrain(st, st.hands[p]));
  for(p = 0; p < np; p++) st.totals[p] += scores[p];
  st.roundScores.push(scores);
  st.roundResult = { reason:reason, outP:outP, scores:scores, hubV:st.hubV };
  ev.push({k:'roundEnd', result:st.roundResult});
  if(st.round + 1 >= st.rounds){
    st.phase = 'gameOver';
    var best = 0; for(p = 1; p < np; p++) if(st.totals[p] < st.totals[best]) best = p;
    var tied = []; for(p = 0; p < np; p++) if(st.totals[p] === st.totals[best]) tied.push(p);
    st.winners = tied;
    ev.push({k:'gameOver', winners:tied});
  } else st.phase = 'roundOver';
}

function viewTrain(st, me){
  var hands = range(st.np).map(function(p){ return p === me ? st.hands[p].slice() : null; });
  return {
    fam:'train', vid:'mexican', cfg:st.cfg, S:st.S, n:st.n, np:st.np, me:me, turn:st.turn, phase:st.phase,
    status:st.status, hubV:st.hubV, hubTile:st.hubTile, round:st.round, rounds:st.rounds, blank50:st.blank50,
    hands:hands, handCounts: st.hands.map(function(h){ return h.length; }),
    boneyard: new Array(st.boneyard.length),
    trains: st.trains.map(function(t){ return { tiles:t.tiles.slice(), marker:t.marker }; }),
    mex: st.mex.slice(), pend: st.pend.map(function(x){ return {tr:x.tr, turnNo:x.turnNo}; }),
    turnNo: st.turnNo, cur: {played:st.cur.played, needExtra:st.cur.needExtra, drew:st.cur.drew},
    playedMask: st.playedMask.slice(), totals: st.totals.slice(), history: st.history.slice(),
    firstDone: st.firstDone.slice()
  };
}

/* ===== 30-ai: adversar local didactic (euristici + numararea pieselor + deductie din pase). Lucreaza DOAR cu "view" public ===== */

function unseenTiles(view){
  var S = view.S, mine = view.hands[view.me], mm = new Uint8Array(S.size), res = [], i;
  for(i = 0; i < mine.length; i++) mm[mine[i]] = 1;
  for(var t = 0; t < S.size; t++) if(!view.playedMask[t] && !mm[t]) res.push(t);
  return res;
}

/* P[o][X] = probabilitatea (aprox.) ca adversarul o sa aiba piesa X; foloseste numaratoarea si pasele observate */
function holdProbs(view, unseen){
  var np = view.np, me = view.me, S = view.S, b = view.boneyard.length, P = [], o, i;
  var wmat = [];
  for(o = 0; o < np; o++){
    wmat.push(null);
    if(o === me) continue;
    var w = new Float64Array(S.size);
    for(i = 0; i < unseen.length; i++){
      var X = unseen[i], f = view.noTiles ? view.noTiles[o][X] : 0;
      w[X] = f === 1 ? 0 : (f === 2 ? 0.35 : 1);
    }
    wmat[o] = w;
  }
  for(o = 0; o < np; o++){
    if(o === me){ P.push(null); continue; }
    var pr = new Float64Array(S.size);
    for(i = 0; i < unseen.length; i++){
      var X2 = unseen[i], den = b, q;
      for(q = 0; q < np; q++) if(q !== me) den += view.handCounts[q] * wmat[q][X2];
      pr[X2] = den > 0 ? (view.handCounts[o] * wmat[o][X2]) / den : 0;
      if(pr[X2] > 1) pr[X2] = 1;
    }
    P.push(pr);
  }
  return P;
}

/* ---------- Line AI ---------- */
function lineWeights(cfg){
  var he = cfg.handEnd;
  if(he === 'blockSum' || he === 'latin') return { pts:0, pip:0.40, dbl:1.4, flex:1.3, sup:1.0, pass:4.5, dang:0, out:80 };
  if(he === 'f53') return { pts:1.0, pip:0.05, dbl:0.4, flex:0.7, sup:0.5, pass:2.5, dang:0.9, out:6 };
  return { pts:1.0, pip:0.12, dbl:0.5, flex:0.8, sup:0.6, pass:2.5, dang:0.8, out:25 };
}
function evalLinePlay(view, mv, level, ctx){
  var S = view.S, cfg = view.cfg, me = view.me, w = ctx.w, t = mv.tile;
  var b2 = cloneBoard(view.board); applyBoard(S, cfg, b2, mv);
  var hand = view.hands[me], rest = [], i, j;
  for(i = 0; i < hand.length; i++) if(hand[i] !== t) rest.push(hand[i]);
  var score = 0;
  var tot = cfg.endScore ? endsTotal(S, b2, cfg) : 0;
  var pts = cfg.endScore ? pointsFor(cfg, tot) : 0;
  score += w.pts * pts;
  score += w.pip * (S.A[t] + S.B[t]);
  if(S.A[t] === S.B[t]) score += w.dbl;
  if(rest.length === 0) score += w.out;
  var ends2 = openEnds(S, b2);
  /* flexibilitate: cate piese ramase se pot juca pe capetele noi; cate valori distincte controlez */
  var playable = 0, covered = {};
  for(i = 0; i < rest.length; i++){
    var any = false;
    for(j = 0; j < ends2.length; j++){
      if(outsFor(S, cfg, rest[i], ends2[j].v).length){ any = true; covered[ends2[j].v + '|' + ends2[j].arm] = 1; }
    }
    if(any) playable++;
  }
  score += w.flex * playable;
  if(rest.length > 0 && playable === 0) score -= 3;
  var nc = 0; for(var kk in covered) nc++;
  score += w.sup * nc;
  if(cfg.match === 'sum' && isMatador(S, cfg, t)) score -= 3.5;   /* matadorii sunt jokeri: se pastreaza */
  if(level >= 3 && ctx.P){
    var np = view.np, pass = 0, dang = 0, o;
    for(o = 0; o < np; o++){
      if(o === me || view.handCounts[o] === 0) continue;
      var d = (o - me + np) % np, wt = d === 1 ? 1 : (d === 2 ? 0.7 : 0.5);
      var team = view.teams && view.entOf[o] === view.entOf[me];
      var sign = team ? -1 : 1;
      var prod = 1, lst = [];
      for(i = 0; i < ctx.unseen.length; i++){
        var X = ctx.unseen[i], pX = ctx.P[o][X];
        if(pX <= 0) continue;
        var best = -1, pl = false;
        for(j = 0; j < ends2.length; j++){
          var os = outsFor(S, cfg, X, ends2[j].v);
          if(os.length){
            pl = true;
            if(cfg.endScore && w.dang){
              for(var k = 0; k < os.length; k++){
                var b3 = cloneBoard(b2); applyBoard(S, cfg, b3, {tile:X, arm:ends2[j].arm, out:os[k], inV:otherSide(S, X, os[k])});
                var sc = pointsFor(cfg, endsTotal(S, b3, cfg)); if(sc > best) best = sc;
              }
            }
          }
        }
        if(pl){ prod *= (1 - pX); if(best > 0) lst.push({p:pX, s:best}); }
      }
      pass += sign * wt * prod;               /* prod = probabilitatea ca o sa PASEZE */
      if(w.dang){
        lst.sort(function(a, b){ return b.s - a.s; });
        var em = 0, cum = 1;
        for(i = 0; i < lst.length; i++){ em += lst[i].s * lst[i].p * cum; cum *= (1 - lst[i].p); }
        dang += (team ? 1 : -1) * wt * em;
      }
    }
    score += w.pass * pass + w.dang * dang;
  }
  return score;
}

function aiLine(view, level, rng){
  var acts = legalActionsLine(view), i;
  var onlyPlays = acts.filter(function(a){ return a.t === 'play'; });
  if(onlyPlays.length) acts = onlyPlays;       /* AI nu trage de buna voie (Matador) */
  if(acts.length === 1) return acts[0];
  var cfg = view.cfg, S = view.S;
  if(level <= 1){
    if(cfg.endScore){
      var best = -1, cands = [];
      for(i = 0; i < acts.length; i++){
        var b2 = cloneBoard(view.board); applyBoard(S, cfg, b2, acts[i]);
        var pts = pointsFor(cfg, endsTotal(S, b2, cfg));
        if(pts > best){ best = pts; cands = [acts[i]]; } else if(pts === best) cands.push(acts[i]);
      }
      return rng.pick(cands);
    }
    return rng.pick(acts);
  }
  var ctx = { w: lineWeights(cfg), P:null, unseen:null };
  if(level >= 3){ ctx.unseen = unseenTiles(view); ctx.P = holdProbs(view, ctx.unseen); }
  var bestA = null, bestV = -Infinity;
  for(i = 0; i < acts.length; i++){
    var v = evalLinePlay(view, acts[i], level, ctx) + rng.float() * 0.01;
    if(v > bestV){ bestV = v; bestA = acts[i]; }
  }
  return bestA;
}

/* ---------- Mexican Train AI ---------- */
function chainBest(S, hand, startV, limit){
  /* lant maxim (suma pips) din mana, pornind de la valoarea startV; returneaza {seq:[tile], pips} */
  var best = { seq:[], pips:0 }, nodes = 0, used = {};
  function dfs(v, seq, pips){
    if(++nodes > limit) return;
    if(pips > best.pips || (pips === best.pips && seq.length > best.seq.length)){ best = { seq:seq.slice(), pips:pips }; }
    for(var i = 0; i < hand.length; i++){
      var t = hand[i]; if(used[t]) continue;
      var a = S.A[t], b = S.B[t], nv = -1;
      if(a === v) nv = b; else if(b === v) nv = a; else continue;
      used[t] = 1; seq.push(t);
      dfs(nv, seq, pips + a + b);
      seq.pop(); used[t] = 0;
    }
  }
  dfs(startV, [], 0);
  return best;
}
function chainLen(S, hand, startV){ return chainBest(S, hand, startV, 4000).seq.length; }

function trainUnseenCount(view, v){
  /* cate piese nevazute contin valoarea v */
  var S = view.S, mine = view.hands[view.me], mm = new Uint8Array(S.size), c = 0, i;
  for(i = 0; i < mine.length; i++) mm[mine[i]] = 1;
  for(var t = 0; t < S.size; t++) if(!view.playedMask[t] && !mm[t] && (S.A[t] === v || S.B[t] === v)) c++;
  return c;
}
function trainPipVal(view, t){ var v = view.S.A[t] + view.S.B[t]; if(view.blank50 && t === 0) v = 50; return v; }

function aiTrain(view, level, rng){
  var acts = legalActionsTrain(view), i;
  if(acts.length === 1) return acts[0];
  var S = view.S, me = view.me, np = view.np;
  var plays = acts.filter(function(a){ return a.t === 'play'; });
  var hasEnd = acts.some(function(a){ return a.t === 'end'; });
  if(view.status === 'first'){
    if(level <= 1){
      if(plays.length === 0) return {t:'end'};
      return rng.pick(plays);
    }
    var ch = chainBest(S, view.hands[me], endOfTrain(view, me), 6000);
    if(ch.seq.length === 0) return hasEnd ? {t:'end'} : acts[0];
    var t0 = ch.seq[0];
    for(i = 0; i < plays.length; i++) if(plays[i].tile === t0) return plays[i];
    return plays[0];
  }
  if(level <= 1) return rng.pick(plays);
  var hand = view.hands[me], bestA = plays[0], bestV = -Infinity;
  var nextP = (me + 1) % np;
  for(i = 0; i < plays.length; i++){
    var a = plays[i], t = a.tile, pv = trainPipVal(view, t), dbl = S.A[t] === S.B[t];
    var rest = hand.filter(function(x){ return x !== t; });
    var v = pv * 1.0;
    if(a.tr === me){ v += 4; if(view.trains[me].marker) v += 3; }
    else if(a.tr === np) v += 0;      /* trenul mexican: neutru */
    else v -= 1;
    if(rest.length === 0) v += 200;
    var cl = chainLen(S, rest, a.out);
    if(a.tr === me || a.tr === np) v += 2.2 * cl; else v += 0.6 * cl;
    if(dbl){
      var sat = rest.some(function(x){ return S.A[x] === a.out || S.B[x] === a.out; });
      v += sat ? 7 : -2;
      if(!sat && level >= 3){
        /* dubla lasata deschisa: urmatorul jucator trebuie sa o satisfaca; cu cat are mai putine sanse, cu atat mai bine */
        var cnt = trainUnseenCount(view, a.out);
        var h = view.handCounts[nextP] + 0.0, totalUnseen = 0;
        for(var q = 0; q < np; q++) if(q !== me) totalUnseen += view.handCounts[q];
        totalUnseen += view.boneyard.length;
        var pHas = totalUnseen > 0 ? 1 - Math.pow(Math.max(0, 1 - h / totalUnseen), cnt) : 0;
        v += (1 - pHas) * 6;
      }
    }
    if(level >= 3 && a.tr !== me){
      /* pe trenurile altora / mexican: capatul lasat sa fie rar pentru adversari si sa nu mi se potriveasca */
      var scarce = 6 - Math.min(6, trainUnseenCount(view, a.out));
      v += 0.5 * scarce;
      if(a.tr !== np && view.trains[a.tr].marker) v += 1.5;
    }
    v += rng.float() * 0.01;
    if(v > bestV){ bestV = v; bestA = a; }
  }
  return bestA;
}

function aiAction(view, level, rng){
  return view.fam === 'train' ? aiTrain(view, level, rng) : aiLine(view, level, rng);
}

/* ===== 40-layout: asezarea pieselor pe masa (serpentina care se roteste la margini) =====
   Unitati: "hc" = jumatate de patratel (o jumatate de piesa = 2hc; piesa = 4hc x 2hc; dubla pusa transversal = 2hc x 4hc).
   Orizontal: marginile sunt garantate [0, W] (W = 2*cols hc). Vertical: nelimitat (tabla creste in jos/sus; scroll/zoom in UI). */

/* Asaza un lant de piese ca o serpentina cu viraje la margini.
   o = { x:fata de atasare (hc), line:linia lantului (y), dir:+1/-1, vdir:+1(jos)/-1(sus), xmin, xmax }
   items = [{dbl:bool}] ; intoarce { rects:[...], head:{x,line,dir,vdir}, next:rect urmator } */
function snakeChain(items, o){
  var x = o.x, line = o.line, dir = o.dir, vdir = o.vdir, xmin = o.xmin, xmax = o.xmax;
  var rects = [];
  function place(isDbl, probeOnly){
    var rect;
    var len = isDbl ? 2 : 4;
    var fits = dir > 0 ? (x + len <= xmax) : (x - len >= xmin);
    if(fits){
      if(isDbl) rect = { x: dir > 0 ? x : x - 2, y: line - 2, w: 2, h: 4, orient:'V', kind:'dbl', inSide: dir > 0 ? 'L' : 'R' };
      else rect = { x: dir > 0 ? x : x - 4, y: line - 1, w: 4, h: 2, orient:'H', kind:'norm', inSide: dir > 0 ? 'L' : 'R' };
      if(!probeOnly){ x += dir * len; }
    } else {
      /* viraj: piesa verticala lipita de fata curenta; apoi lantul continua in sens invers pe linia urmatoare (pas de 2 unitati = 4hc) */
      rect = { x: dir > 0 ? x : x - 2, y: vdir > 0 ? line : line - 4, w: 2, h: 4, orient:'V', kind:'corner', inSide: vdir > 0 ? 'T' : 'B' };
      if(!probeOnly){ line += vdir * 4; dir = -dir; }
    }
    return rect;
  }
  for(var i = 0; i < items.length; i++) rects.push(place(!!items[i].dbl, false));
  /* urmatoarea pozitie (pentru butonul „aici") — o piesa obisnuita; daca nu incape: viraj */
  var nx = place(false, true);
  return { rects:rects, head:{x:x, line:line, dir:dir, vdir:vdir}, next:nx };
}

function bboxOf(rects){
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for(var i = 0; i < rects.length; i++){
    var r = rects[i];
    if(r.x < x0) x0 = r.x; if(r.y < y0) y0 = r.y;
    if(r.x + r.w > x1) x1 = r.x + r.w; if(r.y + r.h > y1) y1 = r.y + r.h;
  }
  return { x0:x0, y0:y0, x1:x1, y1:y1 };
}

/* Aseaza tabla jocurilor cu linie. cols = latimea in "unitati" (patratele); intoarce
   { items:[{tile,arm,idx,rect,inV,outV,band}], ends:[{arm,v,rect}], bands:[{arm:'U'|'D', ghost:rect, label y}], bbox } */
function layoutLine(S, board, cols){
  var Wh = cols * 2, F = board.first, items = [], ends = [], bands = [];
  if(!F) return { items:items, ends:ends, bands:bands, bbox:{x0:0,y0:-4,x1:Wh,y1:4}, W:Wh };
  var cx = Wh / 2, fd = (F.a === F.b);
  var frect = fd ? { x:cx-1, y:-2, w:2, h:4, orient:'V', kind:'dbl', inSide:'T' } : { x:cx-2, y:-1, w:4, h:2, orient:'H', kind:'norm', inSide:'L' };
  items.push({ tile:F.tile, arm:'F', idx:-1, rect:frect, a:F.a, b:F.b, first:true });
  var xmin = 2, xmax = Wh - 2;
  var leftFace = fd ? cx - 1 : cx - 2, rightFace = fd ? cx + 1 : cx + 2;
  var res = {};
  function doArm(name, opts){
    var arm = board.arms[name];
    var its = arm.map(function(t){ return { dbl: S.A[t.tile] === S.B[t.tile] }; });
    var r = snakeChain(its, opts);
    for(var i = 0; i < arm.length; i++) items.push({ tile:arm[i].tile, arm:name, idx:i, rect:r.rects[i], inV:arm[i].inV, outV:arm[i].outV });
    res[name] = r;
    return r;
  }
  doArm('A', { x:leftFace,  line:0, dir:-1, vdir:-1, xmin:xmin, xmax:xmax });
  doArm('B', { x:rightFace, line:0, dir: 1, vdir: 1, xmin:xmin, xmax:xmax });
  var mainRects = items.map(function(it){ return it.rect; });
  var mb = bboxOf(mainRects);
  var openE = openEnds(S, board);
  /* brate U / D (spinner): benzi separate deasupra / dedesubt, cu un "fantoma" a spinnerului la inceput */
  var minY = mb.y0, maxY = mb.y1;
  var extraRects = [];
  var uOpen = openE.filter(function(e){ return e.arm === 'U'; }).length > 0;
  if(uOpen){
    var sv = spinnerValue(S, board);
    var order = ['U','D'];
    order.forEach(function(nm){
      var up = nm === 'U';
      var line = up ? minY - 6 : maxY + 6;
      var ghost = { x:2, y:line-2, w:2, h:4, orient:'V', kind:'dbl', inSide:'T' };
      var arm = board.arms[nm];
      var its = arm.map(function(t){ return { dbl: S.A[t.tile] === S.B[t.tile] }; });
      var r = snakeChain(its, { x:4, line:line, dir:1, vdir: up ? -1 : 1, xmin:xmin, xmax:xmax });
      for(var i = 0; i < arm.length; i++) items.push({ tile:arm[i].tile, arm:nm, idx:i, rect:r.rects[i], inV:arm[i].inV, outV:arm[i].outV });
      res[nm] = r;
      bands.push({ arm:nm, ghost:ghost, sv:sv, line:line });
      extraRects.push(ghost); r.rects.forEach(function(q){ extraRects.push(q); }); extraRects.push(r.next);
      if(up) minY = Math.min(minY, bboxOf([ghost].concat(r.rects, [r.next])).y0 - 2);
    });
  }
  openE.forEach(function(e){ ends.push({ arm:e.arm, v:e.v, rect: res[e.arm].next }); });
  var all = mainRects.concat(extraRects);
  ends.forEach(function(e){ all.push(e.rect); });
  var bb = bboxOf(all);
  bb.x0 = Math.min(bb.x0, 0); bb.x1 = Math.max(bb.x1, Wh);
  return { items:items, ends:ends, bands:bands, bbox:bb, W:Wh };
}

/* Mexican Train: fiecare tren = o banda; eticheta + dubla-motor "fantoma" la inceput. */
function layoutTrains(st, cols){
  var Wh = cols * 2, xmin = 2, xmax = Wh - 2, y = 0, items = [], bands = [], np = st.np, all = [];
  for(var tr = 0; tr <= np; tr++){
    var tiles = tr === np ? st.mex : st.trains[tr].tiles;
    var line = y + 6;           /* 4hc rezervati pentru eticheta deasupra benzii */
    var ghost = { x:0, y:line-2, w:2, h:4, orient:'V', kind:'dbl', inSide:'T' };
    var its = tiles.map(function(t){ return { dbl: st.S.A[t.tile] === st.S.B[t.tile] }; });
    var r = snakeChain(its, { x:2, line:line, dir:1, vdir:1, xmin:xmin, xmax:xmax });
    for(var i = 0; i < tiles.length; i++) items.push({ tile:tiles[i].tile, tr:tr, idx:i, rect:r.rects[i], inV:tiles[i].inV, outV:tiles[i].outV });
    var rects = [ghost].concat(r.rects, [r.next]);
    var bb = bboxOf(rects);
    bands.push({ tr:tr, ghost:ghost, labelY:y, end:r.next, endV: tiles.length ? tiles[tiles.length-1].outV : st.hubV, y0:y, y1:bb.y1 });
    rects.forEach(function(q){ all.push(q); });
    y = bb.y1 + 2;
  }
  var bbx = bboxOf(all);
  bbx.x0 = 0; bbx.x1 = Math.max(bbx.x1, Wh); bbx.y0 = 0;
  return { items:items, bands:bands, bbox:bbx, W:Wh };
}

    approx:['Pagat permite și tragerea VOLUNTARĂ (chiar dacă ai o mutare) și spune că în varianta portoricană este interzisă; aici se aplică varianta strictă: nu ai voie să tragi dacă poți muta.',
            'Regula „ultimele 2 piese rămân în bon” este cea din Pagat pentru Draw; unele cluburi trag până la golirea bonului.'] },
  en:{ name:'Draw (drawing from the boneyard)',
    origin:'The variation of Block where, if you cannot move, you draw from the boneyard.',
    desc:'Like Block, but a player who cannot move draws tiles until one fits.',
    rules:[
      'Hands (Pagat): 7 tiles each with 2 or 3 players, 6 each with 4 players; the other tiles form the boneyard. (Note: different from Block.)',
      'If you have no move you draw one tile at a time until you can play; a drawn tile that fits is played at once.',
      'The last 2 tiles stay in the boneyard and cannot be drawn; with no move and the boneyard at 2 tiles you pass.',
      'Block: the boneyard is at its reserve and nobody can move. Scoring and target as in Block.'],
    approx:['Pagat also allows VOLUNTARY drawing (even when you can play) and says it is illegal in the Puerto Rican version; the strict version is applied here: you may not draw while you have a play.',
            'The "last 2 tiles stay in the boneyard" rule is the one Pagat gives for Draw; some clubs draw until the boneyard is empty.'] },
  fr:{"name":"Draw (avec pioche dans le talon)","origin":"La variante de Block où, si vous ne pouvez pas jouer, vous piochez dans le talon.","desc":"Comme Block, mais un joueur qui ne peut pas jouer pioche des dominos jusqu’à en trouver un qui convienne.","rules":["Mains (Pagat) : 7 dominos chacun à 2 ou 3 joueurs, 6 chacun à 4 joueurs ; les autres dominos forment le talon. (Attention : différent de Block.)","Si vous n’avez aucun coup, vous piochez un domino à la fois jusqu’à pouvoir jouer ; un domino pioché qui convient est joué aussitôt.","Les 2 derniers dominos restent dans le talon et ne peuvent pas être piochés ; sans coup possible et avec 2 dominos au talon, vous passez.","Blocage : le talon est à sa réserve et plus personne ne peut jouer. Décompte et objectif comme à Block."],"approx":["Pagat autorise aussi la pioche VOLONTAIRE (même si vous pouvez jouer) et indique qu’elle est interdite dans la version portoricaine ; la version stricte est appliquée ici : vous n’avez pas le droit de piocher si vous pouvez jouer.","La règle « les 2 derniers dominos restent dans le talon » est celle que Pagat donne pour Draw ; certains clubs piochent jusqu’à épuisement du talon."]},
  it:{"name":"Draw (con pesca dal monte)","origin":"La variante di Block in cui, se non puoi muovere, peschi dal monte.","desc":"Come Block, ma chi non può muovere pesca tessere finché una non va bene.","rules":["Mani (Pagat): 7 tessere a testa con 2 o 3 giocatori, 6 a testa con 4 giocatori; le altre tessere formano il monte. (Attenzione: diverso da Block.)","Se non hai mosse peschi una tessera alla volta finché non puoi giocare; una tessera pescata che si adatta si gioca subito.","Le ultime 2 tessere restano nel monte e non si possono pescare; senza mosse e con 2 tessere nel monte si passa.","Blocco: il monte è alla riserva e nessuno può più muovere. Punteggio e obiettivo come in Block."],"approx":["Pagat consente anche la pesca VOLONTARIA (anche se puoi giocare) e dice che a Porto Rico è vietata; qui si applica la versione rigorosa: non puoi pescare se hai una mossa.","La regola «le ultime 2 tessere restano nel monte» è quella che Pagat indica per Draw; alcuni circoli pescano fino a svuotare il monte."]},
  es:{"name":"Draw (con robo del pozo)","origin":"La variante de Block en la que, si no puedes jugar, robas del pozo.","desc":"Como Block, pero quien no puede jugar roba fichas hasta que una encaje.","rules":["Manos (Pagat): 7 fichas cada uno con 2 o 3 jugadores, 6 cada uno con 4 jugadores; las demás fichas forman el pozo. (Ojo: distinto de Block.)","Si no tienes jugada, robas una ficha cada vez hasta poder jugar; una ficha robada que encaje se juega al instante.","Las 2 últimas fichas se quedan en el pozo y no se pueden robar; sin jugada y con el pozo en 2 fichas, se pasa.","Bloqueo: el pozo está en su reserva y nadie puede mover. Puntuación y objetivo como en Block."],"approx":["Pagat permite también el robo VOLUNTARIO (aunque puedas jugar) y dice que en la versión puertorriqueña está prohibido; aquí se aplica la versión estricta: no puedes robar si tienes jugada.","La regla «las 2 últimas fichas se quedan en el pozo» es la que Pagat da para Draw; algunos clubes roban hasta vaciar el pozo."]},
  pt:{"name":"Draw (com compra do monte)","origin":"A variante de Block em que, se não puderes jogar, compras do monte.","desc":"Como Block, mas quem não pode jogar compra peças até que uma sirva.","rules":["Mãos (Pagat): 7 peças cada com 2 ou 3 jogadores, 6 cada com 4 jogadores; as outras peças formam o monte. (Atenção: diferente de Block.)","Se não tens jogada, compras uma peça de cada vez até poderes jogar; uma peça comprada que sirva joga-se de imediato.","As últimas 2 peças ficam no monte e não podem ser compradas; sem jogada e com o monte em 2 peças, passa-se.","Bloqueio: o monte está na reserva e ninguém pode jogar. Pontuação e objetivo como em Block."],"approx":["O Pagat permite também a compra VOLUNTÁRIA (mesmo podendo jogar) e diz que na versão porto-riquenha é proibida; aqui aplica-se a versão estrita: não podes comprar se tens jogada.","A regra «as últimas 2 peças ficam no monte» é a que o Pagat indica para Draw; alguns clubes compram até esvaziar o monte."]},
  de:{"name":"Draw (mit Nachziehen vom Vorrat)","origin":"Die Variante von Block, bei der man vom Vorrat nachzieht, wenn man nicht legen kann.","desc":"Wie Block, aber wer nicht legen kann, zieht Steine nach, bis einer passt.","rules":["Hände (Pagat): 7 Steine pro Person bei 2 oder 3 Spielenden, 6 bei 4 Spielenden; die übrigen Steine bilden den Vorrat. (Achtung: anders als bei Block.)","Wer keinen Zug hat, zieht einen Stein nach dem anderen, bis er legen kann; ein gezogener passender Stein wird sofort gelegt.","Die letzten 2 Steine bleiben im Vorrat und dürfen nicht gezogen werden; ohne Zug und mit 2 Steinen im Vorrat passt man.","Blockade: Der Vorrat ist auf seiner Reserve und niemand kann mehr ziehen. Wertung und Ziel wie bei Block."],"approx":["Pagat erlaubt auch das FREIWILLIGE Nachziehen (selbst bei vorhandenem Zug) und sagt, dass es in der puertoricanischen Version verboten ist; hier gilt die strenge Fassung: Man darf nicht nachziehen, solange man legen kann.","Die Regel „Die letzten 2 Steine bleiben im Vorrat“ ist die, die Pagat für Draw angibt; manche Clubs ziehen, bis der Vorrat leer ist."]},
  hu:{"name":"Draw (húzással a kupacból)","origin":"A Block változata, amelyben ha nem tudsz lépni, a kupacból húzol.","desc":"Mint a Block, de aki nem tud lépni, addig húz köveket, amíg egy nem illik.","rules":["Leosztás (Pagat): 2 vagy 3 játékosnál fejenként 7 kő, 4 játékosnál fejenként 6; a többi kő alkotja a kupacot. (Figyelem: eltér a Blocktól.)","Ha nincs lépésed, egyesével húzol köveket, amíg lépni nem tudsz; a kihúzott, illő követ azonnal lerakod.","Az utolsó 2 kő a kupacban marad, és nem húzható; ha nincs lépés, és a kupacban 2 kő van, passzolsz.","Blokk: a kupac a tartalékán áll, és senki sem tud lépni. A pontozás és a cél ugyanaz, mint a Blocknál."],"approx":["A Pagat az ÖNKÉNTES húzást is megengedi (akkor is, ha tudsz lépni), és azt írja, hogy a portorikói változatban tilos; itt a szigorú változat érvényes: nem húzhatsz, ha van lépésed.","Az „utolsó 2 kő a kupacban marad” szabály az, amelyet a Pagat a Drawhoz megad; egyes klubok a kupac kiürüléséig húznak."]} },

{ id:'allfives', vid:'allfives', play:true, set:'6', players:[2,4], tags:['score','spinner','team','draw'], icon:[5,5],
  ro:{ name:'All Fives (Fives, cu spinner)',
    origin:'Familia „Fives”: scorezi când suma capetelor deschise este multiplu de 5. Forma cu spinner e cea din turneele nord-americane.',
    desc:'După fiecare piesă adunăm capetele deschise; dacă suma e multiplu de 5, o încasezi pe loc. Primul dublu jucat devine spinner și deschide patru brațe.',
    rules:[
      'Set double-6. Mâini: 2 jucători câte 9 piese, 3 jucători câte 7, 4 jucători câte 5 (la 4 se joacă adesea în echipe: aici poți alege 2 echipe de câte 2, partenerul stă vizavi). Restul = bon.',
      'Deschide deținătorul celui mai mare dublu (în loc de tragerea la sorți), cu orice piesă. Apoi începe cel care a ieșit în mâna anterioară; după blocaj, se alege la sorți.',
      'După fiecare piesă se adună capetele deschise ale mesei. Dacă totalul e multiplu de 5 (5–35), jucătorul punctează totalul pe loc. Un dublu la capătul unui braț numără ambele jumătăți (5-5 = 10, 6-6 = 12).',
      'Primul dublu jucat (oriunde) este SPINNER: primele două piese se pun pe cele două laturi ale lui; abia apoi, de pe capetele lui, pornesc brațele 3 și 4. Cât timp spinnerul nu are piese pe ambele laturi, el numără 2×valoare; după aceea nu mai numără, doar capetele reale ale brațelor.',
      'Dacă nu poți muta, tragi din bon până găsești o piesă care se potrivește (o joci imediat) sau bonul se golește; atunci pasezi. Nu ai voie să tragi dacă ai mutare.',
      'Sfârșitul mâinii: cine rămâne fără piese încasează punctele pieselor rămase ale adversarilor, rotunjite la cel mai apropiat multiplu de 5 (3 → 5, 2 → 0). La blocaj câștigă cel (sau echipa) cu cele mai puține puncte rămase și încasează punctele celorlalți, rotunjite; egalitate la 2 sau 4 jucători: nimeni; la 3 jucători, doi egali pe minim împart punctele celui de-al treilea.',
      'Ținta: 250 de puncte la 2 jucători, 200 la 3–4; jocul se termină imediat ce cineva atinge ținta.'],
    approx:['Sursa nu spune explicit dacă brațele 3 și 4 se pot porni înainte de a acoperi ambele laturi ale spinnerului; am aplicat uzul american (abia după ambele laturi).',
            'Rotunjirea la 5 se face pe totalul punctelor adversarilor (nu piesă cu piesă).',
            'Împărțirea punctelor la egalitate la 3 jucători: fiecare primește jumătate, rotunjită în jos.'] },
  en:{ name:'All Fives (Fives, with spinner)',
    origin:'The "Fives" family: you score when the open ends add up to a multiple of five. The spinner form is the North American tournament game.',
    desc:'After every tile the open ends are added; if the total is a multiple of 5 you score it at once. The first double played becomes a spinner and opens four arms.',
    rules:[
      'Double-six set. Hands: 2 players 9 tiles, 3 players 7, 4 players 5 (four usually play as partners: here you may choose 2 teams of 2, partner opposite). The rest is the boneyard.',
      'The holder of the highest double leads, any tile (instead of drawing lots). Afterwards whoever went out last hand leads; after a block, by lot.',
      'After each tile the open ends are added. If the total is a multiple of 5 (5–35) the player scores it at once. A double at the end of an arm counts both halves (5-5 = 10, 6-6 = 12).',
      'The first double played (anywhere) is the SPINNER: the first two tiles go against its two sides; only then can arms 3 and 4 start from its ends. While the spinner does not have tiles on both sides it counts twice its value; afterwards it no longer counts, only the real arm ends.',
      'If you cannot play you draw until you get a tile that fits (played at once) or the boneyard is empty; then you pass. You may not draw while holding a playable tile.',
      'End of hand: whoever goes out scores the pips left in the opponents\' hands, rounded to the nearest multiple of 5 (3 → 5, 2 → 0). In a block the player/team with the fewest pips wins and scores the others\' pips, rounded; a tie scores nothing with 2 or 4 players; with 3 players two tied at the minimum split the third player\'s points.',
      'Target: 250 points with 2 players, 200 with 3–4; the game ends the moment someone reaches it.'],
    approx:['The source does not say explicitly whether arms 3 and 4 may start before both spinner sides are covered; the usual US convention (only after both sides) is applied.',
            'The rounding to 5 is done on the total of the opponents\' pips (not tile by tile).',
            'Tie split with 3 players: each gets half, rounded down.'] },
  fr:{"name":"All Fives (Fives, avec spinner)","origin":"La famille « Fives » : on marque quand la somme des extrémités ouvertes est un multiple de cinq. La forme avec spinner est celle des tournois nord-américains.","desc":"Après chaque domino on additionne les extrémités ouvertes ; si le total est un multiple de 5, on le marque aussitôt. Le premier double joué devient spinner et ouvre quatre branches.","rules":["Jeu double-six. Mains : 2 joueurs 9 dominos, 3 joueurs 7, 4 joueurs 5 (à quatre on joue souvent en équipes : ici vous pouvez choisir 2 équipes de 2, le partenaire en face). Le reste forme le talon.","Le détenteur du plus grand double ouvre, avec n’importe quel domino (au lieu du tirage au sort). Ensuite ouvre celui qui est sorti en dernier à la manche précédente ; après un blocage, on tire au sort.","Après chaque domino on additionne les extrémités ouvertes. Si le total est un multiple de 5 (5–35), le joueur le marque aussitôt. Un double à l’extrémité d’une branche compte ses deux moitiés (5-5 = 10, 6-6 = 12).","Le premier double joué (n’importe où) est le SPINNER : les deux premiers dominos se posent contre ses deux côtés ; ce n’est qu’ensuite que les branches 3 et 4 peuvent partir de ses extrémités. Tant que le spinner n’a pas de dominos des deux côtés, il compte deux fois sa valeur ; ensuite il ne compte plus, seules comptent les extrémités réelles des branches.","Si vous ne pouvez pas jouer, vous piochez jusqu’à obtenir un domino qui convient (joué aussitôt) ou jusqu’à épuisement du talon ; vous passez alors. Vous n’avez pas le droit de piocher si vous avez un domino jouable.","Fin de manche : celui qui sort marque les points restant dans les mains des adversaires, arrondis au multiple de 5 le plus proche (3 → 5, 2 → 0). En cas de blocage, le joueur ou l’équipe qui a le moins de points gagne et marque ceux des autres, arrondis ; en cas d’égalité, personne ne marque à 2 ou 4 joueurs ; à 3 joueurs, deux joueurs à égalité au minimum se partagent les points du troisième.","Objectif : 250 points à 2 joueurs, 200 à 3–4 ; la partie s’arrête dès que quelqu’un l’atteint."],"approx":["La source ne dit pas explicitement si les branches 3 et 4 peuvent démarrer avant que les deux côtés du spinner soient couverts ; l’usage américain habituel (seulement après les deux côtés) est appliqué.","L’arrondi à 5 se fait sur le total des points des adversaires (et non domino par domino).","Partage en cas d’égalité à 3 joueurs : chacun reçoit la moitié, arrondie à l’inférieur."]},
