  de:{"name":"Lateinisches Partnerdomino (venezolanischer Stil, bis 100)","origin":"Das 2-gegen-2-Tischspiel Lateinamerikas: Die Partner sitzen sich gegenüber, und alle 28 Steine werden ausgeteilt (je 7).","desc":"Vier Spielende, zwei Teams, kein Vorrat. Ohne passenden Stein passt man („pase“); passen alle vier, ist das Spiel blockiert („tranque“) und die Teamsummen entscheiden.","rules":["Doppel-Sechs-Satz, 4 Spielende in 2 Teams (Partner einander gegenüber), je 7 Steine — kein Vorrat. Es wird gegen den Uhrzeigersinn gespielt.","Erste Runde einer Partie: Wer die 6-6 hat, muss mit ihr eröffnen. Spätere Runden: Die nächste Person in der Reihenfolge eröffnet, mit einem beliebigen Stein.","Eine einzige Reihe, gleiche Werte; Päsche quer, kein Spinner. Wer keinen passenden Stein hat, passt („pase“). Achte auf die Pässe: Sie verraten, welche Zahlen den Gegnern und dem Partner fehlen.","Die Runde endet, wenn jemand den letzten Stein legt (sein Team gewinnt) oder wenn alle vier hintereinander passen („tranque“ = Blockade).","Bei einer Blockade gewinnt das Team, dessen Reststeine weniger Augen ergeben; bei Gleichstand punktet niemand und die nächste Person in der Reihenfolge eröffnet.","Das siegreiche Team punktet die Augen, die in den Händen der GEGNER verbleiben (nicht die des Partners). Ziel: 100 Punkte.","„Capot“: eine Partie, die gewonnen wird, während die Gegner noch bei 0 stehen — die App weist darauf hin."],"approx":["Umgesetzt ist die VENEZOLANISCHE Version, wie sie Pagat beschreibt (die nächste Runde eröffnet die nächste Person in der Reihenfolge; eine Blockade mit Gleichstand punktet nicht). Die mexikanische Version unterscheidet sich: Dort eröffnet der Sieger einer Runde die nächste, und eine Blockade mit Gleichstand geht an das Team, das die Runde begonnen hat — NICHT umgesetzt. Die kubanische und die dominikanische Version beschreibt die Quelle nicht; es wird nicht behauptet, sie nachzubilden.","Die Neugeben-Regel (5 Päsche) und die Boni capicú / chuchazo / dominao der Quinientos-Version sind nicht umgesetzt.","Begriffe aus dem Pflichtenheft: „pase“ = eine Runde aussetzen; „gegenseitiges pase“ = tranque (alle passen); „capot“ = Gewinnen, während die Gegner bei 0 stehen (gewählte Definition, kein Verbandsstandard)."]},
  hu:{"name":"Latin páros dominó (venezuelai stílus, 100-ig)","origin":"Latin-Amerika 2 a 2 elleni asztali játéka: a társak szemben ülnek, és mind a 28 követ kiosztják (fejenként 7).","desc":"Négy játékos, két csapat, nincs kupac. Ha nincs illő kő, passzolunk („pase”); ha mind a négyen passzolnak, a játék blokkolt („tranque”), és a csapatok összege dönt.","rules":["Dupla hatos készlet, 4 játékos 2 csapatban (a társak szemben ülnek), fejenként 7 kő — nincs kupac. A játék az óramutató járásával ellentétesen halad.","A játszma első leosztása: a 6-6 birtokosa köteles azzal kezdeni. A következő leosztásokban a sorban következő játékos kezd, bármelyik kővel.","Egyetlen sor, egyenlő értékek; a duplák keresztben állnak, nincs spinner. Aki nem rendelkezik illő kővel, passzol („pase”). Figyeld a passzokat: megmutatják, mely számok hiányoznak az ellenfeleknek és a társnak.","A leosztás akkor ér véget, ha valaki lerakja az utolsó kövét (az ő csapata nyer), vagy ha mind a négy játékos egymás után passzol („tranque” = blokk).","Blokk esetén az a csapat nyer, amelynek megmaradt kövei kevesebb pontot adnak; döntetlen esetén senki nem pontoz, és a sorban következő játékos kezd.","A nyertes csapat megkapja az ELLENFELEK kezében maradt pontokat (a társét nem). Cél: 100 pont.","„Capot”: olyan játszma megnyerése, amikor az ellenfelek még 0-n állnak — az alkalmazás jelzi."],"approx":["A Pagaton leírt VENEZUELAI változat van megvalósítva (a következő leosztást a sorban következő játékos kezdi; a döntetlen blokk nem ér pontot). A mexikói változat eltér: ott a leosztás nyertese kezdi a következőt, és a döntetlen blokk annak a csapatnak jár, amelyik a leosztást kezdte — NINCS megvalósítva. A kubai és a dominikai változatot a forrás nem írja le, és nem állítjuk, hogy visszaadjuk őket.","Az újraosztási szabály (5 dupla) és a Quinientos változat capicú / chuchazo / dominao bónuszai nincsenek megvalósítva.","A feladatkiírás kifejezései: „pase” = kimaradás a körből; „kölcsönös pase” = tranque (mindenki passzol); „capot” = nyerés úgy, hogy az ellenfelek 0-n állnak (választott meghatározás, nem szövetségi szabvány)."]} },

{ id:'latin200', vid:'latin200', play:true, set:'6', players:[4,4], tags:['noscore','team','blocksum','latin'], icon:[4,2],
  ro:{ name:'Domino latin 200 (FID / „Doscientos”)',
    origin:'Aceleași reguli de joc ca la dominoul latin, dar partida se joacă la 200 și se punctează TOATE piesele rămase (ținta și scorul federației FID; regula „câștigătorul deschide” este cea portoricană „Doscientos”).',
    desc:'Ca dominoul latin pe echipe, dar câștigătorii încasează toate pipurile rămase pe masă (inclusiv ale partenerului), iar cine câștigă mâna o deschide pe următoarea.',
    rules:[
      'Aceeași masă ca la dominoul latin: 4 jucători, 2 echipe, 28 de piese împărțite, sens invers acelor de ceasornic, pase și tranque.',
      'Echipa câștigătoare (ieșire sau blocaj cu total mai mic) încasează totalul TUTUROR pieselor rămase, ale ambelor echipe.',
      'Ținta: 200 de puncte. Mâna următoare o deschide jucătorul care a câștigat mâna anterioară (la blocaj, ca la „Doscientos”: jucătorul din echipa câștigătoare cu mai puține puncte rămase; la egalitate cel care a pus ultima piesă); la blocaj egal, următorul în rotație.',
      'Prima mână: 6-6 deschide obligatoriu.'],
    approx:['Federația (FID) alege primul jucător prin tragere de piese, nu cu 6-6, și rotește începătorul la mâinile următoare; aici se folosește 6-6 la prima mână și regula „câștigătorul începe” (Doscientos, Puerto Rico), deci nu este nici FID pur, nici Doscientos pur.',
            'Variantele „Quinientos” și „Chiva” nu sunt implementate. Cuban/Dominican: neacoperite de sursă.'] },
  en:{ name:'Latin dominoes to 200 (FID / "Doscientos")',
    origin:'The same table game as Latin dominoes, but to 200 and with ALL remaining tiles scored (the target and scoring of the FID federation; the "winner leads" rule is the Puerto Rican "Doscientos" one).',
    desc:'Like Latin partnership dominoes, but the winners collect all the pips left on the table (including their partner\'s) and the winner of a hand leads the next.',
    rules:[
      'The same table as Latin dominoes: 4 players, 2 teams, 28 tiles dealt, counter-clockwise, passes and tranque.',
      'The winning team (going out, or the lower total in a block) scores the total of ALL remaining tiles, both teams\'.',
      'Target: 200 points. The next hand is led by the player who won the previous one (in a block, as in "Doscientos": the winning-team player with fewer pips left, ties going to the player who made the last play); on a tied block, the next in rotation.',
      'First hand: 6-6 must lead.'],
    approx:['The federation (FID) chooses the first player by drawing tiles, not by 6-6, and rotates the leader in later hands; here 6-6 leads the first hand and the "winner leads" rule (Doscientos, Puerto Rico) is used, so this is neither pure FID nor pure Doscientos.',
            '"Quinientos" and "Chiva" are not implemented. Cuban/Dominican: not covered by the source.'] },
  fr:{"name":"Domino latin à 200 (FID / « Doscientos »)","origin":"Le même jeu de table que le domino latin, mais à 200 et avec TOUS les dominos restants comptés (l’objectif et le décompte de la fédération FID ; la règle « le gagnant ouvre » est celle du « Doscientos » portoricain).","desc":"Comme le domino latin en équipes, mais les gagnants ramassent tous les points restant sur la table (y compris ceux de leur partenaire) et le gagnant d’une manche ouvre la suivante.","rules":["La même table que le domino latin : 4 joueurs, 2 équipes, 28 dominos distribués, sens inverse des aiguilles d’une montre, passes et tranque.","L’équipe gagnante (sortie, ou total le plus bas en cas de blocage) marque le total de TOUS les dominos restants, des deux équipes.","Objectif : 200 points. La manche suivante est ouverte par le joueur qui a gagné la précédente (en cas de blocage, comme au « Doscientos » : le joueur de l’équipe gagnante qui a le moins de points restants, l’égalité revenant à celui qui a fait le dernier coup) ; en cas de blocage à égalité, le suivant dans l’ordre.","Première manche : le 6-6 doit ouvrir."],"approx":["La fédération (FID) désigne le premier joueur en tirant des dominos, pas par le 6-6, et fait tourner l’ouverture aux manches suivantes ; ici le 6-6 ouvre la première manche et la règle « le gagnant ouvre » (Doscientos, Porto Rico) est utilisée, ce n’est donc ni du FID pur ni du Doscientos pur.","« Quinientos » et « Chiva » ne sont pas implémentés. Cubain/dominicain : non couverts par la source."]},
  it:{"name":"Domino latino a 200 (FID / «Doscientos»)","origin":"Lo stesso gioco da tavolo del domino latino, ma a 200 e con TUTTE le tessere rimaste conteggiate (obiettivo e punteggio della federazione FID; la regola «il vincitore apre» è quella del «Doscientos» portoricano).","desc":"Come il domino latino a coppie, ma i vincitori incassano tutti i punti rimasti sul tavolo (compresi quelli del compagno) e il vincitore di una mano apre la successiva.","rules":["Lo stesso tavolo del domino latino: 4 giocatori, 2 squadre, 28 tessere distribuite, senso antiorario, passi e tranque.","La squadra vincente (uscita, o totale più basso in un blocco) segna il totale di TUTTE le tessere rimaste, di entrambe le squadre.","Obiettivo: 200 punti. La mano successiva è aperta dal giocatore che ha vinto la precedente (in un blocco, come nel «Doscientos»: il giocatore della squadra vincente con meno punti rimasti, e in parità chi ha fatto l’ultima giocata); in un blocco in parità, il successivo in rotazione.","Prima mano: deve aprire il 6-6."],"approx":["La federazione (FID) sceglie il primo giocatore pescando tessere, non con il 6-6, e fa ruotare chi apre nelle mani successive; qui apre il 6-6 nella prima mano e si usa la regola «il vincitore apre» (Doscientos, Porto Rico), quindi non è né FID puro né Doscientos puro.","«Quinientos» e «Chiva» non sono implementati. Cubano/dominicano: non coperti dalla fonte."]},
  es:{"name":"Dominó latino a 200 (FID / «Doscientos»)","origin":"El mismo juego de mesa que el dominó latino, pero a 200 y con TODAS las fichas restantes contadas (el objetivo y la puntuación de la federación FID; la regla «el ganador sale» es la del «Doscientos» puertorriqueño).","desc":"Como el dominó latino por parejas, pero los ganadores se llevan todos los puntos que quedan en la mesa (incluidos los de su compañero) y el ganador de una mano abre la siguiente.","rules":["La misma mesa que el dominó latino: 4 jugadores, 2 equipos, 28 fichas repartidas, sentido contrario a las agujas del reloj, pases y tranque.","El equipo ganador (por salida, o por el total más bajo en un bloqueo) anota el total de TODAS las fichas restantes, de ambos equipos.","Objetivo: 200 puntos. La mano siguiente la abre el jugador que ganó la anterior (en un bloqueo, como en el «Doscientos»: el jugador del equipo ganador con menos puntos restantes, y en caso de empate quien hizo la última jugada); en un bloqueo empatado, el siguiente por turno.","Primera mano: debe salir el 6-6."],"approx":["La federación (FID) elige al primer jugador sacando fichas, no por el 6-6, y rota quien abre en las manos siguientes; aquí sale el 6-6 en la primera mano y se usa la regla «el ganador sale» (Doscientos, Puerto Rico), así que no es ni FID puro ni Doscientos puro.","«Quinientos» y «Chiva» no están implementados. Cubano/dominicano: no cubiertos por la fuente."]},
  pt:{"name":"Dominó latino a 200 (FID / «Doscientos»)","origin":"O mesmo jogo de mesa do dominó latino, mas a 200 e com TODAS as peças restantes contadas (o objetivo e a pontuação da federação FID; a regra «o vencedor abre» é a do «Doscientos» porto-riquenho).","desc":"Como o dominó latino em pares, mas os vencedores recolhem todos os pontos que restam na mesa (incluindo os do parceiro) e o vencedor de uma mão abre a seguinte.","rules":["A mesma mesa do dominó latino: 4 jogadores, 2 equipas, 28 peças distribuídas, sentido contrário ao dos ponteiros do relógio, passagens e tranque.","A equipa vencedora (por saída, ou pelo total mais baixo num bloqueio) marca o total de TODAS as peças restantes, de ambas as equipas.","Objetivo: 200 pontos. A mão seguinte é aberta pelo jogador que ganhou a anterior (num bloqueio, como no «Doscientos»: o jogador da equipa vencedora com menos pontos restantes, ficando o empate para quem fez a última jogada); num bloqueio empatado, o seguinte na rotação.","Primeira mão: o 6-6 tem de abrir."],"approx":["A federação (FID) escolhe o primeiro jogador tirando peças, não pelo 6-6, e roda quem abre nas mãos seguintes; aqui o 6-6 abre a primeira mão e usa-se a regra «o vencedor abre» (Doscientos, Porto Rico), pelo que não é nem FID puro nem Doscientos puro.","«Quinientos» e «Chiva» não estão implementados. Cubano/dominicano: não abrangidos pela fonte."]},
  de:{"name":"Lateinisches Domino bis 200 (FID / „Doscientos“)","origin":"Dasselbe Tischspiel wie das lateinische Domino, aber bis 200 und mit Wertung ALLER übrigen Steine (Ziel und Wertung des Verbands FID; die Regel „der Sieger eröffnet“ stammt vom puertoricanischen „Doscientos“).","desc":"Wie das lateinische Partnerdomino, aber die Sieger kassieren alle auf dem Tisch verbliebenen Augen (auch die ihres Partners), und der Sieger einer Runde eröffnet die nächste.","rules":["Derselbe Tisch wie beim lateinischen Domino: 4 Spielende, 2 Teams, 28 Steine ausgeteilt, gegen den Uhrzeigersinn, Pässe und Tranque.","Das siegreiche Team (durch Ausspielen oder die niedrigere Summe bei einer Blockade) punktet die Summe ALLER übrigen Steine, beider Teams.","Ziel: 200 Punkte. Die nächste Runde eröffnet die Person, die die vorige gewonnen hat (bei einer Blockade wie beim „Doscientos“: die Person des Siegerteams mit weniger Restaugen, bei Gleichstand die Person, die den letzten Zug gemacht hat); bei einer Blockade mit Gleichstand die nächste in der Reihenfolge.","Erste Runde: Die 6-6 muss eröffnen."],"approx":["Der Verband (FID) bestimmt die erste Person durch Ziehen von Steinen, nicht durch die 6-6, und lässt die Eröffnung in späteren Runden rotieren; hier eröffnet die 6-6 die erste Runde, und es gilt die Regel „der Sieger eröffnet“ (Doscientos, Puerto Rico) — es ist also weder reines FID noch reines Doscientos.","„Quinientos“ und „Chiva“ sind nicht umgesetzt. Kubanisch/dominikanisch: von der Quelle nicht abgedeckt."]},
  hu:{"name":"Latin dominó 200-ig (FID / „Doscientos”)","origin":"Ugyanaz az asztali játék, mint a latin dominó, de 200-ig és az ÖSSZES megmaradt kő beszámításával (a FID szövetség célja és pontozása; a „nyertes kezd” szabály a portorikói „Doscientos”-é).","desc":"Mint a latin páros dominó, de a nyertesek begyűjtik az asztalon maradt összes pontot (a társukét is), és a leosztás nyertese kezdi a következőt.","rules":["Ugyanaz az asztal, mint a latin dominónál: 4 játékos, 2 csapat, 28 kiosztott kő, az óramutató járásával ellentétesen, passzok és tranque.","A nyertes csapat (kimenéssel, vagy blokkban a kisebb összeggel) megkapja az ÖSSZES megmaradt kő összegét, mindkét csapatét.","Cél: 200 pont. A következő leosztást az kezdi, aki az előzőt megnyerte (blokk esetén, mint a „Doscientos”-ban: a nyertes csapat kevesebb megmaradt ponttal rendelkező játékosa, holtversenynél az, aki az utolsó lépést tette); döntetlen blokknál a sorban következő.","Első leosztás: a 6-6-nak kell kezdenie."],"approx":["A szövetség (FID) köveket húzva választja ki az első játékost, nem a 6-6 alapján, és a későbbi leosztásokban forgatja a kezdést; itt a 6-6 kezd az első leosztásban, és a „nyertes kezd” szabály (Doscientos, Puerto Rico) érvényes, tehát ez sem tiszta FID, sem tiszta Doscientos.","A „Quinientos” és a „Chiva” nincs megvalósítva. Kubai/dominikai: a forrás nem fedi le."]} },

{ id:'mexican', vid:'mexican', play:true, set:'12', players:[2,4], tags:['train','draw'], icon:[12,12],
  ro:{ name:'Mexican Train (trenuri personale)',
    origin:'Joc de familie din familia „Trains”: fiecare jucător își construiește un tren personal pornind de la dublul-motor; există și un tren mexican comun.',
    desc:'Set double-12 (91 de piese), 13 runde de la 12-12 la 0-0. Scopul: scapi primul de piese; la sfârșit câștigă cine are cele mai puține puncte de penalizare.',
    rules:[
      'Set double-12 (91 de piese). Mână: 15 piese la 2–4 jucători. Restul = bon („cimitirul”). Sesiunea are 13 runde: dublul-motor al rundei 1 este 12-12, apoi 11-11 … 0-0.',
      'Dublul-motor se pune pe masă înainte de amestec (variantă din sursă); ceilalți 90 de domino se împart. Începe un jucător în rotație.',
      'Prima tură a fiecăruia: își pornește trenul (prima piesă trebuie să se potrivească cu motorul) și poate pune cât de mult lanț poate; nu poate juca pe alt tren și nu trage. Cine nu poate porni își marchează trenul cu un jeton, fără tragere.',
      'Următoarele ture: o singură piesă, pe trenul propriu, pe un tren cu jeton sau pe trenul mexican (oricine îl poate porni cu o piesă care se potrivește motorului).',
      'Dacă nu ai nicio mutare tragi UNA din bon; dacă se potrivește, o joci; altfel pasezi și pui un jeton pe trenul tău (alții pot juca pe el). Jetonul se scoate când joci pe trenul tău.',
      'Dubluri: după ce joci un dublu (din tura a doua încolo) trebuie să mai pui o piesă, oriunde ai voie (dacă e tot dublu, încă una). Dacă dublul rămâne nesatisfăcut, următoarea piesă a mesei trebuie pusă pe el („satisfacerea dublului”): jucătorul următor o face chiar și pe un tren privat; dacă nu poate, trage una și, dacă nu se potrivește, pasează cu jeton, iar obligația trece mai departe. Mai multe dubluri deschise se satisfac în ordinea jucării. Un dublu pus ca ultimă piesă te scoate din joc.',
      'Runda se termină când cineva rămâne fără piese sau când bonul e gol și nimeni nu mai poate muta (blocaj). Fiecare adună pipurile rămase (cine a ieșit: 0). Câștigă cine are totalul cel mai mic după toate rundele.'],
    approx:['Pot juca 2–4 jucători (sursa permite până la 10). Poți alege 1, 3 sau 13 runde.',
            'Dublul-alb la 50 de puncte este doar o opțiune (implicit 0, ca în sursă).',
            'Variantele cu scor pozitiv și celelalte variații de jetoane din sursă nu sunt implementate.',
            'AI: nivelurile 2 și 3 au aceeași forță în teste (nivelul 3 nu adaugă un avantaj măsurabil aici); ambele bat clar nivelul 1.'] },
  en:{ name:'Mexican Train (personal trains)',
    origin:'A family game from the "Trains" family: each player builds a personal train from the engine double; there is also a shared Mexican train.',
    desc:'Double-twelve set (91 tiles), 13 rounds from 12-12 down to 0-0. Goal: get rid of your tiles first; at the end the player with the fewest penalty points wins.',
    rules:[
      'Double-twelve set (91 tiles). Hand: 15 tiles with 2–4 players. The rest is the boneyard. A session has 13 rounds: the engine double of round 1 is 12-12, then 11-11 … 0-0.',
      'The engine double is placed on the table before shuffling (a variation from the source); the other 90 tiles are dealt. A player in rotation starts.',
      'Each player\'s first turn: start your train (the first tile must match the engine) and play as long a chain as you can; no other train, and no drawing. A player who cannot start marks their train with a marker, without drawing.',
      'Later turns: a single tile, on your own train, on a marked train, or on the Mexican train (anyone may start it with a tile matching the engine).',
      'With no play you draw ONE tile; if it fits you play it; otherwise you pass and put a marker on your train (others may play on it). The marker comes off when you play on your own train.',
      'Doubles: after playing a double (from the second turn on) you must play one more tile anywhere you may (and another if that is a double too). If a double stays unsatisfied, the next tile played on the layout must go on it ("satisfying the double"): the next player does it even on a private train; if they cannot, they draw one and, if it does not fit, pass with a marker, and the duty moves on. Several open doubles are satisfied in the order they were played. A double played as your last tile takes you out.',
      'A round ends when a player empties their hand or when the boneyard is empty and nobody can move (a block). Everyone counts remaining pips (the player who went out: 0). After all rounds the lowest total wins.'],
    approx:['2–4 players (the source allows up to 10). You can choose 1, 3 or 13 rounds.',
            'The double blank worth 50 is only an option (default 0, as in the source).',
            'Positive scoring and the other marker variations in the source are not implemented.',
            'AI: levels 2 and 3 play equally strongly in tests (level 3 adds no measurable edge here); both clearly beat level 1.'] },
  fr:{"name":"Mexican Train (trains personnels)","origin":"Un jeu familial de la famille des « Trains » : chaque joueur construit un train personnel à partir du double de départ ; il existe aussi un train mexicain commun.","desc":"Jeu double-douze (91 dominos), 13 manches du 12-12 jusqu’au 0-0. But : se débarrasser le premier de ses dominos ; à la fin, le joueur ayant le moins de points de pénalité gagne.","rules":["Jeu double-douze (91 dominos). Main : 15 dominos à 2–4 joueurs. Le reste forme le talon. Une session compte 13 manches : le double de départ de la manche 1 est le 12-12, puis 11-11 … 0-0.","Le double de départ est posé sur la table avant le mélange (variante de la source) ; les 90 autres dominos sont distribués. Un joueur commence à tour de rôle.","Premier tour de chaque joueur : démarrez votre train (le premier domino doit s’accorder avec le double de départ) et jouez la plus longue chaîne possible ; aucun autre train, et pas de pioche. Un joueur qui ne peut pas démarrer marque son train d’un marqueur, sans piocher.","Tours suivants : un seul domino, sur votre propre train, sur un train marqué ou sur le train mexicain (chacun peut le démarrer avec un domino qui s’accorde avec le double de départ).","Sans coup possible, vous piochez UN domino ; s’il convient, vous le jouez ; sinon vous passez et posez un marqueur sur votre train (les autres peuvent y jouer). Le marqueur est retiré quand vous jouez sur votre propre train.","Doubles : après avoir joué un double (à partir du deuxième tour) vous devez jouer un domino de plus où vous le pouvez (et encore un autre si c’est aussi un double). Si un double reste non satisfait, le domino suivant joué sur la table doit aller dessus (« satisfaire le double ») : le joueur suivant le fait même sur un train privé ; s’il ne le peut pas, il pioche un domino et, s’il ne convient pas, il passe avec un marqueur, et l’obligation se transmet. Plusieurs doubles ouverts sont satisfaits dans l’ordre où ils ont été joués. Un double joué comme dernier domino vous fait sortir.","Une manche se termine quand un joueur vide sa main ou que le talon est vide et que personne ne peut jouer (blocage). Chacun compte ses points restants (celui qui est sorti : 0). Après toutes les manches, le total le plus bas gagne."],"approx":["2–4 joueurs (la source en autorise jusqu’à 10). Vous pouvez choisir 1, 3 ou 13 manches.","Le double blanc valant 50 n’est qu’une option (0 par défaut, comme dans la source).","Le décompte positif et les autres variantes de marqueurs de la source ne sont pas implémentés.","IA : les niveaux 2 et 3 jouent aussi fort lors des tests (le niveau 3 n’apporte aucun avantage mesurable ici) ; les deux battent nettement le niveau 1."]},
  it:{"name":"Mexican Train (treni personali)","origin":"Un gioco di famiglia della famiglia dei «Trains»: ogni giocatore costruisce un treno personale a partire dal doppio di partenza; esiste anche un treno messicano comune.","desc":"Set doppio dodici (91 tessere), 13 round dal 12-12 fino allo 0-0. Obiettivo: liberarsi per primi delle proprie tessere; alla fine vince chi ha meno punti di penalità.","rules":["Set doppio dodici (91 tessere). Mano: 15 tessere con 2–4 giocatori. Il resto è il monte. Una sessione ha 13 round: il doppio di partenza del round 1 è il 12-12, poi 11-11 … 0-0.","Il doppio di partenza si mette sul tavolo prima di mescolare (variante della fonte); le altre 90 tessere si distribuiscono. Comincia un giocatore a turno.","Primo turno di ciascun giocatore: avvia il tuo treno (la prima tessera deve adattarsi al doppio di partenza) e gioca una catena lunga quanto puoi; nessun altro treno e nessuna pesca. Chi non può cominciare segna il proprio treno con un segnalino, senza pescare.","Turni successivi: una sola tessera, sul proprio treno, su un treno segnato o sul treno messicano (chiunque può avviarlo con una tessera che si adatta al doppio di partenza).","Senza giocate peschi UNA tessera; se si adatta la giochi; altrimenti passi e metti un segnalino sul tuo treno (gli altri possono giocarci sopra). Il segnalino si toglie quando giochi sul tuo treno.","Doppi: dopo aver giocato un doppio (dal secondo turno in poi) devi giocare ancora una tessera dove puoi (e un’altra ancora se è a sua volta un doppio). Se un doppio resta insoddisfatto, la tessera successiva giocata sul tavolo deve andare su di esso («soddisfare il doppio»): il giocatore seguente lo fa anche su un treno privato; se non può, pesca una tessera e, se non si adatta, passa con un segnalino, e l’obbligo passa oltre. Più doppi aperti si soddisfano nell’ordine in cui sono stati giocati. Un doppio giocato come ultima tessera ti fa uscire.","Un round finisce quando un giocatore svuota la mano o quando il monte è vuoto e nessuno può muovere (blocco). Tutti contano i punti rimasti (chi è uscito: 0). Dopo tutti i round vince il totale più basso."],"approx":["2–4 giocatori (la fonte ne ammette fino a 10). Puoi scegliere 1, 3 o 13 round.","Il doppio bianco da 50 è solo un’opzione (di default 0, come nella fonte).","Il punteggio positivo e le altre varianti dei segnalini della fonte non sono implementati.","IA: nei test i livelli 2 e 3 giocano con la stessa forza (il livello 3 non aggiunge alcun vantaggio misurabile); entrambi battono nettamente il livello 1."]},
  es:{"name":"Mexican Train (trenes personales)","origin":"Un juego familiar de la familia de los «Trains»: cada jugador construye un tren personal a partir del doble de arranque; también hay un tren mexicano compartido.","desc":"Juego doble doce (91 fichas), 13 rondas del 12-12 al 0-0. Objetivo: deshacerse primero de las fichas; al final gana el jugador con menos puntos de penalización.","rules":["Juego doble doce (91 fichas). Mano: 15 fichas con 2–4 jugadores. El resto es el pozo. Una sesión tiene 13 rondas: el doble de arranque de la ronda 1 es el 12-12, luego 11-11 … 0-0.","El doble de arranque se coloca en la mesa antes de mezclar (una variante de la fuente); las otras 90 fichas se reparten. Empieza un jugador por turno.","Primer turno de cada jugador: empieza tu tren (la primera ficha debe encajar con el doble de arranque) y juega una cadena todo lo larga que puedas; ningún otro tren, y sin robo. Quien no puede empezar marca su tren con un marcador, sin robar.","Turnos siguientes: una sola ficha, en tu propio tren, en un tren marcado o en el tren mexicano (cualquiera puede iniciarlo con una ficha que encaje con el doble de arranque).","Sin jugada robas UNA ficha; si encaja la juegas; si no, pasas y pones un marcador en tu tren (los demás pueden jugar en él). El marcador se quita cuando juegas en tu propio tren.","Dobles: tras jugar un doble (a partir del segundo turno) debes jugar una ficha más donde puedas (y otra más si también es doble). Si un doble queda sin satisfacer, la siguiente ficha jugada en la mesa debe ir en él («satisfacer el doble»): el siguiente jugador lo hace incluso en un tren privado; si no puede, roba una y, si no encaja, pasa con un marcador, y la obligación se traslada. Varios dobles abiertos se satisfacen en el orden en que se jugaron. Un doble jugado como última ficha te hace salir.","Una ronda termina cuando un jugador vacía su mano o cuando el pozo está vacío y nadie puede mover (bloqueo). Todos cuentan los puntos restantes (quien se fue: 0). Tras todas las rondas gana el total más bajo."],"approx":["2–4 jugadores (la fuente admite hasta 10). Puedes elegir 1, 3 o 13 rondas.","El doble blanco con valor 50 es solo una opción (0 por defecto, como en la fuente).","La puntuación positiva y las otras variantes de marcadores de la fuente no están implementadas.","IA: los niveles 2 y 3 juegan igual de fuerte en las pruebas (el nivel 3 no aporta ventaja medible aquí); ambos superan con claridad al nivel 1."]},
  pt:{"name":"Mexican Train (comboios pessoais)","origin":"Um jogo familiar da família dos «Trains»: cada jogador constrói um comboio pessoal a partir do duplo de partida; há também um comboio mexicano partilhado.","desc":"Conjunto duplo-doze (91 peças), 13 rondas do 12-12 ao 0-0. Objetivo: ficar primeiro sem peças; no fim ganha o jogador com menos pontos de penalização.","rules":["Conjunto duplo-doze (91 peças). Mão: 15 peças com 2–4 jogadores. O resto é o monte. Uma sessão tem 13 rondas: o duplo de partida da ronda 1 é o 12-12, depois 11-11 … 0-0.","O duplo de partida é colocado na mesa antes de baralhar (uma variante da fonte); as outras 90 peças são distribuídas. Começa um jogador por rotação.","Primeira vez de cada jogador: começa o teu comboio (a primeira peça tem de combinar com o duplo de partida) e joga uma cadeia tão longa quanto possas; nenhum outro comboio, e sem compra. Quem não consegue começar marca o seu comboio com um marcador, sem comprar.","Vezes seguintes: uma só peça, no teu próprio comboio, num comboio marcado ou no comboio mexicano (qualquer um o pode iniciar com uma peça que combine com o duplo de partida).","Sem jogada compras UMA peça; se servir, jogas; caso contrário, passas e pões um marcador no teu comboio (os outros podem jogar nele). O marcador é retirado quando jogas no teu próprio comboio.","Duplos: depois de jogar um duplo (a partir da segunda vez) tens de jogar mais uma peça onde puderes (e outra ainda se for também um duplo). Se um duplo ficar por satisfazer, a peça seguinte jogada na mesa tem de ir nele («satisfazer o duplo»): o jogador seguinte fá-lo mesmo num comboio privado; se não puder, compra uma e, se não servir, passa com um marcador, e a obrigação transita. Vários duplos abertos satisfazem-se pela ordem em que foram jogados. Um duplo jogado como última peça faz-te sair.","Uma ronda termina quando um jogador esvazia a mão ou quando o monte está vazio e ninguém pode jogar (bloqueio). Todos contam os pontos restantes (quem saiu: 0). Depois de todas as rondas ganha o total mais baixo."],"approx":["2–4 jogadores (a fonte admite até 10). Podes escolher 1, 3 ou 13 rondas.","O duplo-branco valendo 50 é apenas uma opção (0 por omissão, como na fonte).","A pontuação positiva e as outras variantes de marcadores da fonte não estão implementadas.","IA: os níveis 2 e 3 jogam igualmente bem nos testes (o nível 3 não traz vantagem mensurável aqui); ambos vencem claramente o nível 1."]},
  de:{"name":"Mexican Train (persönliche Züge)","origin":"Ein Familienspiel aus der „Trains“-Familie: Jede Person baut aus dem Startpasch einen persönlichen Zug; dazu gibt es einen gemeinsamen Mexican Train.","desc":"Doppel-Zwölf-Satz (91 Steine), 13 Runden von 12-12 bis 0-0. Ziel: als Erste/r die Steine loswerden; am Ende gewinnt, wer die wenigsten Strafpunkte hat.","rules":["Doppel-Zwölf-Satz (91 Steine). Hand: 15 Steine bei 2–4 Spielenden. Der Rest ist der Vorrat. Eine Sitzung hat 13 Runden: Der Startpasch von Runde 1 ist 12-12, dann 11-11 … 0-0.","Der Startpasch wird vor dem Mischen auf den Tisch gelegt (eine Variante der Quelle); die anderen 90 Steine werden ausgeteilt. Wer in der Reihenfolge dran ist, beginnt.","Erster Zug jeder Person: den eigenen Zug beginnen (der erste Stein muss zum Startpasch passen) und eine möglichst lange Kette legen; kein anderer Zug, und kein Nachziehen. Wer nicht beginnen kann, kennzeichnet seinen Zug mit einem Marker, ohne nachzuziehen.","Spätere Züge: ein einzelner Stein, an den eigenen Zug, an einen markierten Zug oder an den Mexican Train (jede Person darf ihn mit einem zum Startpasch passenden Stein beginnen).","Ohne Zug ziehst du EINEN Stein nach; passt er, legst du ihn; sonst passt du und setzt einen Marker auf deinen Zug (andere dürfen daran anlegen). Der Marker wird entfernt, wenn du an deinen eigenen Zug legst.","Päsche: Nach dem Legen eines Pasches (ab dem zweiten Zug) musst du einen weiteren Stein legen, wo du darfst (und noch einen, wenn dieser ebenfalls ein Pasch ist). Bleibt ein Pasch unbedient, muss der nächste auf dem Tisch gelegte Stein daran angelegt werden („den Pasch bedienen“): Die nächste Person tut das auch an einem privaten Zug; kann sie nicht, zieht sie einen Stein und passt, wenn er nicht passt, mit einem Marker, und die Pflicht wandert weiter. Mehrere offene Päsche werden in der Reihenfolge bedient, in der sie gelegt wurden. Ein Pasch als letzter Stein bringt dich zum Ausspielen.","Eine Runde endet, wenn jemand die Hand leert oder wenn der Vorrat leer ist und niemand mehr ziehen kann (Blockade). Alle zählen ihre Restaugen (wer fertig ist: 0). Nach allen Runden gewinnt die niedrigste Summe."],"approx":["2–4 Spielende (die Quelle erlaubt bis zu 10). Man kann 1, 3 oder 13 Runden wählen.","Der Doppel-Blanko mit Wert 50 ist nur eine Option (Standard 0, wie in der Quelle).","Positive Wertung und die weiteren Marker-Varianten der Quelle sind nicht umgesetzt.","KI: Die Stufen 2 und 3 spielen in Tests gleich stark (Stufe 3 bringt hier keinen messbaren Vorteil); beide schlagen Stufe 1 deutlich."]},
  hu:{"name":"Mexican Train (személyes vonatok)","origin":"A „Trains” család családi játéka: mindenki saját vonatot épít a kezdő dupláról; van egy közös mexikói vonat is.","desc":"Dupla tizenkettes készlet (91 kő), 13 forduló 12-12-től 0-0-ig. Cél: elsőként megszabadulni a köveidtől; a végén a legkevesebb büntetőponttal rendelkező játékos nyer.","rules":["Dupla tizenkettes készlet (91 kő). Leosztás: 15 kő 2–4 játékosnál. A többi a kupac. Egy menet 13 fordulóból áll: az 1. forduló kezdő duplája a 12-12, azután 11-11 … 0-0.","A kezdő duplát keverés előtt az asztalra tesszük (a forrás egyik változata); a másik 90 követ kiosztják. A sorban következő játékos kezd.","Minden játékos első köre: indítsd el a vonatodat (az első kőnek illeszkednie kell a kezdő duplához), és rakj le olyan hosszú láncot, amilyet csak tudsz; más vonat nincs, és húzás sincs. Aki nem tud indítani, jelzővel jelöli meg a vonatát, húzás nélkül.","A későbbi körökben egyetlen kő: a saját vonatodra, egy megjelölt vonatra vagy a mexikói vonatra (bárki elindíthatja egy, a kezdő duplához illő kővel).","Ha nincs lépés, EGY követ húzol; ha illik, lerakod; ha nem, passzolsz, és jelzőt teszel a vonatodra (mások is rárakhatnak). A jelzőt leveszik, amikor a saját vonatodra raksz.","Duplák: egy dupla lerakása után (a második körtől) még egy követ le kell rakni, ahová csak lehet (és még egyet, ha az is dupla). Ha egy dupla kielégítetlen marad, az asztalra következőként lerakott kőnek rá kell kerülnie („a dupla kielégítése”): a következő játékos ezt magánvonaton is megteszi; ha nem tud, húz egyet, és ha az nem illik, jelzővel passzol, a kötelezettség pedig továbbmegy. Több nyitott dupla kielégítése a lerakásuk sorrendjében történik. Az utolsó kőként lerakott dupla kivisz a játékból.","A forduló véget ér, ha valaki kiüríti a kezét, vagy ha a kupac üres, és senki sem tud lépni (blokk). Mindenki összeszámolja a megmaradt pontjait (aki kiment: 0). Az összes forduló után a legkisebb összeg nyer."],"approx":["2–4 játékos (a forrás legfeljebb 10-et enged). Választhatsz 1, 3 vagy 13 fordulót.","Az 50 pontot érő dupla üres csak opció (alapértelmezetten 0, ahogy a forrásban).","A pozitív pontozás és a forrás egyéb jelzős változatai nincsenek megvalósítva.","MI: a 2. és a 3. szint a tesztekben egyformán erősen játszik (a 3. szint itt nem ad mérhető előnyt); mindkettő egyértelműen veri az 1. szintet."]} },

{ id:'chickenfoot', vid:null, play:false, set:'9/12', players:[2,8], tags:['atlas'], icon:[9,9],
  ro:{ name:'Chicken Foot (laba de găină)',
    origin:'Joc de masă cu arbore de piese pornit dintr-un dublu central; folosește seturi mari (double-9 sau double-12).',

    rules:[
      'Set double-9 (55 de piese) sau double-12 (91). Mâini la double-9: 2 jucători 20 de piese, 3 → 14, 4 → 11, 5 → 9, 6 → 7; la double-12: 4 → 18, 5 → 14, 6 → 12 … Restul = „curtea găinilor”.',
      'Prima mână începe cu cel mai mare dublu (9-9), următoarele cu dublul imediat inferior, până la 0-0 (zece mâini la double-9).',
      'Dublul de deschidere se pune transversal și are patru brațe; pe fiecare braț trebuie pusă câte o piesă înainte ca vreunul să primească a doua.',
      'Ori de câte ori se joacă un dublu se strigă „chicken foot”: cele trei capete libere ale lui (degetele) trebuie să primească fiecare câte o piesă înainte de a se juca în altă parte.',
      'Dacă nu poți muta tragi din curte; dacă e goală, pierzi tura. Mâna se termină la domino sau blocaj.',
      'Punctaj: fiecare adună pipurile rămase (0-0 = 50); la un prag mare cel care îl atinge pierde; câștigă cel mai mic total.'],
    approx:['Doar în atlas: aranjamentul în arbore cu trei degete nu este implementat în motor.'] },
  en:{ name:'Chicken Foot',
    origin:'A table game with a tree of tiles grown from a central double; it uses big sets (double-nine or double-twelve).',
    desc:'A central double with four arms; every double played must be "covered" with three tiles (the chicken foot) before play continues elsewhere.',
    rules:[
      'Double-nine (55 tiles) or double-twelve (91) set. Hands with double-nine: 2 players 20 tiles, 3 → 14, 4 → 11, 5 → 9, 6 → 7; with double-twelve: 4 → 18, 5 → 14, 6 → 12 … The rest is the "chicken yard".',
      'The first hand starts with the highest double (9-9), later hands with the next lower double, down to 0-0 (ten hands with double-nine).',
      'The opening double is placed crosswise and has four arms; each arm must receive one tile before any gets a second.',
      'Whenever a double is played "chicken foot" is called: its three free ends (the toes) must each get a tile before play goes elsewhere.',
      'If you cannot play you draw from the yard; if it is empty you miss the turn. A hand ends at domino or a block.',
      'Scoring: everyone counts remaining pips (0-0 = 50); the player who reaches a large total loses; the lowest total wins.'],
    approx:['Atlas only: the three-toe tree layout is not implemented in the engine.'] },
  fr:{"name":"Chicken Foot","origin":"Un jeu de table avec un arbre de dominos qui pousse à partir d’un double central ; il utilise de grands jeux (double-neuf ou double-douze).","desc":"Un double central à quatre branches ; chaque double joué doit être « couvert » par trois dominos (la patte de poulet) avant que le jeu continue ailleurs.","rules":["Jeu double-neuf (55 dominos) ou double-douze (91). Mains avec le double-neuf : 2 joueurs 20 dominos, 3 → 14, 4 → 11, 5 → 9, 6 → 7 ; avec le double-douze : 4 → 18, 5 → 14, 6 → 12 … Le reste forme la « basse-cour ».","La première manche commence par le plus grand double (9-9), les suivantes par le double immédiatement inférieur, jusqu’au 0-0 (dix manches avec le double-neuf).","Le double d’ouverture est posé en travers et possède quatre branches ; chaque branche doit recevoir un domino avant qu’aucune n’en reçoive un second.","Chaque fois qu’un double est joué, on annonce « chicken foot » : ses trois extrémités libres (les orteils) doivent chacune recevoir un domino avant que le jeu aille ailleurs.","Si vous ne pouvez pas jouer, vous piochez dans la basse-cour ; si elle est vide, vous passez votre tour. Une manche se termine au domino ou par un blocage.","Décompte : chacun compte ses points restants (0-0 = 50) ; le joueur qui atteint un gros total perd ; le total le plus bas gagne."],"approx":["Atlas seulement : la disposition en arbre à trois orteils n’est pas implémentée dans le moteur."]},
  it:{"name":"Chicken Foot","origin":"Un gioco da tavolo con un albero di tessere che cresce da un doppio centrale; usa set grandi (doppio nove o doppio dodici).","desc":"Un doppio centrale con quattro bracci; ogni doppio giocato deve essere «coperto» con tre tessere (la zampa di gallina) prima che il gioco continui altrove.","rules":["Set doppio nove (55 tessere) o doppio dodici (91). Mani con il doppio nove: 2 giocatori 20 tessere, 3 → 14, 4 → 11, 5 → 9, 6 → 7; con il doppio dodici: 4 → 18, 5 → 14, 6 → 12 … Il resto è il «pollaio».","La prima mano inizia con il doppio più alto (9-9), le successive con il doppio immediatamente inferiore, fino allo 0-0 (dieci mani con il doppio nove).","Il doppio d’apertura si mette di traverso e ha quattro bracci; ogni braccio deve ricevere una tessera prima che qualcuno ne riceva una seconda.","Ogni volta che si gioca un doppio si dice «chicken foot»: le sue tre estremità libere (le dita) devono ricevere ciascuna una tessera prima che il gioco passi altrove.","Se non puoi giocare peschi dal pollaio; se è vuoto salti il turno. Una mano finisce con il domino o con un blocco.","Punteggio: ognuno conta i punti rimasti (0-0 = 50); chi raggiunge un totale elevato perde; vince il totale più basso."],"approx":["Solo atlante: la disposizione ad albero a tre dita non è implementata nel motore."]},
  es:{"name":"Chicken Foot","origin":"Un juego de mesa con un árbol de fichas que crece a partir de un doble central; usa juegos grandes (doble nueve o doble doce).","desc":"Un doble central con cuatro brazos; cada doble jugado debe «cubrirse» con tres fichas (la pata de gallina) antes de continuar en otro lugar.","rules":["Juego doble nueve (55 fichas) o doble doce (91). Manos con el doble nueve: 2 jugadores 20 fichas, 3 → 14, 4 → 11, 5 → 9, 6 → 7; con el doble doce: 4 → 18, 5 → 14, 6 → 12 … El resto es el «gallinero».","La primera mano empieza con el doble más alto (9-9), las siguientes con el doble inmediatamente inferior, hasta el 0-0 (diez manos con el doble nueve).","El doble de apertura se coloca en cruz y tiene cuatro brazos; cada brazo debe recibir una ficha antes de que ninguno reciba una segunda.","Siempre que se juega un doble se dice «chicken foot»: sus tres extremos libres (los dedos) deben recibir cada uno una ficha antes de que el juego pase a otro lugar.","Si no puedes jugar, robas del gallinero; si está vacío, pierdes el turno. Una mano termina con el dominó o con un bloqueo.","Puntuación: cada uno cuenta los puntos restantes (0-0 = 50); el jugador que llega a un total grande pierde; gana el total más bajo."],"approx":["Solo atlas: la disposición en árbol de tres dedos no está implementada en el motor."]},
  pt:{"name":"Chicken Foot","origin":"Um jogo de mesa com uma árvore de peças que cresce a partir de um duplo central; usa conjuntos grandes (duplo-nove ou duplo-doze).","desc":"Um duplo central com quatro braços; cada duplo jogado tem de ser «coberto» com três peças (a pata de galinha) antes de o jogo continuar noutro lugar.","rules":["Conjunto duplo-nove (55 peças) ou duplo-doze (91). Mãos com o duplo-nove: 2 jogadores 20 peças, 3 → 14, 4 → 11, 5 → 9, 6 → 7; com o duplo-doze: 4 → 18, 5 → 14, 6 → 12 … O resto é o «galinheiro».","A primeira mão começa com o duplo mais alto (9-9), as seguintes com o duplo imediatamente inferior, até ao 0-0 (dez mãos com o duplo-nove).","O duplo de abertura é colocado atravessado e tem quatro braços; cada braço tem de receber uma peça antes de algum receber uma segunda.","Sempre que se joga um duplo diz-se «chicken foot»: as suas três pontas livres (os dedos) têm de receber cada uma uma peça antes de o jogo passar para outro lado.","Se não podes jogar, compras do galinheiro; se estiver vazio, perdes a vez. Uma mão termina com o dominó ou com um bloqueio.","Pontuação: cada um conta os pontos restantes (0-0 = 50); o jogador que chega a um total elevado perde; ganha o total mais baixo."],"approx":["Só atlas: a disposição em árvore de três dedos não está implementada no motor."]},
  de:{"name":"Chicken Foot","origin":"Ein Tischspiel mit einem Baum aus Steinen, der von einem zentralen Pasch aus wächst; es nutzt große Sätze (Doppel-Neun oder Doppel-Zwölf).","desc":"Ein zentraler Pasch mit vier Armen; jeder gelegte Pasch muss mit drei Steinen „bedeckt“ werden (dem Hühnerfuß), bevor woanders weitergespielt wird.","rules":["Doppel-Neun-Satz (55 Steine) oder Doppel-Zwölf-Satz (91). Hände mit Doppel-Neun: 2 Spielende 20 Steine, 3 → 14, 4 → 11, 5 → 9, 6 → 7; mit Doppel-Zwölf: 4 → 18, 5 → 14, 6 → 12 … Der Rest ist der „Hühnerhof“.","Die erste Runde beginnt mit dem höchsten Pasch (9-9), spätere Runden mit dem jeweils nächstniedrigeren, bis zur 0-0 (zehn Runden mit Doppel-Neun).","Der Eröffnungspasch liegt quer und hat vier Arme; jeder Arm muss einen Stein erhalten, bevor einer einen zweiten bekommt.","Wann immer ein Pasch gelegt wird, ruft man „Chicken Foot“: Seine drei freien Enden (die Zehen) müssen jeweils einen Stein erhalten, bevor das Spiel woanders weitergeht.","Wer nicht legen kann, zieht aus dem Hühnerhof; ist er leer, setzt man aus. Eine Runde endet mit Domino oder einer Blockade.","Wertung: Alle zählen ihre Restaugen (0-0 = 50); wer eine hohe Summe erreicht, verliert; die niedrigste Summe gewinnt."],"approx":["Nur Atlas: Die Baumanordnung mit drei Zehen ist im Spielmotor nicht umgesetzt."]},
  hu:{"name":"Chicken Foot","origin":"Asztali játék, amelyben a kövekből egy középső duplából növekvő fa épül; nagy készleteket használ (dupla kilences vagy dupla tizenkettes).","desc":"Egy középső dupla négy ággal; minden kijátszott duplát három kővel „le kell fedni” (a csirkelábbal), mielőtt a játék máshol folytatódik.","rules":["Dupla kilences (55 kő) vagy dupla tizenkettes (91) készlet. Leosztás dupla kilencesnél: 2 játékosnál 20 kő, 3 → 14, 4 → 11, 5 → 9, 6 → 7; dupla tizenkettesnél: 4 → 18, 5 → 14, 6 → 12 … A többi a „tyúkudvar”.","Az első leosztás a legnagyobb duplával (9-9) indul, a következők az egyel kisebbel, egészen a 0-0-ig (dupla kilencesnél tíz leosztás).","A nyitó duplát keresztben tesszük le, és négy ága van; minden ágnak kapnia kell egy követ, mielőtt bármelyik másodikat kapna.","Valahányszor duplát raknak le, azt mondják: „chicken foot”: három szabad végének (az ujjaknak) mindegyikére kell egy kő, mielőtt a játék máshová megy.","Ha nem tudsz lépni, húzol a tyúkudvarból; ha üres, kimaradsz. A leosztás dominóval vagy blokkal ér véget.","Pontozás: mindenki összeszámolja a megmaradt pontjait (0-0 = 50); aki nagy összeget ér el, veszít; a legkisebb összeg nyer."],"approx":["Csak atlasz: a háromujjas fa elrendezés nincs megvalósítva a motorban."]} },

    rules:[

    approx:['Atlas only: Bergen scoring is not implemented in the engine.'] },
  fr:{"name":"Bergen (et Double Bergen)","origin":"Un jeu qui marque pour les extrémités identiques ; le « Double Bergen » a quatre branches à partir d’un domino central.","desc":"Ce qui compte n’est pas la somme des extrémités mais leur égalité : deux extrémités égales = un « double header » (2 points) ; une extrémité égale au double de l’autre extrémité = un « triple header » (3).","rules":["Jeu double-six ; mains : 2 joueurs 6 dominos, 3 joueurs 6, 4 joueurs 5 ; deux dominos du talon sont mis en réserve et jamais piochés.","Le détenteur du plus petit double ouvre (variante : le plus grand). Les doubles sont en travers et ne sont pas des spinners.","Décompte : un coup qui rend les deux extrémités égales = 2 points (aussi le premier double ouvert) ; un coup qui rend une extrémité égale au double de l’autre = 3 points.","Près de l’objectif les points sont réduits (à moins de 2 de l’objectif, vous ne marquez que 1).","Sortir le premier rapporte 2 points ; en cas de blocage, un joueur marque 2 points selon les règles américaines, allemandes ou simples.","Objectif : 15 points à 2 joueurs, 10 à 3–4."],"approx":["Atlas seulement : le décompte Bergen n’est pas implémenté dans le moteur."]},
  it:{"name":"Bergen (e Double Bergen)","origin":"Un gioco che assegna punti per le estremità uguali; il «Double Bergen» ha quattro bracci a partire da una tessera centrale.","desc":"Conta non la somma delle estremità ma la loro uguaglianza: due estremità uguali = un «double header» (2 punti); un’estremità uguale al doppio dell’altra estremità = un «triple header» (3).","rules":["Set doppio sei; mani: 2 giocatori 6 tessere, 3 giocatori 6, 4 giocatori 5; due tessere del monte sono messe da parte e mai pescate.","Apre chi ha il doppio più basso (variante: il più alto). I doppi sono di traverso e non sono spinner.","Punteggio: una giocata che rende uguali le due estremità = 2 punti (anche il primo doppio aperto); una giocata che rende un’estremità uguale al doppio dell’altra = 3 punti.","Vicino all’obiettivo i punti si riducono (a meno di 2 dall’obiettivo si segna solo 1).","Uscire per primi vale 2 punti; in un blocco un giocatore segna 2 punti con le regole americane, tedesche o semplici.","Obiettivo: 15 punti con 2 giocatori, 10 con 3–4."],"approx":["Solo atlante: il punteggio Bergen non è implementato nel motore."]},
  es:{"name":"Bergen (y Double Bergen)","origin":"Un juego que puntúa por los extremos iguales; el «Double Bergen» tiene cuatro brazos a partir de una ficha central.","desc":"Lo que cuenta no es la suma de los extremos sino su igualdad: dos extremos iguales = un «double header» (2 puntos); un extremo igual al doble del otro extremo = un «triple header» (3).","rules":["Juego doble seis; manos: 2 jugadores 6 fichas, 3 jugadores 6, 4 jugadores 5; dos fichas del pozo se reservan y nunca se roban.","Sale quien tiene el doble más bajo (variante: el más alto). Los dobles van en cruz y no son spinners.","Puntuación: una jugada que iguala ambos extremos = 2 puntos (también el primer doble de salida); una jugada que iguala un extremo con el doble del otro = 3 puntos.","Cerca del objetivo los puntos se reducen (a menos de 2 del objetivo solo se anota 1).","Irse el primero vale 2 puntos; en un bloqueo un jugador anota 2 puntos según las reglas americanas, alemanas o simples.","Objetivo: 15 puntos con 2 jugadores, 10 con 3–4."],"approx":["Solo atlas: la puntuación Bergen no está implementada en el motor."]},
  pt:{"name":"Bergen (e Double Bergen)","origin":"Um jogo que pontua pelas pontas iguais; o «Double Bergen» tem quatro braços a partir de uma peça central.","desc":"O que conta não é a soma das pontas mas a sua igualdade: duas pontas iguais = um «double header» (2 pontos); uma ponta igual ao duplo da outra ponta = um «triple header» (3).","rules":["Conjunto duplo-seis; mãos: 2 jogadores 6 peças, 3 jogadores 6, 4 jogadores 5; duas peças do monte ficam reservadas e nunca são compradas.","Abre quem tem o duplo mais baixo (variante: o mais alto). Os duplos ficam atravessados e não são spinners.","Pontuação: uma jogada que torna as duas pontas iguais = 2 pontos (também o primeiro duplo de abertura); uma jogada que torna uma ponta igual ao duplo da outra = 3 pontos.","Perto do objetivo os pontos reduzem-se (a menos de 2 do objetivo marca-se apenas 1).","Sair primeiro vale 2 pontos; num bloqueio um jogador marca 2 pontos pelas regras americanas, alemãs ou simples.","Objetivo: 15 pontos com 2 jogadores, 10 com 3–4."],"approx":["Só atlas: a pontuação Bergen não está implementada no motor."]},
  de:{"name":"Bergen (und Double Bergen)","origin":"Ein Spiel, das für gleiche Enden punktet; „Double Bergen“ hat vier Arme von einem zentralen Stein aus.","desc":"Zählt nicht die Summe der Enden, sondern ihre Gleichheit: Zwei gleiche Enden = ein „Double Header“ (2 Punkte); ein Ende, das dem Pasch am anderen Ende gleicht = ein „Triple Header“ (3).","rules":["Doppel-Sechs-Satz; Hände: 2 Spielende 6 Steine, 3 Spielende 6, 4 Spielende 5; zwei Steine des Vorrats werden zurückgelegt und nie gezogen.","Wer den niedrigsten Pasch hat, eröffnet (Variante: den höchsten). Päsche liegen quer und sind keine Spinner.","Wertung: Ein Zug, der beide Enden gleich macht = 2 Punkte (auch der als Erstes ausgespielte Pasch); ein Zug, der ein Ende dem Pasch am anderen Ende gleich macht = 3 Punkte.","In Zielnähe werden die Punkte reduziert (bei weniger als 2 Punkten Abstand zum Ziel punktet man nur 1).","Als Erste/r fertig zu sein bringt 2 Punkte; bei einer Blockade punktet eine Person 2 Punkte nach amerikanischen, deutschen oder einfachen Regeln.","Ziel: 15 Punkte bei 2 Spielenden, 10 bei 3–4."],"approx":["Nur Atlas: Die Bergen-Wertung ist im Spielmotor nicht umgesetzt."]},
  hu:{"name":"Bergen (és Double Bergen)","origin":"Játék, amely az egyenlő végekért ad pontot; a „Double Bergen”-nek négy ága van egy középső kőből.","desc":"Nem a végek összege számít, hanem az egyenlőségük: két egyenlő vég = „double header” (2 pont); az a vég, amely egyenlő a másik végen álló duplával = „triple header” (3).","rules":["Dupla hatos készlet; leosztás: 2 játékosnál 6 kő, 3 játékosnál 6, 4 játékosnál 5; a kupac két kövét félretesszük, és soha nem húzzuk.","A legkisebb dupla birtokosa kezd (változat: a legnagyobb). A duplák keresztben állnak, és nem spinnerek.","Pontozás: az a lépés, amely a két véget egyenlővé teszi = 2 pont (az elsőnek kijátszott dupla is); az a lépés, amely az egyik véget egyenlővé teszi a másik végen álló duplával = 3 pont.","A cél közelében a pontok csökkennek (a céltól 2-n belül csak 1 pontot kapsz).","Az elsőként kimenő 2 pontot kap; blokk esetén egy játékos 2 pontot kap az amerikai, német vagy egyszerű szabályok szerint.","Cél: 2 játékosnál 15 pont, 3–4 játékosnál 10."],"approx":["Csak atlasz: a Bergen-pontozás nincs megvalósítva a motorban."]} },

  it:{"name":"Five Up (domino della costa occidentale)","origin":"Dalla famiglia Fives and Threes: come All Fives, ma OGNI doppio è uno spinner.","desc":"Si segnano i multipli di 5 delle estremità aperte, e ogni doppio apre nuovi bracci.","rules":["La famiglia Fives: dopo ogni tessera si sommano le estremità aperte; i multipli di 5 fanno punti.","La differenza rispetto ad All Fives e Sniff: ogni doppio giocato è uno spinner (in All Fives e Sniff solo il primo).","Per non inventare regole: i dettagli (mani, obiettivi) non sono verificati nell’app."],"approx":["Solo atlante: la scheda si basa sulla descrizione della famiglia nella fonte; le regole complete non sono state verificate e non sono implementate."]},
  es:{"name":"Five Up (dominó de la costa oeste)","origin":"De la familia Fives and Threes: como All Fives, pero CADA doble es un spinner.","desc":"Se puntúan los múltiplos de 5 de los extremos abiertos, y cada doble abre nuevos brazos.","rules":["La familia Fives: tras cada ficha se suman los extremos abiertos; los múltiplos de 5 puntúan.","La diferencia con All Fives y Sniff: cualquier doble jugado es un spinner (en All Fives y Sniff solo el primero).","Para no inventar reglas: los detalles (manos, objetivos) no están verificados en la aplicación."],"approx":["Solo atlas: la ficha se basa en la descripción de la familia en la fuente; las reglas completas no se verificaron y no están implementadas."]},
  pt:{"name":"Five Up (dominó da costa oeste)","origin":"Da família Fives and Threes: como o All Fives, mas CADA duplo é um spinner.","desc":"Pontuam-se os múltiplos de 5 das pontas abertas, e cada duplo abre novos braços.","rules":["A família Fives: depois de cada peça somam-se as pontas abertas; os múltiplos de 5 pontuam.","A diferença para o All Fives e o Sniff: qualquer duplo jogado é um spinner (no All Fives e no Sniff só o primeiro).","Para não inventar regras: os detalhes (mãos, objetivos) não estão verificados na aplicação."],"approx":["Só atlas: a ficha baseia-se na descrição da família na fonte; as regras completas não foram verificadas e não estão implementadas."]},
  de:{"name":"Five Up (Domino der Westküste)","origin":"Aus der Familie Fives and Threes: wie All Fives, aber JEDER Pasch ist ein Spinner.","desc":"Man punktet Vielfache von 5 aus den offenen Enden, und jeder Pasch öffnet neue Arme.","rules":["Die Fives-Familie: Nach jedem Stein werden die offenen Enden addiert; Vielfache von 5 punkten.","Der Unterschied zu All Fives und Sniff: Jeder gelegte Pasch ist ein Spinner (bei All Fives und Sniff nur der erste).","Um keine Regeln zu erfinden: Die Einzelheiten (Hände, Ziele) sind in der App nicht überprüft."],"approx":["Nur Atlas: Der Eintrag stützt sich auf die Familienbeschreibung in der Quelle; die vollständigen Regeln wurden nicht überprüft und sind nicht umgesetzt."]},
  hu:{"name":"Five Up (nyugati parti dominó)","origin":"A Fives and Threes családból: mint az All Fives, de MINDEN dupla spinner.","desc":"A nyitott végek 5-ös többszöröseiért pontot kapsz, és minden dupla új ágakat nyit.","rules":["A Fives család: minden kő után összeadjuk a nyitott végeket; az 5 többszörösei pontot érnek.","A különbség az All Fives-hoz és a Sniffhez képest: minden kijátszott dupla spinner (az All Fives-ban és a Sniffben csak az első).","Hogy ne találjunk ki szabályokat: a részletek (leosztás, célok) nincsenek ellenőrizve az alkalmazásban."],"approx":["Csak atlasz: a lap a forrás családleírására épül; a teljes szabályokat nem ellenőriztük, és nincsenek megvalósítva."]} },

{ id:'allthrees', vid:null, play:false, set:'6', players:[2,4], tags:['atlas','score'], icon:[3,3],

    desc:'When the sum of the ends is a multiple of 3 you get 1 point, plus 1 point for going out.',

      'Like Muggins (a single line, drawing from the boneyard), but you only score when the sum of the ends is a multiple of 3.',

    approx:['Atlas only: not implemented separately (for mixed scoring see Fives and Threes).'] },
  fr:{"name":"All Threes (multiples de 3)","origin":"Une variante de Muggins où seuls les multiples de 3 comptent.","desc":"Quand la somme des extrémités est un multiple de 3, on obtient 1 point, plus 1 point pour la sortie.","rules":["Comme Muggins (une seule ligne, pioche dans le talon), mais on ne marque que lorsque la somme des extrémités est un multiple de 3.","Chaque total de ce genre vaut 1 point ; sortir avec son dernier domino en donne 1 de plus.","Fives and Threes (jouable ici) combine les multiples de 3 et de 5."],"approx":["Atlas seulement : non implémenté séparément (pour un décompte mixte, voir Fives and Threes)."]},
  it:{"name":"All Threes (multipli di 3)","origin":"Una variante di Muggins in cui contano solo i multipli di 3.","desc":"Quando la somma delle estremità è un multiplo di 3 si ottiene 1 punto, più 1 punto per l’uscita.","rules":["Come Muggins (una sola linea, pesca dal monte), ma si segna solo quando la somma delle estremità è un multiplo di 3.","Ogni totale di questo tipo vale 1 punto; uscire con l’ultima tessera ne dà 1 in più.","Fives and Threes (giocabile qui) combina i multipli di 3 e di 5."],"approx":["Solo atlante: non implementato separatamente (per il punteggio misto vedi Fives and Threes)."]},
  es:{"name":"All Threes (múltiplos de 3)","origin":"Una variante de Muggins en la que solo cuentan los múltiplos de 3.","desc":"Cuando la suma de los extremos es múltiplo de 3 se obtiene 1 punto, más 1 punto por irse.","rules":["Como Muggins (una sola línea, robo del pozo), pero solo se puntúa cuando la suma de los extremos es múltiplo de 3.","Cada total así vale 1 punto; irse con la última ficha da 1 más.","Fives and Threes (jugable aquí) combina los múltiplos de 3 y de 5."],"approx":["Solo atlas: no está implementado por separado (para la puntuación mixta, véase Fives and Threes)."]},
  pt:{"name":"All Threes (múltiplos de 3)","origin":"Uma variante do Muggins em que só contam os múltiplos de 3.","desc":"Quando a soma das pontas é múltiplo de 3 ganha-se 1 ponto, mais 1 ponto por sair.","rules":["Como o Muggins (uma só linha, compra do monte), mas só se pontua quando a soma das pontas é múltiplo de 3.","Cada total assim vale 1 ponto; sair com a última peça dá mais 1.","O Fives and Threes (jogável aqui) combina os múltiplos de 3 e de 5."],"approx":["Só atlas: não está implementado em separado (para a pontuação mista veja-se Fives and Threes)."]},
  de:{"name":"All Threes (Vielfache von 3)","origin":"Eine Muggins-Variante, bei der nur Vielfache von 3 zählen.","desc":"Ist die Summe der Enden ein Vielfaches von 3, erhält man 1 Punkt, plus 1 Punkt fürs Ausspielen.","rules":["Wie Muggins (eine einzige Reihe, Nachziehen vom Vorrat), aber man punktet nur, wenn die Summe der Enden ein Vielfaches von 3 ist.","Jede solche Summe ist 1 Punkt wert; das Ausspielen mit dem letzten Stein gibt 1 weiteren.","Fives and Threes (hier spielbar) verbindet Vielfache von 3 und 5."],"approx":["Nur Atlas: nicht separat umgesetzt (für gemischte Wertung siehe Fives and Threes)."]},
  hu:{"name":"All Threes (3 többszörösei)","origin":"A Muggins változata, amelyben csak a 3 többszörösei számítanak.","desc":"Ha a végek összege 3 többszöröse, 1 pontot kapsz, plusz 1 pontot a kimenésért.","rules":["Mint a Muggins (egyetlen sor, húzás a kupacból), de csak akkor pontozunk, ha a végek összege 3 többszöröse.","Minden ilyen összeg 1 pontot ér; az utolsó kővel való kimenés még 1-et ad.","A Fives and Threes (itt játszható) a 3 és az 5 többszöröseit egyesíti."],"approx":["Csak atlasz: külön nincs megvalósítva (a vegyes pontozáshoz lásd a Fives and Threes-t)."]} },

{ id:'latinreg', vid:null, play:false, set:'6', players:[4,4], tags:['atlas','team','latin'], icon:[0,0],
  ro:{ name:'Variante latine regionale (Quinientos, Milo, Sudan)',
    origin:'Dominoul în perechi are numeroase variante locale: puncte țintă, bonusuri și reguli de blocaj diferite.',
    desc:'Ce se schimbă de la o țară la alta: ținta, cine încasează și bonusurile pentru încheieri speciale.',
    rules:[
      'Mexic, Columbia, Venezuela: ținta 100, câștigătorii iau doar piesele adversarilor; 6-6 deschide prima mână. În varianta columbiană, la blocaj egal câștigă echipa care a blocat.',
      'FID (federația) și Puerto Rico „Doscientos”: ținta 200, câștigătorii iau toate piesele rămase.',
      'Quinientos (Puerto Rico): ținta 500; „capicú” (ultima piesă nu e dublu și se potrivește la ambele capete) dă 100 de puncte bonus; „chuchazo” (câștigi jucând dubla-albă, „chucha”, când ea era singura ta piesă rămasă) dă 100 de puncte bonus; „dominao” (ieșire cu un dublu care se putea juca la ambele capete) nu dă bonus; primele patru partide ale unui meci au bonus de 100/75/50/25 de puncte (nu se dă dacă partida s-a blocat).',
      'Milo (Africa și părți din Indonezia): domino = 1 punct, blocaj = 1 punct echipei cu mai puține pipuri, „milo” (ambele capete ale liniei cu aceeași valoare) = 2 puncte; partida se joacă la 5.',
      'Sudan: ținta 51. Varianta cu dubla-albă = 50 se joacă la 101.',
      'Unele versiuni permit refacerea mâinii dacă un jucător are 5 sau mai multe dubluri.'],
    approx:['Doar în atlas (cu excepția variantelor în stil Venezuela și FID/Doscientos, jucabile separat).'] },
  en:{ name:'Regional Latin versions (Quinientos, Milo, Sudan)',
    origin:'Partnership dominoes has many local versions: different targets, bonuses and block rules.',
    desc:'What changes from country to country: the target, who scores, and the bonuses for special finishes.',
    rules:[
      'Mexico, Colombia, Venezuela: target 100, winners take only the opponents\' tiles; 6-6 leads the first hand. In the Colombian version a tied block goes to the blocking team.',
      'FID (the federation) and Puerto Rican "Doscientos": target 200, winners take all the remaining tiles.',
      'Quinientos (Puerto Rico): target 500; "capicú" (the last tile is not a double and fits both ends) is a 100-point bonus; "chuchazo" (winning by playing the double blank, the "chucha", when it was your only tile left) is a 100-point bonus; "dominao" (going out with a double that could be played at either end) scores no bonus; the first four games of a match carry a 100/75/50/25-point bonus (not scored if the game was blocked).',
      'Milo (Africa and parts of Indonesia): a domino = 1 point, a block = 1 point for the team with fewer pips, a "milo" (both ends of the line showing the same number) = 2 points; a game is 5 points.',
      'Sudan: target 51. The variant that scores the double blank as 50 plays to 101.',
      'Some versions allow a redeal when a player holds five or more doubles.'],
    approx:['Atlas only (except the Venezuelan-style and FID/Doscientos-style versions, playable separately).'] },
  fr:{"name":"Versions latines régionales (Quinientos, Milo, Sudan)","origin":"Le domino en équipes a de nombreuses versions locales : objectifs, bonus et règles de blocage différents.","desc":"Ce qui change d’un pays à l’autre : l’objectif, qui marque, et les bonus pour les sorties spéciales.","rules":["Mexique, Colombie, Venezuela : objectif 100, les gagnants ne prennent que les dominos des adversaires ; le 6-6 ouvre la première manche. Dans la version colombienne, un blocage à égalité revient à l’équipe qui a bloqué.","FID (la fédération) et « Doscientos » portoricain : objectif 200, les gagnants prennent tous les dominos restants.","Quinientos (Porto Rico) : objectif 500 ; le « capicú » (le dernier domino n’est pas un double et s’accorde aux deux extrémités) est un bonus de 100 points ; le « chuchazo » (gagner en jouant le double blanc, la « chucha », quand c’était votre seul domino restant) est un bonus de 100 points ; le « dominao » (sortir avec un double jouable aux deux extrémités) ne donne aucun bonus ; les quatre premières parties d’un match portent un bonus de 100/75/50/25 points (non marqué si la partie a été bloquée).","Milo (Afrique et certaines régions d’Indonésie) : un domino = 1 point, un blocage = 1 point pour l’équipe qui a le moins de points, un « milo » (les deux extrémités de la ligne montrant le même nombre) = 2 points ; une partie vaut 5 points.","Soudan : objectif 51. La variante qui compte le double blanc pour 50 se joue à 101.","Certaines versions autorisent une nouvelle donne quand un joueur détient cinq doubles ou plus."],"approx":["Atlas seulement (sauf les versions de style vénézuélien et de style FID/Doscientos, jouables séparément)."]},

/* ---------- pornire / oprire ---------- */
function startMatch(vid, setup){

// A match in progress is lost on reload/close: ask the browser to confirm (only after the first move, never after game over)

function pushLog(s){ if(!G) return; G.log.push(s); if(G.log.length > 60) G.log.shift(); }
function setStatus(s, mine){ if(!G) return; G.msg = s; G.msgMine = !!mine; var n = $('status'); n.textContent = s; n.className = 'status' + (mine ? ' me' : ''); }

function describe(evs){
  var st = G.st, S = st.S;
  evs.forEach(function(e){
    if(e.k === 'play'){
      var nm = pname(e.p), tn = X.tileName(S, e.tile), where;
      if(st.fam === 'train') where = trainLabel(st, e.tr, e.p); else where = whereLabel(e.arm);
      var s = t('log.play', { name:nm, tile:tn, where:where });
      if(e.pts) s += ' ' + t('log.pts', { n:e.pts });
      if(e.voided) s += ' ' + t('log.void');
      if(e.chip) s += ' ' + t('log.chip');
      pushLog(s); G.lastTile = e.tile;
      if(e.dbl && st.fam === 'train') pushLog(t('log.dbl', { name:nm }));
    } else if(e.k === 'draw'){ pushLog(e.p === 0 ? t('log.drawYou', { tile: X.tileName(S, e.tile) }) : t('log.draw', { name:pname(e.p) })); }
    else if(e.k === 'pass'){ pushLog(t(st.fam === 'train' ? 'log.passMark' : 'log.pass', { name:pname(e.p) })); }
    else if(e.k === 'end'){ pushLog(t('log.endTurn', { name:pname(e.p) })); }
  });
}

/* ---------- actiuni ---------- */
/* copie profunda a starii de joc; setul de piese (S, cu functii) si configuratia (cfg) raman partajate */
function cloneVal(v){
  if(v === null || typeof v !== 'object') return v;
  var o, k;
  if(ArrayBuffer.isView(v)) return v.slice();
  if(Array.isArray(v)){ o = new Array(v.length); for(k = 0; k < v.length; k++) o[k] = cloneVal(v[k]); return o; }
  o = {}; for(k in v) if(Object.prototype.hasOwnProperty.call(v, k)) o[k] = cloneVal(v[k]);
  return o;
}
function cloneState(st){
  var o = {}, k;
  for(k in st) if(Object.prototype.hasOwnProperty.call(st, k)) o[k] = (k === 'S' || k === 'cfg') ? st[k] : cloneVal(st[k]);
  return o;
}
function doUndo(){
  if(!G || !G.undo || !G.undo.length || G.st.phase !== 'play') return;
  var sn = G.undo.pop();
  stopTimers();
  G.st = sn.st; G.log = sn.log; G.prevActor = sn.prevActor; G.lastTile = sn.lastTile; G.sel = null; G.hint = null;
  G.usedUndo = true;
  pushLog(t('log.undo'));
  renderAll();
  statusForTurn();
  scheduleNext();
}
function applyAction(a){
  var st = G.st, who = st.turn;
  var evs;
  if(who === 0){
    /* instantaneu inainte de mutarea ta, pentru „Anuleaza mutarea" (maximum 40) */
    G.undo = G.undo || [];
    G.undo.push({ st: cloneState(st), log: G.log.slice(), prevActor: G.prevActor, lastTile: G.lastTile });
    if(G.undo.length > 40) G.undo.shift();
  }
  try { evs = D.act(st, a, G.rng); } catch(err){ if(who === 0 && G.undo) G.undo.pop(); setStatus(t('g.error'), false); return false; }
  G.sel = null; G.hint = null; G.prevActor = who;
  describe(evs);
  renderAll();
  var over = st.phase !== 'play';
  var drawn = evs.find(function(e){ return e.k === 'draw'; });
  if(over) { G.overTimer = setTimeout(showOver, X.reduceMotion ? 200 : 750); }
  else { statusForTurn(drawn); scheduleNext(); }
  return true;
}
function statusForTurn(drawnEv){
  var st = G.st, p = st.turn;
  if(p === 0){
    var acts = D.legalActions(st), plays = acts.filter(function(a){ return a.t === 'play'; });
    var s;
    if(plays.length) {
      s = t(st.fam === 'train' && st.status === 'first' ? 'g.firstTurn' : 'g.yourTurn');
      if(st.fam === 'train' && st.cur.needExtra) s = t('g.needExtra');
      if(st.fam === 'train'){ var bh = D.bindHead(st); if(bh) s = t('g.mustSatisfy', { train: trainLabel(st, bh.tr, 0) }); }
      if(st.fam === 'line' && st.board.first === null && st.mustLead !== null) s = t('g.mustLead', { tile: X.tileName(st.S, st.mustLead) });
    }
    else if(acts.some(function(a){ return a.t === 'draw'; })) s = t('g.mustDraw');
    else if(acts.some(function(a){ return a.t === 'pass'; })) s = t(st.fam === 'train' ? 'g.mustPassMark' : 'g.mustPass');
    else s = t('g.yourTurn');
    setStatus(s, true);
  } else setStatus(t('g.thinking', { name: pname(p) }), false);
}

function scheduleNext(){
  if(!G) return;
  clearTimeout(G.timer);
  var st = G.st;
  if(st.phase !== 'play') return;
  var p = st.turn;
  var chain = G.prevActor === p;
  var delay = X.reduceMotion ? 90 : (chain ? 300 : 650);
  if(p !== 0){
    statusForTurn();
    G.timer = setTimeout(function(){
      if(!G || G.st !== st || st.phase !== 'play' || st.turn !== p) return;
      var v = D.view(st, p), a = null;
      try { a = D.aiAction(v, G.level, G.aiRng); } catch(err){ a = null; }
      /* plasa de siguranta: daca AI-ul ar da o actiune ilegala sau ar esua, joaca prima mutare legala (jocul nu se blocheaza) */
      if(!a || !applyAction(a)){ var Lg = D.legalActions(st); if(Lg.length) applyAction(Lg[0]); }
    }, delay);
    return;
  }
  statusForTurn();
  var acts = D.legalActions(st);
  if(prefs.auto && acts.length === 1 && acts[0].t !== 'play' && acts[0].t !== 'end'){
    var only = acts[0];
    G.timer = setTimeout(function(){
      if(!G || G.st !== st || st.phase !== 'play' || st.turn !== 0) return;
      applyAction(only);
    }, X.reduceMotion ? 200 : 1100);
  }
  if(acts.length === 1 && acts[0].t === 'end'){
    G.timer = setTimeout(function(){ if(G && G.st === st && st.turn === 0 && st.phase === 'play') applyAction({t:'end'}); }, 200);
  }
}

function humanPlays(){ return D.legalActions(G.st).filter(function(a){ return a.t === 'play'; }); }
function onTile(tile){
  if(!isHuman()) return;
  var plays = humanPlays().filter(function(a){ return a.tile === tile; });
  if(!plays.length){ setStatus(t('g.cantPlay', { tile: X.tileName(G.st.S, tile) }), true); return; }
  if(plays.length === 1){ applyAction(plays[0]); return; }
  G.sel = G.sel === tile ? null : tile;
  G.hint = null;
  refreshSel();
  if(G.sel !== null) setStatus(t('g.chooseDest', { tile: X.tileName(G.st.S, tile) }), true);
}
function onDest(a){ if(isHuman()) applyAction(a); }
function onEndHint(arm){
  if(!isHuman() || G.sel === null) { if(isHuman()) setStatus(t('g.pickFirst'), true); return; }
  var c = humanPlays().filter(function(a){ return a.tile === G.sel && (G.st.fam === 'train' ? a.tr === arm : a.arm === arm); });
  if(c.length === 1) applyAction(c[0]);
  else if(c.length > 1) setStatus(t('g.pickOrient'), true);
}
function doDraw(){ if(isHuman() && D.legalActions(G.st).some(function(a){ return a.t === 'draw'; })) applyAction({t:'draw'}); }
function doPass(){ if(isHuman() && D.legalActions(G.st).some(function(a){ return a.t === 'pass'; })) applyAction({t:'pass'}); }

function doHint(){
  if(!isHuman()) return;

    var where = st.fam === 'train' ? trainLabel(st, h.tr, 0) : whereLabel(h.arm);

  } else setStatus(t(h.t === 'draw' ? 'g.mustDraw' : (h.t === 'end' ? 'g.hintEnd' : 'g.mustPass')), true);

}

/* ---------- randare ---------- */
/* focus: mana/destinatiile/actiunile se redesenează la fiecare mutare; fara asta, tastatura pierde focusul (document.body) */
function focusSnapshot(){

  if($('dests').contains(ae) || $('actions').contains(ae)) return { tile: null, id: ae.id || null };

function focusRestore(snap){

  if(snap.tile !== null && snap.tile !== undefined) el = hand.querySelector('[data-tile="' + snap.tile + '"]');
  if(!el && snap.id) el = document.getElementById(snap.id);

function renderHeader(){

    parts.push(t('g.score') + ' — ' + sc.join(' · ') + ' · ' + t('g.target') + ' ' + st.target + (cfg.exact ? ' (' + t('g.exact') + ')' : ''));
  }
  if(st.fam === 'line' && st.boneyard !== undefined && st.cfg.draw) parts.push(t('g.boneyard') + ': ' + st.boneyard.length + (st.cfg.draw.reserve ? ' (' + t('g.reserve', { n:st.cfg.draw.reserve }) + ')' : ''));

function boardCols(){
  var w = $('boardWrap').clientWidth - 20;
  if(w < 200) w = 340;
  var cols = Math.floor(w / 36) - 2;
  if(cols < 8) cols = 8; if(cols > 26) cols = 26;
  return { cols: cols - (cols % 2), w: w };
}
function renderBoard(){
  var st = G.st, S = st.S, root = $('boardSvgHost');
  var bc = boardCols(), cols = bc.cols;
  var unit = bc.w / (cols + 2), pxhc = unit / 2 * G.zoom;
  var human = isHuman(), selTile = G.sel, hint = G.hint;
  var plays = human ? humanPlays() : [];
  var parts = [], vb, i;
  var okArms = {};
  var focusTile = null;
  if(human){
    plays.forEach(function(a){
      var key = st.fam === 'train' ? a.tr : a.arm;
      if(selTile !== null ? a.tile === selTile : false) okArms[key] = true;
      if(hint && hint.t === 'play' && hint.tile === a.tile && (st.fam === 'train' ? hint.tr === a.tr : hint.arm === a.arm)) okArms[key] = true;
    });
  }
  var sr = '';
  if(st.fam === 'line'){
    var L = D.layoutLine(S, st.board, cols);
    if(!st.board.first){
      root.innerHTML = '';
      var emp = el('div', 'boardempty', human ? t('g.emptyYou') : t('g.emptyAi')); root.appendChild(emp);
      $('boardSr').textContent = t('aria.boardEmpty');
      return;
    }
    var bb = L.bbox, pad = 2;
    vb = [bb.x0 - pad, bb.y0 - pad, bb.x1 - bb.x0 + 2 * pad, bb.y1 - bb.y0 + 2 * pad];
    L.items.forEach(function(it){
      var r = it.rect, v1, v2;
      if(it.first){ v1 = it.a; v2 = it.b; }
      else if(r.kind === 'dbl'){ v1 = v2 = it.outV; }
      else if(r.orient === 'H'){ if(r.inSide === 'L'){ v1 = it.inV; v2 = it.outV; } else { v1 = it.outV; v2 = it.inV; } }
      else { if(r.inSide === 'T'){ v1 = it.inV; v2 = it.outV; } else { v1 = it.outV; v2 = it.inV; } }
      if(it.first && r.kind === 'dbl'){ v1 = v2 = it.a; }
      parts.push(X.tileMarkup(r, v1, v2, it.tile === G.lastTile ? 't-last' : ''));
    });
    L.bands.forEach(function(b){

      parts.push('<text class="bandlabel" x="' + (b.ghost.x + 2.6) + '" y="' + (b.ghost.y - 0.6) + '">' + X.esc(t(b.arm === 'U' ? 'board.armUp' : 'board.armDown')) + '</text>');
    });

    });
    sr = L.ends.map(function(e){ return whereLabel(e.arm) + ' ' + e.v; }).join(', ');
    sr = t('aria.board', { n: st.played.length, ends: sr });
    if(G.lastTile >= 0){ for(i = 0; i < L.items.length; i++) if(L.items[i].tile === G.lastTile) focusTile = L.items[i].rect; }
  } else {
    var LT = D.layoutTrains(st, cols);
    var bb2 = LT.bbox, pad2 = 2;
    vb = [bb2.x0 - pad2, bb2.y0 - pad2, bb2.x1 - bb2.x0 + 2 * pad2, bb2.y1 - bb2.y0 + 2 * pad2];
    LT.bands.forEach(function(b){

      parts.push('<text class="bandlabel' + (b.tr === 0 ? ' me' : '') + '" x="0.2" y="' + (b.labelY + 2.4) + '">' + X.esc(label) + '</text>');
      if(b.tr < st.np && st.trains[b.tr].marker) parts.push('<circle class="markerdot" cx="' + (label.length * 0.62 + 1.2) + '" cy="' + (b.labelY + 1.9) + '" r=".55"/>');
      parts.push('<g class="ghosttile">' + X.tileMarkup(b.ghost, st.hubV, st.hubV) + '</g>');
    });
    LT.items.forEach(function(it){
      var r = it.rect, v1, v2;
      if(r.kind === 'dbl'){ v1 = v2 = it.outV; }
      else if(r.orient === 'H'){ if(r.inSide === 'L'){ v1 = it.inV; v2 = it.outV; } else { v1 = it.outV; v2 = it.inV; } }
      else { if(r.inSide === 'T'){ v1 = it.inV; v2 = it.outV; } else { v1 = it.outV; v2 = it.inV; } }
      parts.push(X.tileMarkup(r, v1, v2, it.tile === G.lastTile ? 't-last' : ''));

    LT.bands.forEach(function(b){

      parts.push('<g class="endhint' + (ok ? ' ok' : '') + '" data-arm="' + b.tr + '"' + (ok ? ' tabindex="0" role="button"' : '') + ' aria-label="' + X.esc(name + ': ' + b.endV) + '"><rect x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="' + r.h + '" rx=".26"/><text x="' + (r.x + r.w / 2) + '" y="' + (r.y + r.h / 2) + '">' + b.endV + '</text></g>');
    });
    var tcount = 0; st.trains.forEach(function(x){ tcount += x.tiles.length; }); tcount += st.mex.length;
    sr = t('aria.trains', { n: tcount, ends: LT.bands.map(function(b){ return (b.tr === st.np ? t('w.mex') : pname(b.tr)) + ' ' + b.endV; }).join(', ') });
  }
  var wpx = Math.max(1, Math.round(vb[2] * pxhc)), hpx = Math.max(1, Math.round(vb[3] * pxhc));
  var host = '<svg xmlns="http://www.w3.org/2000/svg" role="group" aria-label="' + X.esc(sr) + '" width="' + wpx + '" height="' + hpx + '" viewBox="' + vb.join(' ') + '" id="boardSvg">' + parts.join('') + '</svg>';
  root.innerHTML = host;
  $('boardSr').textContent = sr;
  Array.prototype.forEach.call(root.querySelectorAll('.endhint.ok'), function(g){
    var arm = g.getAttribute('data-arm');
    var key = st.fam === 'train' ? parseInt(arm, 10) : arm;
    g.addEventListener('click', function(){ onEndHint(key); });
    g.addEventListener('keydown', function(ev){ if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); onEndHint(key); } });
  });
  /* deruleaza spre ultima piesa pusa */
  if(focusTile){
    var wrap = $('boardWrap');
    var cx = (focusTile.x + focusTile.w / 2 - vb[0]) * pxhc + 10, cy = (focusTile.y + focusTile.h / 2 - vb[1]) * pxhc + 10;
    var offX = Math.max(0, (wrap.clientWidth - 20 - wpx) / 2);

    try { wrap.scrollTo({ left: tx, top: ty, behavior: 'auto' }); } catch(e){ wrap.scrollLeft = tx; wrap.scrollTop = ty; }
  }
}
