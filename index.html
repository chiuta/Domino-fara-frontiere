  it:{"name":"All Fives (Fives, con spinner)","origin":"La famiglia «Fives»: si segna quando la somma delle estremità aperte è un multiplo di cinque. La forma con spinner è quella dei tornei nordamericani.","desc":"Dopo ogni tessera si sommano le estremità aperte; se il totale è un multiplo di 5 lo si segna subito. Il primo doppio giocato diventa spinner e apre quattro bracci.","rules":["Set doppio sei. Mani: 2 giocatori 9 tessere, 3 giocatori 7, 4 giocatori 5 (in quattro si gioca di solito a coppie: qui puoi scegliere 2 squadre da 2, il compagno di fronte). Il resto è il monte.","Apre chi ha il doppio più alto, con qualsiasi tessera (invece del sorteggio). In seguito apre chi è uscito per ultimo nella mano precedente; dopo un blocco, a sorte.","Dopo ogni tessera si sommano le estremità aperte. Se il totale è un multiplo di 5 (5–35) il giocatore lo segna subito. Un doppio all’estremità di un braccio conta entrambe le metà (5-5 = 10, 6-6 = 12).","Il primo doppio giocato (ovunque) è lo SPINNER: le prime due tessere si mettono sui suoi due lati; solo allora i bracci 3 e 4 possono partire dalle sue estremità. Finché lo spinner non ha tessere su entrambi i lati conta il doppio del suo valore; poi non conta più, contano solo le estremità reali dei bracci.","Se non puoi giocare peschi finché non ottieni una tessera che si adatta (giocata subito) o il monte è vuoto; allora passi. Non puoi pescare se hai una tessera giocabile.","Fine mano: chi esce segna i punti rimasti nelle mani degli avversari, arrotondati al multiplo di 5 più vicino (3 → 5, 2 → 0). In un blocco il giocatore o la squadra con meno punti vince e segna quelli degli altri, arrotondati; in caso di parità non segna nessuno con 2 o 4 giocatori; con 3 giocatori due pari al minimo si dividono i punti del terzo.","Obiettivo: 250 punti con 2 giocatori, 200 con 3–4; la partita finisce nel momento in cui qualcuno lo raggiunge."],"approx":["La fonte non dice esplicitamente se i bracci 3 e 4 possano partire prima che entrambi i lati dello spinner siano coperti; si applica l’usanza americana abituale (solo dopo entrambi i lati).","L’arrotondamento a 5 si fa sul totale dei punti degli avversari (non tessera per tessera).","Divisione in caso di parità con 3 giocatori: ciascuno riceve la metà, arrotondata per difetto."]},
  es:{"name":"All Fives (Fives, con spinner)","origin":"La familia «Fives»: se puntúa cuando la suma de los extremos abiertos es múltiplo de cinco. La forma con spinner es la de los torneos norteamericanos.","desc":"Tras cada ficha se suman los extremos abiertos; si el total es múltiplo de 5 se anota al instante. El primer doble jugado se convierte en spinner y abre cuatro brazos.","rules":["Juego doble seis. Manos: 2 jugadores 9 fichas, 3 jugadores 7, 4 jugadores 5 (a cuatro suele jugarse por parejas: aquí puedes elegir 2 equipos de 2, con el compañero enfrente). El resto es el pozo.","Sale quien tenga el doble más alto, con cualquier ficha (en lugar del sorteo). Después sale quien terminó la mano anterior; tras un bloqueo, se sortea.","Tras cada ficha se suman los extremos abiertos de la mesa. Si el total es múltiplo de 5 (5–35), el jugador lo anota al instante. Un doble en el extremo de un brazo cuenta ambas mitades (5-5 = 10, 6-6 = 12).","El primer doble jugado (donde sea) es el SPINNER: las dos primeras fichas se colocan contra sus dos lados; solo entonces pueden salir los brazos 3 y 4 desde sus extremos. Mientras el spinner no tenga fichas en ambos lados cuenta el doble de su valor; después ya no cuenta, solo los extremos reales de los brazos.","Si no puedes jugar, robas hasta conseguir una ficha que encaje (se juega al instante) o hasta que el pozo se vacíe; entonces pasas. No puedes robar si tienes una ficha jugable.","Fin de la mano: quien se va anota los puntos que quedan en las manos de los contrarios, redondeados al múltiplo de 5 más cercano (3 → 5, 2 → 0). En un bloqueo gana el jugador o equipo con menos puntos y anota los de los demás, redondeados; con empate no puntúa nadie con 2 o 4 jugadores; con 3 jugadores, dos empatados en el mínimo se reparten los puntos del tercero.","Objetivo: 250 puntos con 2 jugadores, 200 con 3–4; la partida termina en cuanto alguien lo alcanza."],"approx":["La fuente no dice explícitamente si los brazos 3 y 4 pueden empezar antes de cubrir ambos lados del spinner; se aplica la convención estadounidense habitual (solo después de ambos lados).","El redondeo a 5 se hace sobre el total de puntos de los contrarios (no ficha por ficha).","Reparto en caso de empate con 3 jugadores: cada uno recibe la mitad, redondeada hacia abajo."]},
  pt:{"name":"All Fives (Fives, com spinner)","origin":"A família «Fives»: pontua-se quando a soma das pontas abertas é múltiplo de cinco. A forma com spinner é a dos torneios norte-americanos.","desc":"Depois de cada peça somam-se as pontas abertas; se o total for múltiplo de 5, marca-se de imediato. O primeiro duplo jogado torna-se spinner e abre quatro braços.","rules":["Conjunto duplo-seis. Mãos: 2 jogadores 9 peças, 3 jogadores 7, 4 jogadores 5 (a quatro costuma jogar-se em pares: aqui podes escolher 2 equipas de 2, com o parceiro em frente). O resto é o monte.","Abre quem tem o duplo mais alto, com qualquer peça (em vez do sorteio). Depois abre quem saiu por último na mão anterior; após um bloqueio, sorteia-se.","Depois de cada peça somam-se as pontas abertas da mesa. Se o total for múltiplo de 5 (5–35), o jogador marca-o de imediato. Um duplo na ponta de um braço conta as duas metades (5-5 = 10, 6-6 = 12).","O primeiro duplo jogado (em qualquer lugar) é o SPINNER: as duas primeiras peças colocam-se contra os seus dois lados; só então os braços 3 e 4 podem partir das suas pontas. Enquanto o spinner não tiver peças nos dois lados, conta o dobro do seu valor; depois já não conta, apenas as pontas reais dos braços.","Se não podes jogar, compras até obteres uma peça que sirva (jogada de imediato) ou até o monte se esgotar; então passas. Não podes comprar se tens uma peça jogável.","Fim da mão: quem sai marca os pontos que restam nas mãos dos adversários, arredondados ao múltiplo de 5 mais próximo (3 → 5, 2 → 0). Num bloqueio ganha o jogador ou equipa com menos pontos e marca os dos outros, arredondados; em caso de empate ninguém marca com 2 ou 4 jogadores; com 3 jogadores, dois empatados no mínimo repartem os pontos do terceiro.","Objetivo: 250 pontos com 2 jogadores, 200 com 3–4; o jogo termina no momento em que alguém o atinge."],"approx":["A fonte não diz explicitamente se os braços 3 e 4 podem começar antes de os dois lados do spinner estarem cobertos; aplica-se a convenção norte-americana habitual (só depois dos dois lados).","O arredondamento a 5 faz-se sobre o total dos pontos dos adversários (e não peça a peça).","Repartição em caso de empate com 3 jogadores: cada um recebe metade, arredondada por defeito."]},
  de:{"name":"All Fives (Fives, mit Spinner)","origin":"Die „Fives“-Familie: Man punktet, wenn die offenen Enden ein Vielfaches von fünf ergeben. Die Spinner-Form ist das nordamerikanische Turnierspiel.","desc":"Nach jedem Stein werden die offenen Enden addiert; ist die Summe ein Vielfaches von 5, punktet man sofort. Der erste gelegte Pasch wird zum Spinner und öffnet vier Arme.","rules":["Doppel-Sechs-Satz. Hände: 2 Spielende 9 Steine, 3 Spielende 7, 4 Spielende 5 (zu viert spielt man meist als Paare: hier kann man 2 Teams zu je 2 wählen, die Partnerin oder der Partner sitzt gegenüber). Der Rest ist der Vorrat.","Wer den höchsten Pasch hat, eröffnet mit einem beliebigen Stein (statt zu losen). Danach eröffnet, wer in der letzten Runde zuerst fertig wurde; nach einer Blockade wird gelost.","Nach jedem Stein werden die offenen Enden des Tisches addiert. Ist die Summe ein Vielfaches von 5 (5–35), punktet die Person sie sofort. Ein Pasch am Ende eines Arms zählt beide Hälften (5-5 = 10, 6-6 = 12).","Der erste gelegte Pasch (egal wo) ist der SPINNER: Die ersten beiden Steine kommen an seine beiden Längsseiten; erst dann können die Arme 3 und 4 von seinen Enden ausgehen. Solange der Spinner nicht auf beiden Seiten Steine hat, zählt er doppelt; danach zählt er nicht mehr, nur noch die tatsächlichen Armenden.","Wer nicht legen kann, zieht nach, bis ein passender Stein kommt (sofort gelegt) oder der Vorrat leer ist; dann passt man. Solange man einen legbaren Stein hat, darf man nicht nachziehen.","Rundenende: Wer zuerst fertig ist, punktet die in den Händen der Gegner verbliebenen Augen, auf das nächste Vielfache von 5 gerundet (3 → 5, 2 → 0). Bei einer Blockade gewinnt die Person bzw. das Team mit den wenigsten Augen und punktet die der anderen, gerundet; bei Gleichstand punktet bei 2 oder 4 Spielenden niemand; bei 3 Spielenden teilen sich zwei Gleichauf-Liegende am Minimum die Punkte der dritten Person.","Ziel: 250 Punkte bei 2 Spielenden, 200 bei 3–4; das Spiel endet in dem Moment, in dem jemand es erreicht."],"approx":["Die Quelle sagt nicht ausdrücklich, ob die Arme 3 und 4 beginnen dürfen, bevor beide Spinner-Seiten belegt sind; es gilt die übliche US-Konvention (erst nach beiden Seiten).","Das Runden auf 5 erfolgt auf die Gesamtsumme der gegnerischen Augen (nicht Stein für Stein).","Aufteilung bei Gleichstand mit 3 Spielenden: Jede Person erhält die Hälfte, abgerundet."]},
  hu:{"name":"All Fives (Fives, spinnerrel)","origin":"A „Fives” család: pontot kapsz, ha a nyitott végek összege öt többszöröse. A spinneres forma az észak-amerikai versenyjáték.","desc":"Minden kő után összeadjuk a nyitott végeket; ha az összeg 5 többszöröse, azonnal pontot kapsz érte. Az első kijátszott dupla spinner lesz, és négy ágat nyit.","rules":["Dupla hatos készlet. Leosztás: 2 játékosnál 9 kő, 3 játékosnál 7, 4 játékosnál 5 (négyen általában párban játszanak: itt választhatsz 2 kétfős csapatot, a társ szemben ül). A többi a kupac.","A legnagyobb dupla birtokosa kezd, bármelyik kővel (a sorsolás helyett). Utána az kezd, aki az előző leosztásban először kiment; blokk után sorsolás dönt.","Minden kő után összeadjuk az asztal nyitott végeit. Ha az összeg 5 többszöröse (5–35), a játékos azonnal megkapja. Egy ág végén álló dupla mindkét felét számítja (5-5 = 10, 6-6 = 12).","Az első kijátszott dupla (bárhol) a SPINNER: az első két követ az ő két oldalához illesztjük; csak ezután indulhat a 3. és a 4. ág a végeiről. Amíg a spinner mindkét oldalán nincs kő, kétszeres értékkel számít; utána már nem számít, csak az ágak valódi végei.","Ha nem tudsz lépni, addig húzol, amíg illő követ nem kapsz (azonnal lerakod), vagy amíg a kupac ki nem ürül; ekkor passzolsz. Nem húzhatsz, ha van lerakható köved.","A leosztás vége: aki kimegy, megkapja az ellenfelek kezében maradt pontokat, a legközelebbi 5-ös többszörösre kerekítve (3 → 5, 2 → 0). Blokk esetén a legkevesebb ponttal rendelkező játékos vagy csapat nyer, és megkapja a többiek kerekített pontjait; döntetlen esetén 2 vagy 4 játékosnál senki nem pontoz; 3 játékosnál a minimumon holtversenyben álló két játékos megosztozik a harmadik pontjain.","Cél: 2 játékosnál 250 pont, 3–4 játékosnál 200; a játék abban a pillanatban véget ér, amikor valaki eléri."],"approx":["A forrás nem mondja ki kifejezetten, hogy a 3. és 4. ág elindulhat-e, mielőtt a spinner mindkét oldala be van fedve; a szokásos amerikai konvenciót alkalmazzuk (csak mindkét oldal után).","Az 5-re kerekítés az ellenfelek pontjainak összegén történik (nem kövenként).","Osztozás döntetlen esetén 3 játékosnál: mindenki a felét kapja, lefelé kerekítve."]} },

{ id:'muggins', vid:'muggins', play:true, set:'6', players:[2,4], tags:['score','draw'], icon:[6,4],
  ro:{ name:'Muggins (All Fives fără spinner)',
    origin:'Numele „Muggins” e folosit în unele țări pentru All Fives; sursa descrie varianta cu o singură linie, fără spinner.',
    desc:'Aceeași scorare la capete ca la All Fives, dar o singură linie și niciun dublu spinner.',
    rules:[
      'Set double-6. Mâini: 7 piese la 2 jucători, 5 piese la 3 sau 4; restul = bon.',
      'O singură linie cu două capete. Dublurile se pun transversal și NU sunt spinner; un dublu la capăt numără ambele jumătăți (5-5 = 10).',
      'După fiecare piesă, dacă suma celor două capete e multiplu de 5, jucătorul punctează totalul (maxim 20: 6-6 + 4-4).',
      'Cine nu poate muta trage până găsește o piesă care se potrivește (o joacă imediat); dacă bonul e gol, pasează.',
      'Mâna se termină când cineva rămâne fără piese sau jocul e blocat. Câștigătorul încasează punctele pieselor rămase ale celorlalți, rotunjite la 5 (blocaj: cel cu cele mai puține puncte).',
      'Ținta: 250 la 2 jucători, 200 la 3–4.'],
    approx:['Pagina sursă e inconsistentă: introducerea spune că cine iese încasează punctele celorlalți, secțiunea de scor spune că fiecare scade din scorul propriu piesele rămase. Am ales prima variantă (a doua nu converge: scorurile scad la nesfârșit). Aceeași alegere pentru blocaj (fără regulă separată în sursă).',
            'Echipele nu sunt implementate (sursa le menționează doar în treacăt).'] },
  en:{ name:'Muggins (All Fives without a spinner)',
    origin:'"Muggins" is the name some places use for All Fives; the source describes the single-line version with no spinner.',
    desc:'The same end-scoring as All Fives, but a single line and no spinner double.',
    rules:[
      'Double-six set. Hands: 7 tiles with 2 players, 5 with 3 or 4; the rest is the boneyard.',
      'One line with two ends. Doubles are crosswise and NOT spinners; a double at an end counts both halves (5-5 = 10).',
      'After each tile, if the two ends add up to a multiple of 5 the player scores the total (at most 20: 6-6 + 4-4).',
      'A player who cannot play draws until a tile fits (played at once); with an empty boneyard they pass.',
      'The hand ends when a player goes out or the game is blocked. The winner scores the others\' remaining pips rounded to 5 (in a block: the player with the fewest pips).',
      'Target: 250 with 2 players, 200 with 3–4.'],
    approx:['The source page is inconsistent: the introduction says the player who goes out scores the others\' pips, the scoring section says everyone subtracts their own remaining pips. The first reading is used (the second never converges: scores keep falling). Same choice for blocks (no separate rule in the source).',
            'Partnerships are not implemented (the source only mentions them in passing).'] },
  fr:{"name":"Muggins (All Fives sans spinner)","origin":"« Muggins » est le nom que certains endroits donnent à All Fives ; la source décrit la version à ligne unique, sans spinner.","desc":"Le même décompte aux extrémités qu’à All Fives, mais avec une seule ligne et aucun double spinner.","rules":["Jeu double-six. Mains : 7 dominos à 2 joueurs, 5 à 3 ou 4 ; le reste forme le talon.","Une seule ligne à deux extrémités. Les doubles sont en travers et PAS des spinners ; un double à une extrémité compte ses deux moitiés (5-5 = 10).","Après chaque domino, si les deux extrémités totalisent un multiple de 5, le joueur marque le total (20 au maximum : 6-6 + 4-4).","Un joueur qui ne peut pas jouer pioche jusqu’à ce qu’un domino convienne (joué aussitôt) ; si le talon est vide, il passe.","La manche se termine quand un joueur sort ou que le jeu est bloqué. Le gagnant marque les points restants des autres, arrondis à 5 (en cas de blocage : le joueur qui en a le moins).","Objectif : 250 à 2 joueurs, 200 à 3–4."],"approx":["La page source est incohérente : l’introduction dit que le joueur qui sort marque les points des autres, la section décompte dit que chacun soustrait ses propres points restants. La première lecture est retenue (la seconde ne converge jamais : les scores ne cessent de baisser). Même choix pour les blocages (pas de règle séparée dans la source).","Les parties en équipes ne sont pas implémentées (la source les mentionne seulement en passant)."]},
  it:{"name":"Muggins (All Fives senza spinner)","origin":"«Muggins» è il nome che alcuni luoghi usano per All Fives; la fonte descrive la versione a linea unica, senza spinner.","desc":"Lo stesso punteggio alle estremità di All Fives, ma con una sola linea e nessun doppio spinner.","rules":["Set doppio sei. Mani: 7 tessere con 2 giocatori, 5 con 3 o 4; il resto è il monte.","Una sola linea con due estremità. I doppi sono di traverso e NON sono spinner; un doppio a un’estremità conta entrambe le metà (5-5 = 10).","Dopo ogni tessera, se le due estremità sommano un multiplo di 5, il giocatore segna il totale (al massimo 20: 6-6 + 4-4).","Chi non può giocare pesca finché una tessera non va bene (giocata subito); con il monte vuoto passa.","La mano finisce quando un giocatore esce o il gioco è bloccato. Il vincitore segna i punti rimasti agli altri arrotondati a 5 (in un blocco: il giocatore con meno punti).","Obiettivo: 250 con 2 giocatori, 200 con 3–4."],"approx":["La pagina della fonte è incoerente: l’introduzione dice che chi esce segna i punti degli altri, la sezione sul punteggio dice che ognuno sottrae i propri punti rimasti. Si usa la prima lettura (la seconda non converge mai: i punteggi continuano a scendere). Stessa scelta per i blocchi (nella fonte non c’è una regola separata).","Il gioco a coppie non è implementato (la fonte lo cita solo di passaggio)."]},
  es:{"name":"Muggins (All Fives sin spinner)","origin":"«Muggins» es el nombre que algunos lugares dan a All Fives; la fuente describe la versión de línea única, sin spinner.","desc":"La misma puntuación en los extremos que All Fives, pero con una sola línea y sin doble spinner.","rules":["Juego doble seis. Manos: 7 fichas con 2 jugadores, 5 con 3 o 4; el resto es el pozo.","Una línea con dos extremos. Los dobles van en cruz y NO son spinners; un doble en un extremo cuenta ambas mitades (5-5 = 10).","Tras cada ficha, si los dos extremos suman un múltiplo de 5, el jugador anota el total (20 como máximo: 6-6 + 4-4).","Quien no puede jugar roba hasta que una ficha encaje (se juega al instante); con el pozo vacío pasa.","La mano termina cuando un jugador se va o el juego se bloquea. El ganador anota los puntos restantes de los demás redondeados a 5 (en un bloqueo: el jugador con menos puntos).","Objetivo: 250 con 2 jugadores, 200 con 3–4."],"approx":["La página de la fuente es incoherente: la introducción dice que quien se va anota los puntos de los demás, y la sección de puntuación dice que cada uno resta sus propios puntos restantes. Se usa la primera lectura (la segunda nunca converge: las puntuaciones no dejan de bajar). Misma elección para los bloqueos (la fuente no da una regla aparte).","El juego por parejas no está implementado (la fuente solo lo menciona de pasada)."]},
  pt:{"name":"Muggins (All Fives sem spinner)","origin":"«Muggins» é o nome que alguns locais dão ao All Fives; a fonte descreve a versão de linha única, sem spinner.","desc":"A mesma pontuação nas pontas do All Fives, mas com uma só linha e sem duplo spinner.","rules":["Conjunto duplo-seis. Mãos: 7 peças com 2 jogadores, 5 com 3 ou 4; o resto é o monte.","Uma linha com duas pontas. Os duplos ficam atravessados e NÃO são spinners; um duplo numa ponta conta as duas metades (5-5 = 10).","Depois de cada peça, se as duas pontas somarem um múltiplo de 5, o jogador marca o total (no máximo 20: 6-6 + 4-4).","Quem não pode jogar compra até que uma peça sirva (jogada de imediato); com o monte vazio, passa.","A mão termina quando um jogador sai ou o jogo fica bloqueado. O vencedor marca os pontos restantes dos outros, arredondados a 5 (num bloqueio: o jogador com menos pontos).","Objetivo: 250 com 2 jogadores, 200 com 3–4."],"approx":["A página da fonte é incoerente: a introdução diz que quem sai marca os pontos dos outros, a secção de pontuação diz que cada um subtrai os seus próprios pontos restantes. Usa-se a primeira leitura (a segunda nunca converge: as pontuações não param de descer). Mesma escolha para os bloqueios (a fonte não dá regra à parte).","O jogo em pares não está implementado (a fonte só o menciona de passagem)."]},
  de:{"name":"Muggins (All Fives ohne Spinner)","origin":"„Muggins“ ist der Name, den manche Orte für All Fives verwenden; die Quelle beschreibt die Version mit einer einzigen Reihe ohne Spinner.","desc":"Dieselbe Endenwertung wie bei All Fives, aber mit einer einzigen Reihe und ohne Spinner-Pasch.","rules":["Doppel-Sechs-Satz. Hände: 7 Steine bei 2 Spielenden, 5 bei 3 oder 4; der Rest ist der Vorrat.","Eine Reihe mit zwei Enden. Päsche liegen quer und sind KEINE Spinner; ein Pasch an einem Ende zählt beide Hälften (5-5 = 10).","Ergeben die beiden Enden nach einem Stein ein Vielfaches von 5, punktet die Person die Summe (höchstens 20: 6-6 + 4-4).","Wer nicht legen kann, zieht nach, bis ein Stein passt (sofort gelegt); bei leerem Vorrat passt man.","Die Runde endet, wenn jemand fertig ist oder das Spiel blockiert. Der Gewinner punktet die verbliebenen Augen der anderen, auf 5 gerundet (bei einer Blockade: die Person mit den wenigsten Augen).","Ziel: 250 bei 2 Spielenden, 200 bei 3–4."],"approx":["Die Quellenseite ist widersprüchlich: Die Einleitung sagt, wer fertig wird, punktet die Augen der anderen; der Wertungsabschnitt sagt, alle ziehen ihre eigenen Restaugen ab. Es wird die erste Lesart verwendet (die zweite konvergiert nie: die Punktzahlen sinken immer weiter). Dieselbe Wahl für Blockaden (die Quelle nennt keine eigene Regel).","Partnerspiel ist nicht umgesetzt (die Quelle erwähnt es nur am Rande)."]},
  hu:{"name":"Muggins (All Fives spinner nélkül)","origin":"A „Muggins” az a név, amelyet egyes helyek az All Fives-ra használnak; a forrás az egysoros, spinner nélküli változatot írja le.","desc":"Ugyanaz a végpontozás, mint az All Fives-nál, de egyetlen sorral és spinner dupla nélkül.","rules":["Dupla hatos készlet. Leosztás: 2 játékosnál 7 kő, 3 vagy 4 játékosnál 5; a többi a kupac.","Egy sor két véggel. A duplák keresztben állnak, és NEM spinnerek; a végen álló dupla mindkét felét számítja (5-5 = 10).","Minden kő után, ha a két vég összege 5 többszöröse, a játékos megkapja az összeget (legfeljebb 20: 6-6 + 4-4).","Aki nem tud lépni, addig húz, amíg egy kő nem illik (azonnal lerakja); üres kupacnál passzol.","A leosztás véget ér, ha egy játékos kimegy, vagy a játék blokkolódik. A nyertes megkapja a többiek megmaradt pontjait 5-re kerekítve (blokk esetén: a legkevesebb ponttal rendelkező játékos).","Cél: 2 játékosnál 250, 3–4 játékosnál 200."],"approx":["A forrásoldal önellentmondó: a bevezető szerint aki kimegy, megkapja a többiek pontjait, a pontozási rész szerint mindenki levonja a saját megmaradt pontjait. Az első olvasatot használjuk (a második sosem konvergál: a pontszámok folyton csökkennek). Ugyanez a választás a blokkokra (a forrás nem ad külön szabályt).","A páros játék nincs megvalósítva (a forrás csak futólag említi)."]} },

{ id:'sniff', vid:'sniff', play:true, set:'6', players:[2,4], tags:['score','spinner','draw'], icon:[4,4],
  ro:{ name:'Sniff (est-coast)',
    origin:'Rudă cu All Fives: primul dublu („Sniff”) funcționează ca spinner; la sfârșitul mâinii se scad pipurile rămase.',
    desc:'Ca All Fives, dar cu mâini diferite și cu scădere a pipurilor rămase la sfârșitul fiecărei mâini.',
    rules:[
      'Set double-6. Mâini: 2 jucători 7 piese, 3 jucători 6, 4 jucători 5; restul = bon.',
      'Primul dublu jucat este Sniff: se pune transversal ca spinner, iar capetele lui numără cât timp sunt expuse. Se pot adăuga câte o piesă pe fiecare latură, apoi se joacă mai departe ca la All Fives. Exemplu (Pagat): 4-4 primul = 8; apoi 6-4 pe o latură = 4+4+6 = 14; apoi 4-1 pe cealaltă latură = 4+4+6+1 = 15 (la All Fives ar fi doar 7).',
      'Scorare la capete: suma capetelor deschise, dacă e multiplu de 5, se punctează imediat. Dublurile ulterioare sunt transversale, nu spinner, și numără ambele jumătăți la capătul unui braț.',
      'Tragere: dacă nu poți muta, tragi până găsești o piesă potrivită (o joci imediat) sau bonul e gol; atunci pasezi.',
      'La sfârșitul mâinii (ieșire sau blocaj) pipurile rămase ale fiecărui jucător, rotunjite la 5, se SCAD din scorul lui.',
      'Ținta: 250 la 2 jucători, 200 la 3–4. Din cauza scăderii, partidele pot dura multe mâini.'],
    approx:['Se implementează varianta americană (Sniff transversal = spinner), nu cea britanică (rămâne în linie, cu o singură piesă pe latură).',
            'Capetele laterale ale Sniff-ului numără cât sunt neacoperite și după ce ambele laturi au piese (cum arată exemplul din sursă); sursa nu spune explicit dacă brațele laterale se pot porni înainte de a acoperi laturile: se aplică convenția de la All Fives (abia după ambele laturi).',
            'Echipele (obișnuite la 4 jucători) nu sunt implementate: sursa nu dă regula lor de scor.'] },
  en:{ name:'Sniff (East-coast dominoes)',
    origin:'A relative of All Fives: the first double (the "Sniff") acts as a spinner; remaining pips are subtracted at the end of each hand.',
    desc:'Like All Fives, but with different hand sizes and a subtraction of the pips left at the end of every hand.',
    rules:[
      'Double-six set. Hands: 7 tiles with 2 players, 6 with 3, 5 with 4; the rest is the boneyard.',
      'The first double played is the Sniff: placed crosswise as a spinner, its ends count while exposed. One tile may be added on each side, then play continues as in All Fives. Example (Pagat): 4-4 first = 8; then 6-4 on one side = 4+4+6 = 14; then 4-1 on the other side = 4+4+6+1 = 15 (in All Fives that would be only 7).',
      'End scoring: the sum of the open ends, if a multiple of 5, scores at once. Later doubles are crosswise, not spinners, and count both halves at the end of an arm.',
      'Drawing: with no move you draw until a tile fits (played at once) or the boneyard is empty; then you pass.',
      'At the end of the hand (going out or a block) each player\'s remaining pips, rounded to 5, are SUBTRACTED from their score.',
      'Target: 250 with 2 players, 200 with 3–4. Because of the subtraction, games can last many hands.'],
    approx:['The US version is implemented (crosswise Sniff = spinner), not the British one (stays in line, one tile per side).',
            'The Sniff\'s lateral ends count while uncovered, even after both sides have tiles (as the source\'s example shows); the source does not say explicitly whether the lateral arms may start before both sides are covered: the All Fives convention (only after both sides) is applied.',
            'Partnerships (usual with 4 players) are not implemented: the source gives no team scoring.'] },
  fr:{"name":"Sniff (domino de la côte Est)","origin":"Un cousin d’All Fives : le premier double (le « Sniff ») joue le rôle de spinner ; les points restants sont soustraits à la fin de chaque manche.","desc":"Comme All Fives, mais avec d’autres tailles de main et une soustraction des points restants à la fin de chaque manche.","rules":["Jeu double-six. Mains : 7 dominos à 2 joueurs, 6 à 3, 5 à 4 ; le reste forme le talon.","Le premier double joué est le Sniff : placé en travers comme spinner, ses extrémités comptent tant qu’elles sont exposées. On peut ajouter un domino de chaque côté, puis le jeu continue comme à All Fives. Exemple (Pagat) : 4-4 en premier = 8 ; puis 6-4 d’un côté = 4+4+6 = 14 ; puis 4-1 de l’autre côté = 4+4+6+1 = 15 (à All Fives ce ne serait que 7).","Décompte final : la somme des extrémités ouvertes, si c’est un multiple de 5, se marque aussitôt. Les doubles suivants sont en travers, sans être spinners, et comptent leurs deux moitiés à l’extrémité d’une branche.","Pioche : sans coup possible, on pioche jusqu’à ce qu’un domino convienne (joué aussitôt) ou que le talon soit vide ; on passe alors.","À la fin de la manche (sortie ou blocage), les points restants de chaque joueur, arrondis à 5, sont SOUSTRAITS de son score.","Objectif : 250 à 2 joueurs, 200 à 3–4. À cause de la soustraction, les parties peuvent durer de nombreuses manches."],"approx":["C’est la version américaine qui est implémentée (Sniff en travers = spinner), pas la britannique (reste dans la ligne, un domino par côté).","Les extrémités latérales du Sniff comptent tant qu’elles sont découvertes, même après que les deux côtés ont reçu des dominos (comme le montre l’exemple de la source) ; la source ne dit pas explicitement si les branches latérales peuvent démarrer avant que les deux côtés soient couverts : la convention d’All Fives (seulement après les deux côtés) est appliquée.","Les parties en équipes (habituelles à 4 joueurs) ne sont pas implémentées : la source ne donne aucun décompte par équipe."]},
  it:{"name":"Sniff (domino della costa orientale)","origin":"Un parente di All Fives: il primo doppio (lo «Sniff») fa da spinner; i punti rimasti si sottraggono alla fine di ogni mano.","desc":"Come All Fives, ma con mani di dimensioni diverse e con la sottrazione dei punti rimasti alla fine di ogni mano.","rules":["Set doppio sei. Mani: 7 tessere con 2 giocatori, 6 con 3, 5 con 4; il resto è il monte.","Il primo doppio giocato è lo Sniff: messo di traverso come spinner, le sue estremità contano finché sono esposte. Si può aggiungere una tessera per lato, poi si prosegue come in All Fives. Esempio (Pagat): prima 4-4 = 8; poi 6-4 su un lato = 4+4+6 = 14; poi 4-1 sull’altro lato = 4+4+6+1 = 15 (in All Fives sarebbe solo 7).","Punteggio: la somma delle estremità aperte, se è un multiplo di 5, si segna subito. I doppi successivi sono di traverso, non spinner, e a fine braccio contano entrambe le metà.","Pesca: senza mosse si pesca finché una tessera non va bene (giocata subito) o il monte è vuoto; poi si passa.","A fine mano (uscita o blocco) i punti rimasti a ciascun giocatore, arrotondati a 5, vengono SOTTRATTI dal suo punteggio.","Obiettivo: 250 con 2 giocatori, 200 con 3–4. A causa della sottrazione le partite possono durare molte mani."],"approx":["È implementata la versione americana (Sniff di traverso = spinner), non quella britannica (resta in linea, una tessera per lato).","Le estremità laterali dello Sniff contano finché sono scoperte, anche dopo che entrambi i lati hanno tessere (come mostra l’esempio della fonte); la fonte non dice esplicitamente se i bracci laterali possano partire prima che entrambi i lati siano coperti: si applica la convenzione di All Fives (solo dopo entrambi i lati).","Il gioco a coppie (abituale con 4 giocatori) non è implementato: la fonte non indica un punteggio a squadre."]},
  es:{"name":"Sniff (dominó de la costa este)","origin":"Un pariente de All Fives: el primer doble (el «Sniff») actúa como spinner; los puntos restantes se restan al final de cada mano.","desc":"Como All Fives, pero con otros tamaños de mano y con una resta de los puntos restantes al final de cada mano.","rules":["Juego doble seis. Manos: 7 fichas con 2 jugadores, 6 con 3, 5 con 4; el resto es el pozo.","El primer doble jugado es el Sniff: colocado en cruz como spinner, sus extremos cuentan mientras estén expuestos. Se puede añadir una ficha a cada lado y luego el juego sigue como en All Fives. Ejemplo (Pagat): 4-4 primero = 8; luego 6-4 en un lado = 4+4+6 = 14; luego 4-1 en el otro lado = 4+4+6+1 = 15 (en All Fives serían solo 7).","Puntuación final: la suma de los extremos abiertos, si es múltiplo de 5, se anota al instante. Los dobles posteriores van en cruz, no son spinners, y cuentan ambas mitades al final de un brazo.","Robo: sin jugada se roba hasta que una ficha encaje (se juega al instante) o hasta que el pozo se vacíe; entonces se pasa.","Al final de la mano (salida o bloqueo), los puntos restantes de cada jugador, redondeados a 5, se RESTAN de su puntuación.","Objetivo: 250 con 2 jugadores, 200 con 3–4. Por la resta, las partidas pueden durar muchas manos."],"approx":["Se implementa la versión estadounidense (Sniff en cruz = spinner), no la británica (se queda en línea, una ficha por lado).","Los extremos laterales del Sniff cuentan mientras estén descubiertos, incluso después de que ambos lados tengan fichas (como muestra el ejemplo de la fuente); la fuente no dice explícitamente si los brazos laterales pueden empezar antes de cubrir ambos lados: se aplica la convención de All Fives (solo después de ambos lados).","El juego por parejas (habitual con 4 jugadores) no está implementado: la fuente no da puntuación por equipos."]},
  pt:{"name":"Sniff (dominó da costa leste)","origin":"Um parente do All Fives: o primeiro duplo (o «Sniff») funciona como spinner; os pontos restantes são subtraídos no fim de cada mão.","desc":"Como o All Fives, mas com outros tamanhos de mão e com a subtração dos pontos restantes no fim de cada mão.","rules":["Conjunto duplo-seis. Mãos: 7 peças com 2 jogadores, 6 com 3, 5 com 4; o resto é o monte.","O primeiro duplo jogado é o Sniff: colocado atravessado como spinner, as suas pontas contam enquanto estiverem expostas. Pode juntar-se uma peça de cada lado e depois o jogo continua como no All Fives. Exemplo (Pagat): primeiro 4-4 = 8; depois 6-4 num lado = 4+4+6 = 14; depois 4-1 no outro lado = 4+4+6+1 = 15 (no All Fives seriam apenas 7).","Pontuação: a soma das pontas abertas, se for múltiplo de 5, marca-se de imediato. Os duplos seguintes ficam atravessados, não são spinners, e contam as duas metades no fim de um braço.","Compra: sem jogada, compra-se até que uma peça sirva (jogada de imediato) ou até o monte se esgotar; depois passa-se.","No fim da mão (saída ou bloqueio), os pontos restantes de cada jogador, arredondados a 5, são SUBTRAÍDOS da sua pontuação.","Objetivo: 250 com 2 jogadores, 200 com 3–4. Por causa da subtração, os jogos podem durar muitas mãos."],"approx":["Está implementada a versão norte-americana (Sniff atravessado = spinner), não a britânica (fica na linha, uma peça por lado).","As pontas laterais do Sniff contam enquanto estiverem descobertas, mesmo depois de os dois lados terem peças (como mostra o exemplo da fonte); a fonte não diz explicitamente se os braços laterais podem começar antes de os dois lados estarem cobertos: aplica-se a convenção do All Fives (só depois dos dois lados).","O jogo em pares (habitual com 4 jogadores) não está implementado: a fonte não dá pontuação por equipas."]},
  de:{"name":"Sniff (Domino der Ostküste)","origin":"Ein Verwandter von All Fives: Der erste Pasch (der „Sniff“) wirkt als Spinner; die Restaugen werden am Ende jeder Runde abgezogen.","desc":"Wie All Fives, aber mit anderen Handgrößen und mit Abzug der Restaugen am Ende jeder Runde.","rules":["Doppel-Sechs-Satz. Hände: 7 Steine bei 2 Spielenden, 6 bei 3, 5 bei 4; der Rest ist der Vorrat.","Der erste gelegte Pasch ist der Sniff: quer als Spinner gelegt, zählen seine Enden, solange sie offen liegen. Auf jeder Seite darf ein Stein angelegt werden, danach geht das Spiel wie bei All Fives weiter. Beispiel (Pagat): zuerst 4-4 = 8; dann 6-4 auf einer Seite = 4+4+6 = 14; dann 4-1 auf der anderen Seite = 4+4+6+1 = 15 (bei All Fives wären es nur 7).","Endwertung: Die Summe der offenen Enden punktet sofort, wenn sie ein Vielfaches von 5 ist. Spätere Päsche liegen quer, sind keine Spinner und zählen am Ende eines Arms beide Hälften.","Nachziehen: Ohne Zug zieht man nach, bis ein Stein passt (sofort gelegt) oder der Vorrat leer ist; dann passt man.","Am Ende der Runde (Ausspielen oder Blockade) werden die Restaugen jeder Person, auf 5 gerundet, von ihrer Punktzahl ABGEZOGEN.","Ziel: 250 bei 2 Spielenden, 200 bei 3–4. Wegen des Abzugs können Spiele viele Runden dauern."],"approx":["Umgesetzt ist die US-Version (quer gelegter Sniff = Spinner), nicht die britische (bleibt in der Reihe, ein Stein pro Seite).","Die seitlichen Enden des Sniff zählen, solange sie unbedeckt sind, auch nachdem beide Seiten Steine haben (wie das Beispiel der Quelle zeigt); die Quelle sagt nicht ausdrücklich, ob die seitlichen Arme beginnen dürfen, bevor beide Seiten belegt sind: Es gilt die All-Fives-Konvention (erst nach beiden Seiten).","Partnerspiel (bei 4 Spielenden üblich) ist nicht umgesetzt: Die Quelle gibt keine Teamwertung an."]},
  hu:{"name":"Sniff (keleti parti dominó)","origin":"Az All Fives rokona: az első dupla (a „Sniff”) spinnerként működik; a megmaradt pontokat minden leosztás végén levonják.","desc":"Mint az All Fives, de más leosztási méretekkel, és a megmaradt pontok levonásával minden leosztás végén.","rules":["Dupla hatos készlet. Leosztás: 2 játékosnál 7 kő, 3-nál 6, 4-nél 5; a többi a kupac.","Az első kijátszott dupla a Sniff: keresztben, spinnerként áll, végei addig számítanak, amíg szabadon állnak. Mindkét oldalra rakható egy-egy kő, majd a játék az All Fives szerint folytatódik. Példa (Pagat): előbb 4-4 = 8; aztán 6-4 az egyik oldalon = 4+4+6 = 14; aztán 4-1 a másik oldalon = 4+4+6+1 = 15 (az All Fives-ban ez csak 7 lenne).","Végpontozás: a nyitott végek összege, ha 5 többszöröse, azonnal pontot ér. A későbbi duplák keresztben állnak, nem spinnerek, és egy ág végén mindkét felüket számítják.","Húzás: ha nincs lépés, addig húzunk, amíg egy kő nem illik (azonnal lerakjuk), vagy amíg a kupac ki nem ürül; ekkor passzolunk.","A leosztás végén (kimenés vagy blokk) minden játékos megmaradt pontjait, 5-re kerekítve, LEVONJÁK a pontszámából.","Cél: 2 játékosnál 250, 3–4 játékosnál 200. A levonás miatt a játszmák sok leosztásig tarthatnak."],"approx":["Az amerikai változat van megvalósítva (keresztben álló Sniff = spinner), nem a brit (a sorban marad, oldalanként egy kő).","A Sniff oldalsó végei addig számítanak, amíg fedetlenek, még azután is, hogy mindkét oldalon van kő (ahogy a forrás példája mutatja); a forrás nem mondja ki kifejezetten, hogy az oldalsó ágak elindulhatnak-e, mielőtt mindkét oldal be van fedve: az All Fives konvencióját alkalmazzuk (csak mindkét oldal után).","A páros játék (4 játékosnál szokásos) nincs megvalósítva: a forrás nem ad csapatpontozást."]} },

{ id:'f53', vid:'f53', play:true, set:'6', players:[2,4], tags:['score'], icon:[3,5],
  ro:{ name:'Fives and Threes (cinci și trei)',
    origin:'Joc popular în Marea Britanie: se punctează multiplii de 3 și de 5 de la capete, jucat de obicei pe tabla de cribbage până la 61.',
    desc:'Fiecare 3 și fiecare 5 din suma capetelor valorează 1 punct: 15 = 8 puncte, 12 = 4, 10 = 2. Fără tragere, ținta se atinge exact.',
    rules:[
      'Set double-6. Mâini: 7 piese la 2 jucători, 5 la 3–4. Restul NU se folosește: nu se trage niciodată.',
      'După fiecare piesă se adună capetele (dublu la capăt = ambele jumătăți). Fiecare multiplu de 3 și de 5 din total dă un punct pentru fiecare 3, respectiv 5 conținut: 3 → 1, 5 → 1, 6 → 2, 9 → 3, 10 → 2, 12 → 4, 15 → 8, 18 → 6, 20 → 4.',
      'Dacă nu poți muta pasezi (obligatoriu când ai mutare nu poți pasa).',
      'Cine rămâne fără piese primește 1 punct suplimentar („chip out”); la blocaj nu se dă acest punct.',
      'Câștigă primul care ajunge EXACT la 61: un scor care ar depăși 61 se anulează în întregime (inclusiv punctul de ieșire). Jocul se oprește imediat ce cineva ajunge la 61.',
      'Mâna următoare o deschide jucătorul următor în rotație.'],
    approx:['Echipele (4 jucători) nu sunt implementate: regula lor de „chip out” (ambii parteneri) nu e inclusă; la 4 jucători se joacă individual.',
            'Prima mână: deschide deținătorul celui mai mare dublu (în loc de tragerea la sorți).',
            'AI: nivelurile 1–3 joacă aproape la fel de bine aici (testat ~50% între niveluri); diferențele dintre niveluri sunt reale doar în celelalte variante.'] },
  en:{ name:'Fives and Threes',
    origin:'A popular British game: multiples of 3 and 5 at the ends score, usually kept on a cribbage board up to 61.',
    desc:'Every 3 and every 5 in the sum of the ends is worth 1 point: 15 = 8 points, 12 = 4, 10 = 2. No drawing, and the target must be hit exactly.',
    rules:[
      'Double-six set. Hands: 7 tiles with 2 players, 5 with 3–4. The rest is NOT used: nobody ever draws.',
      'After each tile the ends are added (a double at an end counts both halves). Each 3 and each 5 contained in the total gives one point: 3 → 1, 5 → 1, 6 → 2, 9 → 3, 10 → 2, 12 → 4, 15 → 8, 18 → 6, 20 → 4.',
      'A player with no move knocks (passes); passing is illegal when a play exists.',
      'Whoever plays their last tile gets 1 extra point ("chip out"); a block gives no such point.',
      'The first to reach EXACTLY 61 wins: a score that would take the total past 61 is void in full (including the chip-out point). The game stops the moment someone hits 61.',
      'The next hand is led by the next player in rotation.'],
    approx:['Partnerships (4 players) are not implemented: their "both partners chipped out" rule is not included; four players play individually.',
            'First hand: the holder of the highest double leads (instead of drawing lots).',
            'AI: levels 1–3 play about equally well here (tested ~50% between levels); the level differences are real only in the other variants.'] },
  fr:{"name":"Fives and Threes","origin":"Un jeu britannique populaire : les multiples de 3 et de 5 aux extrémités rapportent des points, que l’on tient généralement sur un cribbage jusqu’à 61.","desc":"Chaque 3 et chaque 5 contenus dans la somme des extrémités vaut 1 point : 15 = 8 points, 12 = 4, 10 = 2. Pas de pioche, et l’objectif doit être atteint exactement.","rules":["Jeu double-six. Mains : 7 dominos à 2 joueurs, 5 à 3–4. Le reste n’est PAS utilisé : personne ne pioche jamais.","Après chaque domino on additionne les extrémités (un double à une extrémité compte ses deux moitiés). Chaque 3 et chaque 5 contenus dans le total donne un point : 3 → 1, 5 → 1, 6 → 2, 9 → 3, 10 → 2, 12 → 4, 15 → 8, 18 → 6, 20 → 4.","Un joueur sans coup frappe (passe) ; passer est interdit s’il existe un coup.","Celui qui pose son dernier domino obtient 1 point supplémentaire (« chip out ») ; un blocage ne donne pas ce point.","Le premier à atteindre EXACTEMENT 61 gagne : un score qui ferait dépasser 61 est annulé en entier (y compris le point de « chip out »). La partie s’arrête dès que quelqu’un atteint 61.","La manche suivante est ouverte par le joueur suivant dans l’ordre."],"approx":["Les parties en équipes (4 joueurs) ne sont pas implémentées : leur règle « les deux partenaires sont sortis » n’est pas incluse ; à quatre on joue chacun pour soi.","Première manche : le détenteur du plus grand double ouvre (au lieu du tirage au sort).","IA : les niveaux 1 à 3 jouent à peu près aussi bien ici (environ 50 % entre niveaux lors des tests) ; les différences de niveau ne sont réelles que dans les autres variantes."]},
  it:{"name":"Fives and Threes","origin":"Un popolare gioco britannico: i multipli di 3 e di 5 alle estremità fanno punti, di solito segnati su un tabellone da cribbage fino a 61.","desc":"Ogni 3 e ogni 5 contenuto nella somma delle estremità vale 1 punto: 15 = 8 punti, 12 = 4, 10 = 2. Nessuna pesca, e l’obiettivo va raggiunto esattamente.","rules":["Set doppio sei. Mani: 7 tessere con 2 giocatori, 5 con 3–4. Il resto NON si usa: nessuno pesca mai.","Dopo ogni tessera si sommano le estremità (un doppio a un’estremità conta entrambe le metà). Ogni 3 e ogni 5 contenuto nel totale dà un punto: 3 → 1, 5 → 1, 6 → 2, 9 → 3, 10 → 2, 12 → 4, 15 → 8, 18 → 6, 20 → 4.","Chi non ha mosse bussa (passa); passare è vietato se esiste una giocata.","Chi gioca la sua ultima tessera ottiene 1 punto extra («chip out»); un blocco non dà questo punto.","Il primo a raggiungere ESATTAMENTE 61 vince: un punteggio che porterebbe il totale oltre 61 è annullato per intero (compreso il punto di chip out). La partita si ferma nel momento in cui qualcuno raggiunge 61.","La mano successiva è aperta dal giocatore seguente in rotazione."],"approx":["Il gioco a coppie (4 giocatori) non è implementato: la loro regola «entrambi i compagni sono usciti» non è inclusa; in quattro si gioca ciascuno per sé.","Prima mano: apre chi ha il doppio più alto (invece del sorteggio).","IA: i livelli 1–3 qui giocano all’incirca allo stesso modo (test: ~50% tra i livelli); le differenze di livello sono reali solo nelle altre varianti."]},
  es:{"name":"Fives and Threes","origin":"Un juego británico popular: los múltiplos de 3 y de 5 en los extremos puntúan, y suelen anotarse en un tablero de cribbage hasta 61.","desc":"Cada 3 y cada 5 contenido en la suma de los extremos vale 1 punto: 15 = 8 puntos, 12 = 4, 10 = 2. Sin robo, y el objetivo debe alcanzarse exactamente.","rules":["Juego doble seis. Manos: 7 fichas con 2 jugadores, 5 con 3–4. El resto NO se usa: nadie roba nunca.","Tras cada ficha se suman los extremos (un doble en un extremo cuenta ambas mitades). Cada 3 y cada 5 contenido en el total da un punto: 3 → 1, 5 → 1, 6 → 2, 9 → 3, 10 → 2, 12 → 4, 15 → 8, 18 → 6, 20 → 4.","Quien no tiene jugada golpea la mesa (pasa); pasar es ilegal si existe una jugada.","Quien juega su última ficha obtiene 1 punto extra («chip out»); un bloqueo no da ese punto.","El primero en llegar EXACTAMENTE a 61 gana: una puntuación que haría pasar de 61 se anula por completo (incluido el punto de «chip out»). La partida se detiene en cuanto alguien llega a 61.","La mano siguiente la abre el siguiente jugador por turno."],"approx":["El juego por parejas (4 jugadores) no está implementado: su regla «ambos compañeros se han ido» no se incluye; cuatro jugadores juegan individualmente.","Primera mano: sale quien tenga el doble más alto (en lugar del sorteo).","IA: los niveles 1–3 juegan aquí más o menos igual (en las pruebas, ~50 % entre niveles); las diferencias de nivel solo son reales en las demás variantes."]},
  pt:{"name":"Fives and Threes","origin":"Um jogo britânico popular: os múltiplos de 3 e de 5 nas pontas pontuam, geralmente registados num tabuleiro de cribbage até 61.","desc":"Cada 3 e cada 5 contido na soma das pontas vale 1 ponto: 15 = 8 pontos, 12 = 4, 10 = 2. Sem compra, e o objetivo tem de ser atingido exatamente.","rules":["Conjunto duplo-seis. Mãos: 7 peças com 2 jogadores, 5 com 3–4. O resto NÃO é usado: ninguém compra nunca.","Depois de cada peça somam-se as pontas (um duplo numa ponta conta as duas metades). Cada 3 e cada 5 contido no total dá um ponto: 3 → 1, 5 → 1, 6 → 2, 9 → 3, 10 → 2, 12 → 4, 15 → 8, 18 → 6, 20 → 4.","Quem não tem jogada bate (passa); passar é ilegal se existir uma jogada.","Quem joga a sua última peça ganha 1 ponto extra («chip out»); um bloqueio não dá esse ponto.","O primeiro a chegar EXATAMENTE a 61 ganha: uma pontuação que levasse o total além de 61 é anulada por inteiro (incluindo o ponto de «chip out»). O jogo pára no momento em que alguém chega a 61.","A mão seguinte é aberta pelo jogador seguinte na rotação."],"approx":["O jogo em pares (4 jogadores) não está implementado: a regra «ambos os parceiros saíram» não está incluída; a quatro joga-se individualmente.","Primeira mão: abre quem tem o duplo mais alto (em vez do sorteio).","IA: os níveis 1–3 jogam aqui aproximadamente igual (nos testes, ~50 % entre níveis); as diferenças de nível só são reais nas outras variantes."]},
  de:{"name":"Fives and Threes","origin":"Ein beliebtes britisches Spiel: Vielfache von 3 und 5 an den Enden punkten, meist auf einem Cribbage-Brett bis 61 mitgezählt.","desc":"Jede 3 und jede 5 in der Summe der Enden ist 1 Punkt wert: 15 = 8 Punkte, 12 = 4, 10 = 2. Kein Nachziehen, und das Ziel muss genau getroffen werden.","rules":["Doppel-Sechs-Satz. Hände: 7 Steine bei 2 Spielenden, 5 bei 3–4. Der Rest wird NICHT benutzt: Niemand zieht je nach.","Nach jedem Stein werden die Enden addiert (ein Pasch an einem Ende zählt beide Hälften). Jede 3 und jede 5 in der Summe gibt einen Punkt: 3 → 1, 5 → 1, 6 → 2, 9 → 3, 10 → 2, 12 → 4, 15 → 8, 18 → 6, 20 → 4.","Wer keinen Zug hat, klopft (passt); Passen ist unzulässig, wenn ein Zug existiert.","Wer den letzten Stein legt, erhält 1 Zusatzpunkt („Chip out“); eine Blockade gibt diesen Punkt nicht.","Wer als Erste/r GENAU 61 erreicht, gewinnt: Eine Wertung, die über 61 hinausführen würde, verfällt vollständig (einschließlich des Chip-out-Punkts). Das Spiel endet in dem Moment, in dem jemand 61 trifft.","Die nächste Runde eröffnet die nächste Person in der Reihenfolge."],"approx":["Partnerspiel (4 Spielende) ist nicht umgesetzt: Die Regel „beide Partner sind fertig“ ist nicht enthalten; zu viert spielt jede Person für sich.","Erste Runde: Wer den höchsten Pasch hat, eröffnet (statt zu losen).","KI: Die Stufen 1–3 spielen hier etwa gleich gut (in Tests ~50 % zwischen den Stufen); die Stufenunterschiede sind nur in den anderen Varianten real."]},
  hu:{"name":"Fives and Threes","origin":"Népszerű brit játék: a végeken lévő 3 és 5 többszörösei pontot érnek, a pontokat rendszerint cribbage-táblán vezetik 61-ig.","desc":"A végek összegében foglalt minden 3 és minden 5 1 pontot ér: 15 = 8 pont, 12 = 4, 10 = 2. Nincs húzás, és a célt pontosan kell eltalálni.","rules":["Dupla hatos készlet. Leosztás: 2 játékosnál 7 kő, 3–4 játékosnál 5. A többit NEM használjuk: senki sem húz soha.","Minden kő után összeadjuk a végeket (a végen álló dupla mindkét felét számítja). Az összegben foglalt minden 3 és minden 5 egy pontot ad: 3 → 1, 5 → 1, 6 → 2, 9 → 3, 10 → 2, 12 → 4, 15 → 8, 18 → 6, 20 → 4.","Aki nem tud lépni, kopog (passzol); passzolni tilos, ha van lépés.","Aki az utolsó kövét lerakja, 1 extra pontot kap („chip out”); blokk esetén nincs ilyen pont.","Aki először ér el PONTOSAN 61-et, nyer: az a pontszerzés, amely az összeget 61 fölé vinné, teljes egészében érvénytelen (a chip out pontot is beleértve). A játék abban a pillanatban véget ér, amikor valaki eléri a 61-et.","A következő leosztást a sorban következő játékos kezdi."],"approx":["A páros játék (4 játékos) nincs megvalósítva: az „mindkét társ kiment” szabályuk nincs benne; négyen mindenki magáért játszik.","Első leosztás: a legnagyobb dupla birtokosa kezd (a sorsolás helyett).","MI: az 1–3. szint itt nagyjából egyformán játszik (a tesztekben ~50% a szintek között); a szintek közti különbség csak a többi változatban valós."]} },

{ id:'matador', vid:'matador', play:true, set:'6/9/12', players:[2,4], tags:['noscore','blocksum','draw','matador'], icon:[3,4],
  ro:{ name:'Matador (suma 7)',
    origin:'Familia „matador”: capetele care se ating trebuie să dea o sumă fixă (7 la double-6), iar câteva piese sunt jokeri.',
    desc:'Nu potrivești valorile egale, ci suma 7: lângă un 4 se pune o piesă cu 3. Matadorii (6-1, 5-2, 4-3 și dubla-albă) se pun oriunde.',
    rules:[
      'Set double-6 (opțional double-9 sau double-12). Mâna: 7 piese. Sursa descrie jocul pe 4 jucători.',
      'Piesele se pun pe oricare capăt al liniei dacă pipurile care se ating dau suma 7 (1 cu 6, 2 cu 5, 3 cu 4). Dublurile se pun în linie și nu au reguli speciale.',
      'Matadorii: 0-0, 1-6, 2-5, 3-4. Un matador se joacă pe orice capăt liber; capătul lui deschis (cel pe care îl alegi tu prin orientare) este cel pe care trebuie să-l potrivească piesa următoare (prin suma 7 sau cu alt matador).',
      'Un capăt cu 0 se continuă doar cu matador. Un matador nu e obligatoriu: dacă TOATE mutările tale folosesc matadori, poți trage din bon în loc să joci unul.',
      'Nu poți muta: tragi din bon până poți juca sau până rămân 2 piese; apoi pasezi.',
      'Set mai mare: la double-9 suma este 10 (matadori: 0-0, 1-9, 2-8, 3-7, 4-6, 5-5); la double-12 suma este 13 (0-0, 1-12 … 6-7).',
      'Sfârșit de mână și punctaj ca la Block (cel mai mic total câștigă diferența); ținta 100.'],
    approx:['Sursa descrie doar jocul pe 4 jucători; 2–3 jucători (aceeași mână de 7) sunt o extindere.',
            'Mărimea mâinii pentru seturile double-9/12 nu e specificată în sursă: se folosesc tot 7 piese. Lista matadorilor la double-9/12 (0-0 și toate piesele cu suma 10/13, inclusiv dublul 5-5 / 6-7) este extrapolată din regula de la double-6; sursa dă doar suma de potrivire.',
            'Sursa spune că regulile de pas diferă; am ales „tragi până poți juca sau rămân 2 piese”.',
            'Prima piesă: deținătorul celui mai mare dublu (regulă opțională din sursă).'] },
  en:{ name:'Matador (sum of 7)',
    origin:'The "matador" family: touching ends must add up to a fixed total (7 in double-six) and a few tiles are wild.',
    desc:'You do not match equal numbers but a sum of 7: next to a 4 you place a tile with a 3. The matadors (6-1, 5-2, 4-3 and the double blank) go anywhere.',
    rules:[
      'Double-six set (optionally double-nine or double-twelve). Hand: 7 tiles. The source describes four-handed play.',
      'Tiles go on either end of the line if the touching pips total 7 (1 with 6, 2 with 5, 3 with 4). Doubles are played in line and have no special rules.',
      'Matadors: 0-0, 1-6, 2-5, 3-4. A matador may be played on any free end; its open end (the one you choose by orientation) is what the next tile must match (by the sum of 7 or with another matador).',
      'An end showing 0 can only be continued with a matador. A matador is never compulsory: if ALL your plays use matadors you may draw from the boneyard instead.',
      'No move: draw from the boneyard until you can play or until 2 tiles remain; then pass.',
      'Larger sets: with double-nine the sum is 10 (matadors 0-0, 1-9, 2-8, 3-7, 4-6, 5-5); with double-twelve it is 13 (0-0, 1-12 … 6-7).',
      'End of hand and scoring as in Block (lowest total wins the difference); target 100.'],
    approx:['The source only describes four players; 2–3 players (same 7-tile hand) are an extension.',
            'The hand size for the double-9/12 sets is not specified in the source: 7 tiles are used. The matador list for double-9/12 (0-0 and every tile summing to 10/13, including the double 5-5) is extrapolated from the double-6 rule; the source only gives the matching sum.',
            'The source says passing rules differ; "draw until you can play or 2 tiles remain" was chosen.',
            'First tile: the holder of the highest double (an optional rule in the source).'] },
  fr:{"name":"Matador (somme de 7)","origin":"La famille « matador » : les extrémités qui se touchent doivent totaliser une somme fixe (7 en double-six) et quelques dominos sont des jokers.","desc":"On n’associe pas des nombres égaux mais une somme de 7 : à côté d’un 4 on pose un domino portant un 3. Les matadors (6-1, 5-2, 4-3 et le double blanc) se posent n’importe où.","rules":["Jeu double-six (en option double-neuf ou double-douze). Main : 7 dominos. La source décrit le jeu à quatre.","Les dominos se posent à l’une ou l’autre extrémité de la ligne si les points qui se touchent totalisent 7 (1 avec 6, 2 avec 5, 3 avec 4). Les doubles se jouent dans la ligne et n’ont aucune règle particulière.","Matadors : 0-0, 1-6, 2-5, 3-4. Un matador peut être joué sur n’importe quelle extrémité libre ; son extrémité ouverte (celle que vous choisissez par l’orientation) est celle que le domino suivant doit accompagner (par la somme de 7 ou avec un autre matador).","Une extrémité qui montre 0 ne peut être prolongée que par un matador. Un matador n’est jamais obligatoire : si TOUS vos coups passent par des matadors, vous pouvez piocher dans le talon à la place.","Sans coup possible : piochez dans le talon jusqu’à pouvoir jouer ou jusqu’à ce qu’il reste 2 dominos ; puis passez.","Jeux plus grands : avec le double-neuf la somme est 10 (matadors 0-0, 1-9, 2-8, 3-7, 4-6, 5-5) ; avec le double-douze elle est 13 (0-0, 1-12 … 6-7).","Fin de manche et décompte comme à Block (le total le plus bas gagne la différence) ; objectif 100."],"approx":["La source ne décrit que quatre joueurs ; 2–3 joueurs (même main de 7 dominos) sont une extension.","La taille de la main pour les jeux double-9/12 n’est pas précisée dans la source : 7 dominos sont utilisés. La liste des matadors pour les doubles-9/12 (0-0 et tout domino totalisant 10/13, y compris le double 5-5) est extrapolée de la règle du double-6 ; la source ne donne que la somme à respecter.","La source dit que les règles de passe diffèrent ; « piocher jusqu’à pouvoir jouer ou jusqu’à ce qu’il reste 2 dominos » a été retenu.","Premier domino : le détenteur du plus grand double (règle facultative de la source)."]},
  it:{"name":"Matador (somma di 7)","origin":"La famiglia «matador»: le estremità che si toccano devono sommare un totale fisso (7 nel doppio sei) e alcune tessere sono jolly.","desc":"Non si abbinano numeri uguali ma una somma di 7: accanto a un 4 si mette una tessera con un 3. I matador (6-1, 5-2, 4-3 e il doppio bianco) vanno ovunque.","rules":["Set doppio sei (facoltativamente doppio nove o doppio dodici). Mano: 7 tessere. La fonte descrive il gioco in quattro.","Le tessere vanno a una qualsiasi estremità della linea se i punti a contatto sommano 7 (1 con 6, 2 con 5, 3 con 4). I doppi si giocano in linea e non hanno regole particolari.","Matador: 0-0, 1-6, 2-5, 3-4. Un matador si può giocare su qualsiasi estremità libera; la sua estremità aperta (quella che scegli con l’orientamento) è quella a cui deve adattarsi la tessera successiva (con la somma di 7 o con un altro matador).","Un’estremità che mostra 0 si può continuare solo con un matador. Un matador non è mai obbligatorio: se TUTTE le tue giocate usano matador puoi invece pescare dal monte.","Nessuna mossa: pesca dal monte finché puoi giocare o finché restano 2 tessere; poi passa.","Set più grandi: con il doppio nove la somma è 10 (matador 0-0, 1-9, 2-8, 3-7, 4-6, 5-5); con il doppio dodici è 13 (0-0, 1-12 … 6-7).","Fine mano e punteggio come in Block (il totale più basso vince la differenza); obiettivo 100."],"approx":["La fonte descrive solo quattro giocatori; 2–3 giocatori (stessa mano da 7 tessere) sono un’estensione.","La dimensione della mano per i set doppio 9/12 non è specificata nella fonte: si usano 7 tessere. L’elenco dei matador per i doppi 9/12 (0-0 e ogni tessera che somma 10/13, compreso il doppio 5-5) è estrapolato dalla regola del doppio 6; la fonte indica solo la somma da rispettare.","La fonte dice che le regole sul passare differiscono; è stato scelto «pescare finché si può giocare o finché restano 2 tessere».","Prima tessera: chi ha il doppio più alto (regola facoltativa della fonte)."]},
  es:{"name":"Matador (suma de 7)","origin":"La familia «matador»: los extremos que se tocan deben sumar un total fijo (7 en doble seis) y algunas fichas son comodín.","desc":"No se emparejan números iguales sino una suma de 7: junto a un 4 se coloca una ficha con un 3. Los matadores (6-1, 5-2, 4-3 y el doble blanco) van en cualquier lugar.","rules":["Juego doble seis (opcionalmente doble nueve o doble doce). Mano: 7 fichas. La fuente describe el juego a cuatro.","Las fichas van en cualquiera de los extremos de la línea si los puntos que se tocan suman 7 (1 con 6, 2 con 5, 3 con 4). Los dobles se juegan en línea y no tienen reglas especiales.","Matadores: 0-0, 1-6, 2-5, 3-4. Un matador puede jugarse en cualquier extremo libre; su extremo abierto (el que eliges con la orientación) es el que debe acompañar la ficha siguiente (por la suma de 7 o con otro matador).","Un extremo que muestra 0 solo puede continuarse con un matador. Un matador nunca es obligatorio: si TODAS tus jugadas usan matadores, puedes robar del pozo en su lugar.","Sin jugada: roba del pozo hasta poder jugar o hasta que queden 2 fichas; después pasa.","Juegos mayores: con el doble nueve la suma es 10 (matadores 0-0, 1-9, 2-8, 3-7, 4-6, 5-5); con el doble doce es 13 (0-0, 1-12 … 6-7).","Fin de la mano y puntuación como en Block (el total más bajo gana la diferencia); objetivo 100."],"approx":["La fuente solo describe cuatro jugadores; 2–3 jugadores (misma mano de 7 fichas) son una extensión.","El tamaño de la mano para los juegos doble 9/12 no se especifica en la fuente: se usan 7 fichas. La lista de matadores para doble 9/12 (0-0 y toda ficha que sume 10/13, incluido el doble 5-5) se extrapola de la regla del doble 6; la fuente solo da la suma que se debe cumplir.","La fuente dice que las reglas de paso difieren; se eligió «robar hasta poder jugar o hasta que queden 2 fichas».","Primera ficha: quien tenga el doble más alto (regla opcional de la fuente)."]},
  pt:{"name":"Matador (soma de 7)","origin":"A família «matador»: as pontas que se tocam têm de somar um total fixo (7 no duplo-seis) e algumas peças são curinga.","desc":"Não se emparelham números iguais mas uma soma de 7: ao lado de um 4 coloca-se uma peça com um 3. Os matadores (6-1, 5-2, 4-3 e o duplo-branco) vão para qualquer lado.","rules":["Conjunto duplo-seis (opcionalmente duplo-nove ou duplo-doze). Mão: 7 peças. A fonte descreve o jogo a quatro.","As peças vão a qualquer ponta da linha se os pontos em contacto somarem 7 (1 com 6, 2 com 5, 3 com 4). Os duplos jogam-se na linha e não têm regras especiais.","Matadores: 0-0, 1-6, 2-5, 3-4. Um matador pode jogar-se em qualquer ponta livre; a sua ponta aberta (a que escolhes pela orientação) é aquela a que a peça seguinte tem de corresponder (pela soma de 7 ou com outro matador).","Uma ponta que mostra 0 só pode continuar com um matador. Um matador nunca é obrigatório: se TODAS as tuas jogadas usam matadores, podes comprar do monte em vez disso.","Sem jogada: compra do monte até poderes jogar ou até restarem 2 peças; depois passa.","Conjuntos maiores: com o duplo-nove a soma é 10 (matadores 0-0, 1-9, 2-8, 3-7, 4-6, 5-5); com o duplo-doze é 13 (0-0, 1-12 … 6-7).","Fim da mão e pontuação como em Block (o total mais baixo ganha a diferença); objetivo 100."],"approx":["A fonte só descreve quatro jogadores; 2–3 jogadores (a mesma mão de 7 peças) são uma extensão.","O tamanho da mão para os conjuntos duplo-9/12 não é especificado na fonte: usam-se 7 peças. A lista de matadores para duplo-9/12 (0-0 e toda a peça que some 10/13, incluindo o duplo 5-5) é extrapolada da regra do duplo-6; a fonte só indica a soma a respeitar.","A fonte diz que as regras de passar diferem; escolheu-se «comprar até poder jogar ou até restarem 2 peças».","Primeira peça: quem tem o duplo mais alto (regra opcional da fonte)."]},
  de:{"name":"Matador (Summe 7)","origin":"Die „Matador“-Familie: Sich berührende Enden müssen eine feste Summe ergeben (7 beim Doppel-Sechs-Satz), und einige Steine sind Joker.","desc":"Man legt nicht gleiche Zahlen aneinander, sondern eine Summe von 7: Neben eine 4 kommt ein Stein mit einer 3. Die Matadore (6-1, 5-2, 4-3 und der Doppel-Blanko) passen überall.","rules":["Doppel-Sechs-Satz (wahlweise Doppel-Neun oder Doppel-Zwölf). Hand: 7 Steine. Die Quelle beschreibt das Spiel zu viert.","Steine werden an eines der beiden Enden der Reihe gelegt, wenn die sich berührenden Augen 7 ergeben (1 mit 6, 2 mit 5, 3 mit 4). Päsche werden in der Reihe gelegt und haben keine Sonderregeln.","Matadore: 0-0, 1-6, 2-5, 3-4. Ein Matador darf an jedes freie Ende gelegt werden; sein offenes Ende (das man durch die Ausrichtung wählt) ist das, an das der nächste Stein passen muss (mit der Summe 7 oder mit einem anderen Matador).","Ein Ende mit 0 kann nur mit einem Matador fortgesetzt werden. Ein Matador ist nie Pflicht: Wenn ALLE deine Züge Matadore benutzen, darfst du stattdessen vom Vorrat ziehen.","Kein Zug: Vom Vorrat ziehen, bis man legen kann oder bis 2 Steine übrig sind; dann passen.","Größere Sätze: Beim Doppel-Neun-Satz ist die Summe 10 (Matadore 0-0, 1-9, 2-8, 3-7, 4-6, 5-5); beim Doppel-Zwölf-Satz 13 (0-0, 1-12 … 6-7).","Rundenende und Wertung wie bei Block (die niedrigste Summe gewinnt die Differenz); Ziel 100."],"approx":["Die Quelle beschreibt nur vier Spielende; 2–3 Spielende (gleiche Hand von 7 Steinen) sind eine Erweiterung.","Die Handgröße für die Doppel-9/12-Sätze ist in der Quelle nicht angegeben: Es werden 7 Steine benutzt. Die Matador-Liste für Doppel-9/12 (0-0 und jeder Stein mit Summe 10/13, einschließlich des Pasch 5-5) ist aus der Doppel-6-Regel hochgerechnet; die Quelle nennt nur die zu erreichende Summe.","Die Quelle sagt, die Passregeln unterscheiden sich; gewählt wurde „ziehen, bis man legen kann oder 2 Steine übrig sind“.","Erster Stein: Wer den höchsten Pasch hat (optionale Regel der Quelle)."]},
  hu:{"name":"Matador (7-es összeg)","origin":"A „matador” család: az érintkező végeknek egy rögzített összeget kell kiadniuk (dupla hatosnál 7), és néhány kő joker.","desc":"Nem egyenlő számokat illesztünk, hanem 7-es összeget: a 4-es mellé 3-ast tartalmazó követ teszünk. A matadorok (6-1, 5-2, 4-3 és a dupla üres) bárhová mehetnek.","rules":["Dupla hatos készlet (választhatóan dupla kilences vagy dupla tizenkettes). Leosztás: 7 kő. A forrás a négyszemélyes játékot írja le.","A kövek a sor bármelyik végére kerülhetnek, ha az érintkező pontok összege 7 (1 a 6-tal, 2 az 5-tel, 3 a 4-gyel). A dupláknak a sorban a helyük, és nincs rájuk különleges szabály.","Matadorok: 0-0, 1-6, 2-5, 3-4. A matador bármelyik szabad végre rakható; nyitott vége (amelyet a tájolással választasz meg) az, amelyhez a következő követ illeszteni kell (a 7-es összeg szerint vagy egy másik matadorral).","A 0-t mutató véget csak matadorral lehet folytatni. A matador sosem kötelező: ha MINDEN lépésed matadort használ, a kupacból húzhatsz helyette.","Ha nincs lépés: húzz a kupacból, amíg lépni tudsz, vagy amíg 2 kő marad; utána passzolj.","Nagyobb készletek: a dupla kilenceseknél az összeg 10 (matadorok: 0-0, 1-9, 2-8, 3-7, 4-6, 5-5); a dupla tizenkettesnél 13 (0-0, 1-12 … 6-7).","A leosztás vége és a pontozás mint a Blocknál (a legkisebb összeg nyeri a különbséget); cél: 100."],"approx":["A forrás csak négy játékost ír le; a 2–3 játékos (ugyanaz a 7 köves leosztás) kiterjesztés.","A dupla 9/12 készletek leosztásának mérete nincs megadva a forrásban: 7 követ használunk. A dupla 9/12 matadorlistája (0-0 és minden 10/13 összegű kő, az 5-5 duplát is beleértve) a dupla 6 szabályából extrapolált; a forrás csak az illesztési összeget adja meg.","A forrás szerint a passzolás szabályai eltérnek; a „húzz, amíg lépni tudsz, vagy amíg 2 kő marad” változatot választottuk.","Az első kő: a legnagyobb dupla birtokosáé (a forrás választható szabálya)."]} },

{ id:'latin100', vid:'latin100', play:true, set:'6', players:[4,4], tags:['noscore','team','blocksum','latin'], icon:[6,6],
  ro:{ name:'Domino latin pe echipe (stil venezuelean, la 100)',
    origin:'Jocul de masă 2 contra 2 din America Latină: partenerii stau vizavi, toate cele 28 de piese se împart (7 fiecăruia).',
    desc:'Patru jucători, două echipe, fără bon. Dacă nu ai piesă potrivită pasezi („pase”); dacă pasează toți patru, jocul e blocat („tranque”) și contează totalurile echipelor.',
    rules:[
      'Set double-6, 4 jucători în 2 echipe (partenerii stau față în față), 7 piese fiecare — nu rămâne bon. Se joacă în sens invers acelor de ceasornic.',
      'Prima mână a partidei: deținătorul lui 6-6 deschide obligatoriu cu el. Mâinile următoare: începe următorul jucător în rotație, cu orice piesă.',
      'O singură linie, valori egale; dublurile se pun transversal, fără spinner. Cine nu are piesă potrivită pasează („pase”). Observă pasele: îți spun ce valori n-au adversarii și partenerul.',
      'Mâna se termină când cineva rămâne fără piese (echipa lui câștigă) sau când pasează toți patru consecutiv („tranque” = blocaj).',
      'La blocaj câștigă echipa ale cărei piese rămase au totalul mai mic; la egalitate nimeni nu punctează și mâna se reia cu următorul în rotație.',
      'Echipa câștigătoare încasează punctele pieselor rămase ale ADVERSARILOR (nu și ale partenerului). Ținta: 100 de puncte.',
      '„Capot”: partida câștigată în timp ce adversarii au rămas la 0 puncte — aplicația îl semnalează.'],
    approx:['Se implementează varianta VENEZUELEANĂ descrisă pe Pagat (următoarea mână o începe jucătorul următor în rotație; blocaj egal = nimeni nu punctează). Varianta mexicană diferă: acolo câștigătorul mâinii începe mâna următoare, iar la blocaj egal câștigă echipa care a început mâna — NU sunt implementate. Variantele cubaneză și dominicană nu sunt descrise de sursă și nu se pretinde că sunt reproduse.',
            'Nu este implementată regula „refacerea mâinii” (5 dubluri) și nici bonusurile capicúa / chuchazo / dominao ale variantei Quinientos.',
            'Termenii din brief: „pase” = abținerea de la mutare; „pase mutuală” = tranque (toți pasează); „capot” = victorie cu adversarii la 0 (definiție aleasă, nu normă federală).'] },
  en:{ name:'Latin partnership dominoes (Venezuelan style, to 100)',
    origin:'The 2-versus-2 table game of Latin America: partners sit opposite and all 28 tiles are dealt (7 each).',
    desc:'Four players, two teams, no boneyard. With no matching tile you pass ("pase"); if all four pass the game is blocked ("tranque") and the team totals decide.',
    rules:[
      'Double-six set, 4 players in 2 teams (partners face each other), 7 tiles each — no boneyard. Play runs counter-clockwise.',
      'First hand of a match: the holder of 6-6 must lead it. Later hands: the next player in rotation leads, any tile.',
      'A single line, equal values; doubles crosswise, no spinner. A player with no matching tile passes ("pase"). Watch the passes: they tell you which numbers opponents and partner lack.',
      'The hand ends when someone plays their last tile (their team wins) or when all four players pass in succession ("tranque" = block).',
      'In a block the team whose remaining tiles total fewer pips wins; on a tie nobody scores and the next player in rotation leads.',
      'The winning team scores the pips left in the OPPONENTS\' hands (not the partner\'s). Target: 100 points.',
      '"Capot": a match won while the opponents are still on 0 — the app points it out.'],
    approx:['The VENEZUELAN version described on Pagat is implemented (the next hand is led by the next player in rotation; a tied block scores nothing). The Mexican version differs: there the winner of a hand leads the next, and a tied block goes to the team that started the hand — NOT implemented. The Cuban and Dominican versions are not described by the source and are not claimed to be reproduced.',
            'The redeal rule (5 doubles) and the capicú / chuchazo / dominao bonuses of the Quinientos version are not implemented.',
            'Terms from the brief: "pase" = skipping a turn; "mutual pase" = tranque (everyone passes); "capot" = winning with the opponents on 0 (a chosen definition, not a federation standard).'] },
  fr:{"name":"Domino latin en équipes (style vénézuélien, à 100)","origin":"Le jeu de table à 2 contre 2 d’Amérique latine : les partenaires sont assis face à face et les 28 dominos sont distribués (7 chacun).","desc":"Quatre joueurs, deux équipes, pas de talon. Sans domino qui convienne on passe (« pase ») ; si les quatre passent, le jeu est bloqué (« tranque ») et les totaux d’équipe décident.","rules":["Jeu double-six, 4 joueurs en 2 équipes (les partenaires face à face), 7 dominos chacun — pas de talon. Le jeu tourne dans le sens inverse des aiguilles d’une montre.","Première manche d’une partie : le détenteur du 6-6 doit l’ouvrir. Manches suivantes : le joueur suivant dans l’ordre ouvre, avec n’importe quel domino.","Une seule ligne, valeurs égales ; doubles en travers, pas de spinner. Un joueur sans domino qui convienne passe (« pase »). Surveillez les passes : elles vous disent quels nombres manquent aux adversaires et au partenaire.","La manche se termine quand quelqu’un pose son dernier domino (son équipe gagne) ou quand les quatre joueurs passent à la suite (« tranque » = blocage).","En cas de blocage, l’équipe dont les dominos restants totalisent le moins de points gagne ; en cas d’égalité personne ne marque et le joueur suivant dans l’ordre ouvre.","L’équipe gagnante marque les points restant dans les mains des ADVERSAIRES (pas dans celle du partenaire). Objectif : 100 points.","« Capot » : une partie gagnée alors que les adversaires sont encore à 0 — l’application le signale."],"approx":["C’est la version VÉNÉZUÉLIENNE décrite sur Pagat qui est implémentée (la manche suivante est ouverte par le joueur suivant dans l’ordre ; un blocage à égalité ne rapporte rien). La version mexicaine diffère : le gagnant d’une manche ouvre la suivante, et un blocage à égalité va à l’équipe qui a commencé la manche — NON implémenté. Les versions cubaine et dominicaine ne sont pas décrites par la source et on ne prétend pas les reproduire.","La règle de redistribution (5 doubles) et les bonus capicú / chuchazo / dominao de la version Quinientos ne sont pas implémentés.","Termes du cahier des charges : « pase » = saut de tour ; « pase mutuel » = tranque (tout le monde passe) ; « capot » = gagner alors que les adversaires sont à 0 (définition retenue, pas un standard fédéral)."]},
  it:{"name":"Domino latino a coppie (stile venezuelano, a 100)","origin":"Il gioco da tavolo 2 contro 2 dell’America Latina: i compagni siedono di fronte e si distribuiscono tutte le 28 tessere (7 a testa).","desc":"Quattro giocatori, due squadre, nessun monte. Senza una tessera adatta si passa («pase»); se passano tutti e quattro il gioco è bloccato («tranque») e decidono i totali delle squadre.","rules":["Set doppio sei, 4 giocatori in 2 squadre (i compagni di fronte), 7 tessere a testa — nessun monte. Si gioca in senso antiorario.","Prima mano di una partita: chi ha il 6-6 deve aprire con quello. Mani successive: apre il giocatore seguente in rotazione, con qualsiasi tessera.","Una sola linea, valori uguali; doppi di traverso, nessuno spinner. Chi non ha una tessera adatta passa («pase»). Osserva i passi: ti dicono quali numeri mancano agli avversari e al compagno.","La mano finisce quando qualcuno gioca la sua ultima tessera (vince la sua squadra) o quando tutti e quattro passano di seguito («tranque» = blocco).","In un blocco vince la squadra le cui tessere rimaste sommano meno punti; in caso di parità nessuno segna e apre il giocatore seguente in rotazione.","La squadra vincente segna i punti rimasti nelle mani degli AVVERSARI (non del compagno). Obiettivo: 100 punti.","«Capot»: una partita vinta mentre gli avversari sono ancora a 0 — l’app lo segnala."],"approx":["È implementata la versione VENEZUELANA descritta su Pagat (la mano successiva è aperta dal giocatore seguente in rotazione; un blocco in parità non assegna nulla). La versione messicana è diversa: lì il vincitore di una mano apre la successiva, e un blocco in parità va alla squadra che aveva iniziato la mano — NON implementata. Le versioni cubana e dominicana non sono descritte dalla fonte e non si pretende di riprodurle.","La regola della ridistribuzione (5 doppi) e i bonus capicú / chuchazo / dominao della versione Quinientos non sono implementati.","Termini dal capitolato: «pase» = saltare il turno; «pase mutuo» = tranque (passano tutti); «capot» = vincere con gli avversari a 0 (definizione scelta, non uno standard federale)."]},
  es:{"name":"Dominó latino por parejas (estilo venezolano, a 100)","origin":"El juego de mesa de 2 contra 2 de América Latina: los compañeros se sientan enfrente y se reparten las 28 fichas (7 cada uno).","desc":"Cuatro jugadores, dos equipos, sin pozo. Sin ficha que encaje se pasa («pase»); si pasan los cuatro, el juego queda bloqueado («tranque») y deciden los totales de los equipos.","rules":["Juego doble seis, 4 jugadores en 2 equipos (los compañeros frente a frente), 7 fichas cada uno — sin pozo. Se juega en sentido contrario a las agujas del reloj.","Primera mano de una partida: quien tiene el 6-6 debe salir con él. Manos siguientes: sale el siguiente jugador por turno, con cualquier ficha.","Una sola línea, valores iguales; dobles en cruz, sin spinner. Quien no tiene ficha que encaje pasa («pase»). Fíjate en los pases: te dicen qué números les faltan a los rivales y al compañero.","La mano termina cuando alguien juega su última ficha (gana su equipo) o cuando los cuatro jugadores pasan seguidos («tranque» = bloqueo).","En un bloqueo gana el equipo cuyas fichas restantes suman menos puntos; en caso de empate nadie puntúa y sale el siguiente jugador por turno.","El equipo ganador anota los puntos que quedan en las manos de los CONTRARIOS (no los del compañero). Objetivo: 100 puntos.","«Capot»: una partida ganada mientras los rivales siguen a 0 — la aplicación lo señala."],"approx":["Se implementa la versión VENEZOLANA descrita en Pagat (la mano siguiente la abre el siguiente jugador por turno; un bloqueo empatado no puntúa). La versión mexicana difiere: allí el ganador de una mano abre la siguiente, y un bloqueo empatado es para el equipo que empezó la mano — NO implementada. Las versiones cubana y dominicana no están descritas en la fuente y no se pretende reproducirlas.","La regla de nuevo reparto (5 dobles) y las bonificaciones capicú / chuchazo / dominao de la versión Quinientos no están implementadas.","Términos del enunciado: «pase» = saltarse el turno; «pase mutuo» = tranque (todos pasan); «capot» = ganar con los rivales a 0 (definición elegida, no un estándar federativo)."]},
  pt:{"name":"Dominó latino em pares (estilo venezuelano, a 100)","origin":"O jogo de mesa de 2 contra 2 da América Latina: os parceiros sentam-se em frente e distribuem-se as 28 peças (7 cada).","desc":"Quatro jogadores, duas equipas, sem monte. Sem peça que sirva passa-se («pase»); se passarem os quatro, o jogo fica bloqueado («tranque») e decidem os totais das equipas.","rules":["Conjunto duplo-seis, 4 jogadores em 2 equipas (os parceiros frente a frente), 7 peças cada — sem monte. Joga-se no sentido contrário ao dos ponteiros do relógio.","Primeira mão de uma partida: quem tem o 6-6 tem de abrir com ele. Mãos seguintes: abre o jogador seguinte na rotação, com qualquer peça.","Uma única linha, valores iguais; duplos atravessados, sem spinner. Quem não tem peça que sirva passa («pase»). Presta atenção às passagens: dizem-te que números faltam aos adversários e ao parceiro.","A mão termina quando alguém joga a sua última peça (a sua equipa ganha) ou quando os quatro jogadores passam seguidamente («tranque» = bloqueio).","Num bloqueio ganha a equipa cujas peças restantes somam menos pontos; em caso de empate ninguém pontua e abre o jogador seguinte na rotação.","A equipa vencedora marca os pontos que restam nas mãos dos ADVERSÁRIOS (não os do parceiro). Objetivo: 100 pontos.","«Capot»: uma partida ganha enquanto os adversários ainda estão a 0 — a aplicação assinala-o."],"approx":["Está implementada a versão VENEZUELANA descrita no Pagat (a mão seguinte é aberta pelo jogador seguinte na rotação; um bloqueio empatado não pontua). A versão mexicana difere: aí o vencedor de uma mão abre a seguinte, e um bloqueio empatado vai para a equipa que começou a mão — NÃO implementada. As versões cubana e dominicana não são descritas pela fonte e não se pretende reproduzi-las.","A regra de nova distribuição (5 duplos) e as bonificações capicú / chuchazo / dominao da versão Quinientos não estão implementadas.","Termos do caderno de encargos: «pase» = saltar a vez; «pase mútuo» = tranque (todos passam); «capot» = ganhar com os adversários a 0 (definição escolhida, não um padrão federativo)."]},
