function showOver(){
  if(!G) return;
  G.undo = [];
  var st = G.st, body = $('overBody'), foot = $('overFoot'); clear(body); clear(foot);
  var over = st.phase === 'gameOver';
  var title, i, tb, tr, th;
  if(st.fam === 'train'){
    var r = st.roundResult;
    title = over ? t('h.finalTitle') : t('h.roundTitle', { n: st.round + 1 });
    body.appendChild(el('p', 'big', r.reason === 'out' ? t('h.outTrain', { name: pname(r.outP) }) : t('h.blockedTrain')));
    tb = el('table', 'sumtable'); th = el('tr');
    ['', t('h.remaining'), t('h.penalty'), t('h.total')].forEach(function(x, k){ var c = el('th', k > 1 ? 'num' : null, x); th.appendChild(c); }); tb.appendChild(th);
    for(i = 0; i < st.np; i++){
      tr = el('tr'); tr.appendChild(el('td', null, pname(i))); var c2 = el('td'); c2.appendChild(remTiles(st, i)); tr.appendChild(c2);
      tr.appendChild(el('td', 'num', '+' + r.scores[i])); tr.appendChild(el('td', 'num', String(st.totals[i]))); tb.appendChild(tr);
    }
    body.appendChild(tb);
    if(over){
      var wn = st.winners.map(pname).join(', ');
      body.appendChild(el('p', 'big', t('h.won', { name: wn })));
      bumpStats(st.winners.indexOf(0) >= 0);
    }
  } else {
    var res = st.handResult;
    title = over ? t('h.finalTitle') : t('h.handTitle', { n: st.handNo + 1 });
    var line;
    if(res.reason === 'target') line = t('h.target');
    else if(res.reason === 'domino') line = t('h.domino', { name: pname(res.outP) });
    else line = t('h.blocked');
    body.appendChild(el('p', 'big', line));
    tb = el('table', 'sumtable'); th = el('tr');
    ['', t('h.remaining'), t('h.pips')].forEach(function(x, k){ th.appendChild(el('th', k > 1 ? 'num' : null, x)); }); tb.appendChild(th);
    for(i = 0; i < st.np; i++){
      tr = el('tr'); tr.appendChild(el('td', null, pname(i) + (st.teams ? ' (' + (st.entOf[i] === 0 ? t('g.teamYou') : t('g.teamThem')) + ')' : '')));
      var c3 = el('td'); c3.appendChild(remTiles(st, i)); tr.appendChild(c3); tr.appendChild(el('td', 'num', String(res.pips[i]))); tb.appendChild(tr);
    }
    body.appendChild(tb);
    var tb2 = el('table', 'sumtable'); var th2 = el('tr');
    [t('g.score'), t('h.gain'), t('h.total')].forEach(function(x, k){ th2.appendChild(el('th', k ? 'num' : null, x)); }); tb2.appendChild(th2);
    for(var e = 0; e < st.nEnt; e++){
      var tr2 = el('tr'); tr2.appendChild(el('td', null, entName(st, e)));
      var g = res.gains[e]; tr2.appendChild(el('td', 'num', (g > 0 ? '+' : '') + g)); tr2.appendChild(el('td', 'num', String(st.scores[e]))); tb2.appendChild(tr2);
    }
    body.appendChild(tb2);
    if(res.tie && st.cfg.handEnd !== 'subtract' && st.cfg.handEnd !== 'f53') body.appendChild(el('p', null, t('h.tie')));
    if(st.tieAtTarget && !over) body.appendChild(el('p', null, t('h.tieTarget')));
    if(over){
      var wnm = entName(st, st.winnerEnt);
      body.appendChild(el('p', 'big', t('h.won', { name: wnm })));
      if(st.capot) body.appendChild(el('p', 'big', t('h.capot')));
      bumpStats(st.winnerEnt === st.entOf[0]);
    }
  }
  $('overTitle').textContent = title;
  if(over){
    var again = el('button', 'btn pri', t('h.again')); again.type = 'button';
    again.addEventListener('click', function(){ closeDlg($('dlgOver')); startMatch(G.vid, G.setup); });
    var back = el('button', 'btn', t('g.back')); back.type = 'button';
    back.addEventListener('click', function(){ closeDlg($('dlgOver')); leaveGame(); });
    var cl = el('button', 'btn', t('g.close')); cl.type = 'button'; cl.addEventListener('click', function(){ closeDlg($('dlgOver')); });
    foot.appendChild(cl); foot.appendChild(back); foot.appendChild(again);
  } else {
    var nx = el('button', 'btn pri', st.fam === 'train' ? t('h.nextRound') : t('h.nextHand')); nx.type = 'button'; nx.id = 'btnNextHand';
    nx.addEventListener('click', function(){
      closeDlg($('dlgOver'));

      pushLog(t('log.nextHand', { name: pname(st.starter) }));
      renderAll(); scheduleNext();
    });
    var cl2 = el('button', 'btn', t('g.close')); cl2.type = 'button'; cl2.addEventListener('click', function(){ closeDlg($('dlgOver')); });
    foot.appendChild(cl2); foot.appendChild(nx);
  }
  renderActions();
  openDlg($('dlgOver'));
  var f = $('btnNextHand') || foot.lastChild; if(f) f.focus();
}
function bumpStats(won){

}

X.initGame = function(){

    var btns = Array.prototype.slice.call($('hand').querySelectorAll('button')); if(!btns.length) return;
    var i = btns.indexOf(document.activeElement); if(i < 0) i = 0;
    if(k === 'ArrowRight' || k === 'ArrowDown') i = (i + 1) % btns.length;
    else if(k === 'ArrowLeft' || k === 'ArrowUp') i = (i - 1 + btns.length) % btns.length;
    else if(k === 'Home') i = 0; else i = btns.length - 1;
    btns.forEach(function(b){ b.tabIndex = -1; }); btns[i].tabIndex = 0; btns[i].focus(); ev.preventDefault();
  });

    if(!G || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var tg = ev.target; if(tg && (tg.tagName === 'INPUT' || tg.tagName === 'SELECT' || tg.tagName === 'TEXTAREA')) return;

  });
  box.appendChild(tb);
}
function init(){
  X.loadPrefs();
  $('symbols').innerHTML = X.symbolsMarkup();
  var sel = $('langSel');
  X.LANGS.forEach(function(l){ var o = el('option', null, X.LANG_NAMES[l]); o.value = l; sel.appendChild(o); });
  sel.value = prefs.lang;
  sel.addEventListener('change', function(){ prefs.lang = sel.value; X.savePrefs(); fullRefresh(); });
  $('btnTheme').addEventListener('click', function(){ prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark'; X.savePrefs(); X.applyTheme(); });
  $('btnSize').addEventListener('click', function(){ prefs.size = SIZES[(SIZES.indexOf(prefs.size) + 1) % 3]; X.savePrefs(); X.applyTheme(); syncToggles(); X.refreshGame(); });
  $('btnNum').addEventListener('click', function(){ prefs.num = !prefs.num; X.savePrefs(); syncToggles(); X.renderAtlasAll(); X.refreshGame(); });
  $('btnAuto').addEventListener('click', function(){ prefs.auto = !prefs.auto; X.savePrefs(); syncToggles(); });
  $('btnAbout').addEventListener('click', function(){ X.openDlg($('dlgAbout')); });
  $('btnStats').addEventListener('click', function(){ renderStats(); X.openDlg($('dlgStats')); });
  $('statsReset').addEventListener('click', function(){ var s = X.stats(); Object.keys(s).forEach(function(k){ delete s[k]; }); X.savePrefs(); renderStats(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function(b){ b.addEventListener('click', function(){ X.closeDlg($(b.getAttribute('data-close'))); }); });
  $('tabAtlas').addEventListener('click', function(){ X.showView('atlas'); });
  $('tabGame').addEventListener('click', function(){ if(X.gameActive()) X.showView('game'); });
  X.initAtlas(); X.initGame();
  X.applyI18n(); X.applyTheme(); syncToggles(); renderSources();
  X.showView('atlas'); booting = false;
  try { window.scrollTo(0, 0); } catch(e){}
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
